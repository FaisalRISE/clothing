          <input id="omCutter" type="number" step="100" value="${esc(o.cutterCost ?? "")}">
        </div>
        <div class="field">
          <label>Karigar / Stitching Cost (₹)</label>
          <input id="omKarigarCost" type="number" step="100" value="${esc(o.karigarCost ?? "")}">
        </div>
        <div class="field">
          <label>Trial / Shipping Cost (₹)</label>
          <input id="omShip" type="number" step="100" value="${esc(o.trialShippingCost ?? "")}">
        </div>
        <div class="field">
          <label>Estimated Craft Hours</label>
          <input id="omEstHours" type="number" step="1" value="${esc(o.estHours ?? "")}">
        </div>
        <div class="field">
          <label>Actual Craft Hours Spent</label>
          <input id="omHours" type="number" step="1" value="${esc(o.hoursSpent ?? "")}">
        </div>
        <div class="field">
          <label class="req">Client Quoted Price (₹)</label>
          <input id="omAmount" type="number" step="500" value="${esc(o.amount ?? "")}">
        </div>
        <div class="field">
          <label for="omAdvance">Recorded received total (₹)</label>
          <input id="omAdvance" type="number" step="500" value="${esc(o.advancePaid ?? "")}">
          <small>Enter verified cumulative receipts, including advance and final payments. Individual payment transactions are not tracked here.</small>
        </div>
        <div class="field full" style="grid-column: span 2;">
          <label>Bottleneck / Pain Point Note (If Delayed)</label>
          <input id="omPainPoint" value="${esc(o.painPointNote || "")}" placeholder="e.g. Trial rescheduled, awaiting mill fabric, extra hand-padding…">
        </div>
      </div>
      <div id="liveCostSummary" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--gold-soft);display:flex;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;"></div>
    </div>

    <div class="field full" style="margin-top:10px;">
      <label>Order &amp; Trial Notes</label>
      <textarea id="omNotes">${esc(o.notes || "")}</textarea>
    </div>
    ${o.garmentJobs?.length ? `<div class="card" style="margin-top:12px;">
      <h3>Fabric &amp; payment review</h3>
      <p>${o.commercialReviewRequired ? "Garments have changed. Review the order totals and fabric reservation before confirming." : "Changes to order totals are recorded with a reason."}</p>
      <div class="field"><label for="omReserved">Reserved fabric (m)</label><input type="number" min="0" step="any" id="omReserved" value="${esc(orderFabricReservation(o))}"></div>
      <p>Use 0 to release the order's remaining fabric reservation. Fabric metres used for costing, recorded costs, quote and advance remain separate totals above. Stock already marked as allocated in the fabric library is not rewritten.</p>
      <div class="field"><label for="omAdjustmentReason">Reason / review note</label><textarea id="omAdjustmentReason" placeholder="Record the agreed change, or explain why totals remain unchanged"></textarea></div>
      <label style="display:flex;align-items:start;gap:8px;"><input type="checkbox" id="omReviewConfirmed" style="width:22px;height:22px;flex-shrink:0;">I have reviewed fabric, quote and recorded received total for these garment changes.</label>
      <p>This records reviewed totals; it does not process a refund or create a payment transaction.</p>
      <p id="omReviewError" role="alert"></p>
    </div>` : ""}

    <div class="actions">
      ${o.id && !o.garmentJobs?.length ? `<button class="btn danger" id="omDelete" style="margin-right:auto;">Delete Order</button>` : ""}
      <button class="btn" id="omCancel">Cancel</button>
      <button class="btn primary" id="omSave">${o.id ? "Save Order & Costing" : "Create Order"}</button>
    </div>
  `);

  const updateLiveCalc = () => {
    const reqM = $("#omMeters").value === "" ? null : Number($("#omMeters").value);
    const swCode = $("#omSwatch").value;
    const sw = getSwatchByCode(swCode);
    const stockBox = $("#omStockAlertBox");

    if (sw && stockBox && reqM !== null) {
      const stockM = parseFloat(sw.stockMeters) || 0;
      if (reqM > stockM) {
        const shortBy = Math.round((reqM - stockM) * 100) / 100;
        stockBox.innerHTML = `<div class="shortage-banner">
          <span><b>⚠ FABRIC SHORTAGE HIGHLIGHT (${esc(sw.code)}):</b> This order requires <b>${reqM} m</b>, but only <b>${stockM} m</b> is in stock — <b>Short by ${shortBy} m!</b></span>
          <span>Cost of shortfall: <b>${fmtINR(shortBy * sw.costPerMeter)}</b></span>
        </div>`;
      } else {
        stockBox.innerHTML = `<div class="ok-stock-banner">
          <span><b>✓ SWATCH STOCK AVAILABLE (${esc(sw.code)}):</b> Required <b>${reqM} m</b> vs <b>${stockM} m</b> in stock (<b>${Math.round((stockM - reqM) * 100) / 100} m</b> remaining)</span>
        </div>`;
      }
    } else if (stockBox) {
      stockBox.innerHTML = "";
    }

    const temp = {
      fabricMeters: reqM,
      fabricRate: $("#omRate").value,
      trimsCost: $("#omTrims").value,
      cutterCost: $("#omCutter").value,
      karigarCost: $("#omKarigarCost").value,
      trialShippingCost: $("#omShip").value,
      estHours: $("#omEstHours").value,
      hoursSpent: $("#omHours").value,
      estDays: $("#omEstDays").value,
      actualDays: $("#omActDays").value,
      amount: $("#omAmount").value,
      advancePaid: $("#omAdvance").value
    };
    const ec = calcOrderEconomics(temp);
    $("#liveCostSummary").innerHTML = `
      <span>Cloth Cost: <b>${fmtINR(ec.fabricTotal)}</b></span>
      <span>Total Cost: <b>${fmtINR(ec.totalCost)}</b></span>
      <span>Estimated contribution <b style="color:${ec.profit >= 0 ? "var(--green)" : "var(--danger)"};">${fmtINR(ec.profit)} (${ec.marginPct.toFixed(1)}%)</b></span>
      <span>Time Variance: <b style="color:${ec.daysVariance > 0 ? "var(--danger)" : "var(--green)"};">${!orderTimingRecorded(temp) ? "Timing not recorded" : ec.daysVariance > 0 ? `+${ec.daysVariance}d over est` : `On time`}</b></span>
      <span>Balance Due: <b>${recordedOrderPayments(temp).balance === null ? "Unrecorded" : fmtINR(ec.balance)}</b></span>
    `;
  };

  $("#btnAutoEstCloth").onclick = () => {
    const selClientId = $("#omClient").value;
    const mrec = sourceDocket || getClientLatestMrec(selClientId);
    const gText = $("#omGarments").value || "2-Piece Bespoke Suit";
    const est = estimateFabricFromMeasurements(mrec, gText, 1);
    $("#omMeters").value = est.totalMeters;
    updateLiveCalc();
    toast(`Estimated ${est.totalMeters}m from client measurements (${est.breakdownText})`);
  };

  $("#omSwatch").onchange = e => {
    const sw = getSwatchByCode(e.target.value);
    if (sw) {
      $("#omRate").value = sw.costPerMeter;
      if (!$("#omFabric").value.trim()) {
        $("#omFabric").value = `${sw.code} · ${sw.book} (${sw.colorName})`;
      }
      updateLiveCalc();
    }
  };

  ["omMeters", "omRate", "omTrims", "omCutter", "omKarigarCost", "omShip", "omEstHours", "omHours", "omEstDays", "omActDays", "omAmount", "omAdvance"].forEach(id => {
    $("#" + id).oninput = updateLiveCalc;
  });
  updateLiveCalc();

  $("#omCancel").onclick = closeModal;
  const del = $("#omDelete");
  if (del) {
    del.onclick = async () => {
      try {
        const latest = latestStoredDatabase();
        if (JSON.stringify(latest.orders[o.id]) !== JSON.stringify(o) || latest.orders[o.id]?.garmentJobs?.length) throw new Error("This order changed. Reopen it; saved garment histories cannot be deleted.");
        const orders = {...latest.orders};
        delete orders[o.id];
        const next = {...latest,orders};
        await writeDatabase(next);
        DB = next;
      } catch (error) { toast("Could not delete order. " + error.message); return; }
      closeModal();
      toast("Order deleted");
      render();
    };
  }

  $("#omSave").onclick = async () => {
    if (!DB.clients[$("#omClient").value]) { toast("Choose a client before creating an order."); return; }
    const ordDate = $("#omDate").value;
    const statusVal = $("#omStatus").value;
    const cutterVal = $("#omAssigned").value;
    const karigarVal = $("#omKarigar").value;
    let rec = {
      ...o,
      id: o.id || uid("o"),
      clientId: sourceDocket?.clientId || (o.measurementId || o.garmentJobs?.length ? o.clientId : $("#omClient").value),
      orderNo: $("#omNo").value.trim(),
      status: statusVal,
      date: ordDate,
      trialDate: $("#omTrialDate").value,
      delivery: $("#omDeliver").value,
      assignedTo: cutterVal,
      karigarAssigned: karigarVal,
      estDays: $("#omEstDays").value === "" ? null : Number($("#omEstDays").value),
      actualDays: $("#omActDays").value === "" ? null : Number($("#omActDays").value),
      estHours: $("#omEstHours").value === "" ? null : Number($("#omEstHours").value),
      hoursSpent: $("#omHours").value === "" ? null : Number($("#omHours").value),
      painPointNote: $("#omPainPoint").value.trim(),
      garments: o.garmentJobs?.length ? o.garments : $("#omGarments").value.trim(),
      swatchCode: $("#omSwatch").value,
      fabric: $("#omFabric").value.trim(),
      liningCode: $("#omLining").value.trim(),
      fabricMeters: $("#omMeters").value === "" ? null : Number($("#omMeters").value),
      fabricRate: $("#omRate").value === "" ? null : Number($("#omRate").value),
      trimsCost: $("#omTrims").value === "" ? null : Number($("#omTrims").value),
      cutterCost: $("#omCutter").value === "" ? null : Number($("#omCutter").value),
      karigarCost: $("#omKarigarCost").value === "" ? null : Number($("#omKarigarCost").value),
      trialShippingCost: $("#omShip").value === "" ? null : Number($("#omShip").value),
      amount: $("#omAmount").value === "" ? null : Number($("#omAmount").value),
      advancePaid: $("#omAdvance").value === "" ? null : Number($("#omAdvance").value),
      notes: $("#omNotes").value.trim(),
      workflow: o.workflow
    };
    // Synchronize workflow steps with the chosen Workshop Stage!
    syncOrderStageToWorkflow(rec, statusVal);

    if (sourceDocket) {
      try {
        const latest = latestStoredDatabase();
        const saved = latest.measurements[sourceDocket.id];
        if (!saved || JSON.stringify(saved) !== JSON.stringify(sourceDocket) || !latest.clients[sourceDocket.clientId]) {
          throw new Error("The docket or client changed. Reopen the saved docket before creating the order.");
        }
        if (linkedOrderForDocket(saved, latest.orders)) throw new Error("This docket already has a linked order.");
        if (!rec.orderNo) throw new Error("Enter an order number.");
        if (Object.values(latest.orders).some(order => orderNumberKey(order.orderNo) === orderNumberKey(rec.orderNo))) {
          throw new Error("That order number is already in use. Enter a different number.");
        }
        if (!rec.garments) throw new Error("Enter the garments for this order.");
        rec.measurementId = saved.id;
        const next = {
          ...latest,
          orders: { ...latest.orders, [rec.id]: rec },
          measurements: { ...latest.measurements, [saved.id]: { ...saved, orderNo: rec.orderNo } }
        };
        await writeDatabase(next);
        DB = next;
      } catch (error) {
        toast("Could not create order. " + error.message);
        return;
      }
      if (MREC?.id === sourceDocket.id) {
        MREC.orderNo = rec.orderNo;
        measurementBaselines.set(MREC, JSON.stringify(MREC));
      }
      closeModal();
      pushToSheets("Orders", flatOrder(rec));
      go("orders");
      toast(`Order ${rec.orderNo} created from measurements`);
      return;
    }

    try {
      const latest = latestStoredDatabase();
      if (o.id && JSON.stringify(latest.orders[o.id]) !== JSON.stringify(o)) {
        throw new Error("This order changed in another tab. Reopen the order before saving.");
      }
      if (!latest.clients[rec.clientId]) throw new Error("The client is no longer available.");
      if (o.garmentJobs?.length) {
        const reserved = $("#omReserved").value;
        if (reserved === "" || !Number.isFinite(Number(reserved)) || Number(reserved) < 0) throw new Error("Enter reserved fabric metres; use 0 to release the reservation.");
        if (o.reservedFabricMeters != null || Number(reserved) !== orderFabricReservation(o) || Number(reserved) !== orderFabricReservation(rec)) rec.reservedFabricMeters = Number(reserved);
        rec = reviewOrderCommercials(o,rec,$("#omAdjustmentReason").value,$("#omReviewConfirmed").checked);
      }
      const next = { ...latest, orders: { ...latest.orders, [rec.id]: rec } };
      const linkedM = !rec.measurementId && !rec.garmentJobs?.length && Object.values(latest.measurements).find(m =>
        m.clientId === rec.clientId && rec.orderNo && orderNumberKey(m.orderNo) === orderNumberKey(rec.orderNo)
      );
      if (linkedM) {
        next.measurements = { ...latest.measurements, [linkedM.id]: {
          ...linkedM, swatchCode: rec.swatchCode || linkedM.swatchCode, measuredBy: rec.assignedTo || linkedM.measuredBy
        } };
      }
      await writeDatabase(next);
      DB = next;
    } catch (error) {
      if ($("#omReviewError")) $("#omReviewError").textContent = error.message;
      toast("Could not save order. " + error.message);
      return;
    }
    closeModal();
    pushToSheets("Orders", flatOrder(rec));
    toast(o.id ? `Order ${rec.orderNo} & Sequence Stage (${rec.status}) updated` : "New order created");
    if (VIEW.name === "garments" && GARMENT_WORKSPACE?.orderId === rec.id) openGarmentWorkspace(rec.id);
    else render();
  };
}

/* ---------------- SEQUENCE OF EVENTS & TRIAL TRACKER MODAL ---------------- */
function sequenceModal(orderId) {
  if (!DB.orders[orderId]) return;
  if (DB.orders[orderId].garmentJobs?.length) { openGarmentWorkspace(orderId); return; }
  let original;
  let o;
  try {
    const saved = latestStoredDatabase().orders[orderId];
    if (!saved) throw new Error("This order is no longer available.");
    if (saved.garmentJobs?.length) { openGarmentWorkspace(orderId); return; }
    original = JSON.stringify(saved);
    o = copyGarmentData(saved);
  } catch (error) { toast(error.message); return; }
  const c = DB.clients[o.clientId] || {};
  const allEmployees = Object.values(DB.employees || {});
  if (!o.workflow || !Array.isArray(o.workflow)) {
    syncOrderStageToWorkflow(o, o.status);
  }
  const saveSequenceChanges = async () => {
    try {
      const latest = latestStoredDatabase();
      if (JSON.stringify(latest.orders[o.id]) !== original) throw new Error("This order changed in another tab. Reopen the tracker before saving.");
      const saved = copyGarmentData(o);
      const next = { ...latest, orders: { ...latest.orders, [o.id]: saved } };
      await writeDatabase(next);
      DB = next;
      original = JSON.stringify(next.orders[o.id]);
      return true;
    } catch (error) { toast("Could not save sequence. " + error.message); return false; }
  };

  const renderModalContent = () => {
    const doneCount = o.workflow.filter(s => s.done).length;
    const totalDaysCalculated = o.workflow.reduce((sum, s) => sum + (s.done ? (parseFloat(s.daysTaken) || 0) : 0), 0);
    const nextPending = o.workflow.find(s => !s.done);

    openModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        <div>
          <h2 style="margin:0;">📋 Order Sequence of Events &amp; Trial Tracker</h2>
          <div style="font-size:13px;color:var(--ink-soft);">
            Order <b>${esc(o.orderNo)}</b> · Client: <b>${esc(c.name || "—")}</b> · Garments: <b>${esc(o.garments)}</b>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:11.5px;font-weight:700;color:var(--ink-soft);">Jump Stage:</span>
          <select id="seqStageQuickSelect" style="border:1.5px solid var(--gold);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:700;background:var(--cream);color:var(--navy);">
            ${ORDER_STAGES.map(s => `<option value="${esc(s)}" ${s === o.status ? "selected" : ""}>${esc(s)}</option>`).join("")}
          </select>
          <span class="badge ${stageBadgeClass(o.status)}" style="font-size:12px;padding:5px 10px;">
            ${doneCount}/${o.workflow.length} Done
          </span>
        </div>
      </div>

      <!-- Trial & Delivery Date Quick Bar -->
      <div class="grid3" style="background:#faf6ed;border:1px solid var(--gold-soft);border-radius:8px;padding:10px 12px;margin-bottom:12px;">
        <div class="field">
          <label>📅 Order Booked Date</label>
          <input type="date" id="seqOrderDate" value="${esc(o.date || "")}">
        </div>
        <div class="field">
          <label>📅 1st Trial / Fitting Date</label>
          <input type="date" id="seqTrialDate" value="${esc(o.trialDate || "")}">
        </div>
        <div class="field">
          <label>🚚 Promised Delivery Date</label>
          <input type="date" id="seqDeliveryDate" value="${esc(o.delivery || "")}">
        </div>
      </div>

      <!-- Next Action Banner -->
      <div style="margin-bottom:10px;padding:8px 12px;border-radius:6px;background:${nextPending ? "#fdf3e2" : "#e9f4ec"};border:1px solid ${nextPending ? "#e7cf9a" : "#86efac"};font-size:12.5px;display:flex;justify-content:space-between;align-items:center;">
        <span>
          ${nextPending
            ? `⏳ <b>Current Active Step (Stage: ${esc(o.status)}):</b> ${esc(nextPending.label)} — Assigned to <b>${esc(nextPending.assignedTo)}</b>`
            : `✓ <b>All ${o.workflow.length} Workshop Sequence Steps Completed — Order Delivered!</b>`}
        </span>
        <span style="font-size:11.5px;color:var(--ink-soft);">Tick only the step that was completed</span>
      </div>

      <button type="button" class="btn" id="seqAddTrial" style="margin-bottom:10px;">＋ Add trial / fitting</button>

      <!-- Sequence Header -->
      <div style="border:1px solid var(--line-2);border-radius:8px;overflow:hidden;">
        <div class="seq-step-row" style="background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;">
          <span>Done</span>
          <span>Workflow Event / Stage</span>
          <span>Assigned To (Employee)</span>
          <span>Date Done</span>
          <span>Days Taken</span>
          <span>Remarks / Pending Note</span>
        </div>
        ${o.workflow.map((st, idx) => {
          const isCurrentActive = !st.done && nextPending && nextPending.key === st.key;
          return `
          <div class="seq-step-row ${st.done ? "done" : ""}" style="${isCurrentActive ? "background:#fff8eb;border-left:4px solid var(--gold);" : ""}" data-seq-row="${idx}">
            <div>
              <input type="checkbox" class="seq-chk" data-idx="${idx}" ${st.done ? "checked" : ""} style="width:18px;height:18px;cursor:pointer;accent-color:var(--green);">
            </div>
            <div>
              <div style="font-weight:700;color:${st.done ? "var(--green)" : (isCurrentActive ? "var(--gold-strong)" : "var(--navy)")};">
                ${esc(st.label)}
              </div>
              <span style="font-size:10.5px;color:${isCurrentActive ? "var(--amber)" : "var(--ink-soft)"};font-weight:${isCurrentActive ? "700" : "400"};">
                ${st.done ? "✓ Completed" : (isCurrentActive ? "▶ IN PROGRESS NOW" : "⏳ Pending")}
              </span>
              ${isTrialWorkflowStep(st) ? `<label style="display:block;font-size:11px;margin-top:6px;">Scheduled date
                <input type="date" class="seq-planned" data-idx="${idx}" aria-label="Scheduled date for ${esc(st.label)}" value="${esc(st.scheduledDate || "")}" style="display:block;width:100%;max-width:100%;">
              </label>` : ""}
            </div>
            <div>
              <select class="seq-emp" data-idx="${idx}" style="border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;font-size:12px;width:100%;background:#fff;">
                <option value="">— Unassigned —</option>
                ${st.assignedTo && !allEmployees.some(e => e.name === st.assignedTo) ? `<option selected value="${esc(st.assignedTo)}">${esc(st.assignedTo)}</option>` : ""}
                ${allEmployees.map(e => `<option value="${esc(e.name)}" ${e.name === st.assignedTo ? "selected" : ""}>${esc(e.name)}</option>`).join("")}
              </select>
            </div>
            <div>
              <input type="date" class="seq-date" data-idx="${idx}" value="${esc(st.doneDate || "")}" style="border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;font-size:12px;width:100%;background:#fff;">
            </div>
            <div>
              <input type="number" step="1" min="0" class="seq-days" data-idx="${idx}" value="${esc(st.daysTaken !== "" ? st.daysTaken : "")}" placeholder="Days" style="border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;font-size:12px;width:100%;text-align:center;font-weight:700;background:#fff;">
            </div>
            <div>
              <input type="text" class="seq-note" data-idx="${idx}" value="${esc(st.notes || "")}" placeholder="Add note…" style="border:1px solid var(--line-2);border-radius:5px;padding:4px 7px;font-size:12px;width:100%;background:#fff;">
            </div>
          </div>
        `}).join("")}
      </div>

      <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);">
        <span>Total Actual Days Across Completed Steps: <b style="color:var(--navy);">${totalDaysCalculated} days</b> (Estimated: <b>${o.estDays || 14} days</b>)</span>
        <button type="button" class="btn xs soft" id="seqOpenDocketBtn">📏 Open Measurement Docket (${esc(o.orderNo)})</button>
      </div>

      <div class="actions">
        <button class="btn" id="seqClose">Close</button>
        <button class="btn primary" id="seqSave">💾 Save Sequence &amp; Sync Stage</button>
      </div>
    `);

    const syncFieldEditsFromDOM = () => {
      o.date = $("#seqOrderDate").value;
      o.trialDate = $("#seqTrialDate").value;
      o.delivery = $("#seqDeliveryDate").value;

      o.workflow.forEach((step, i) => {
        const dateInp = $(`.seq-date[data-idx="${i}"]`);
        const daysInp = $(`.seq-days[data-idx="${i}"]`);
        const empSel = $(`.seq-emp[data-idx="${i}"]`);
        const noteInp = $(`.seq-note[data-idx="${i}"]`);
        const plannedInp = $(`.seq-planned[data-idx="${i}"]`);
        if (empSel) step.assignedTo = empSel.value;
        if (noteInp) step.notes = noteInp.value.trim();
        if (dateInp) step.doneDate = dateInp.value;
        if (daysInp) step.daysTaken = daysInp.value !== "" ? parseFloat(daysInp.value) : "";
        if (plannedInp && (plannedInp.value || "scheduledDate" in step)) step.scheduledDate = plannedInp.value;
      });

      const sumDays = o.workflow.reduce((acc, s) => acc + (s.done ? (parseFloat(s.daysTaken) || 0) : 0), 0);
      if (sumDays > 0) o.actualDays = sumDays;
    };

    $("#seqAddTrial").onclick = () => {
      syncFieldEditsFromDOM();
      o.workflow = appendAdditionalTrial(o.workflow);
      if (ORDER_STAGES.indexOf(o.status) >= ORDER_STAGES.indexOf("1st Trial / Fitting")) o.status = "1st Trial / Fitting";
      renderModalContent();
      const index = o.workflow.findLastIndex(isTrialWorkflowStep);
      $(`.seq-planned[data-idx="${index}"]`).focus();
    };

    // Quick Stage Dropdown inside Sequence Modal
    $("#seqStageQuickSelect").onchange = async e => {
      syncFieldEditsFromDOM();
      syncOrderStageToWorkflow(o, e.target.value);
      await saveSequenceChanges();
      renderModalContent();
    };

    // Only the explicitly checked task changes completion state.
    $$(".seq-chk").forEach(chk => {
      chk.onchange = async () => {
        syncFieldEditsFromDOM();
        const clickedIdx = parseInt(chk.dataset.idx, 10);
        const isChecking = chk.checked;
        const todayStr = new Date().toISOString().slice(0, 10);

        const step = o.workflow[clickedIdx];
        step.done = isChecking;
        step.doneDate = isChecking ? (step.doneDate || todayStr) : "";
        if (!isChecking) step.daysTaken = "";

        const firstPending = o.workflow.find(s => !s.done);
        o.status = firstPending ? firstPending.stage : "Delivered";
        const sumDays = o.workflow.reduce((acc, s) => acc + (s.done ? (parseFloat(s.daysTaken) || 0) : 0), 0);
        o.actualDays = sumDays;
        await saveSequenceChanges();
        renderModalContent();
      };
    });

    $("#seqOpenDocketBtn").onclick = () => {
      closeModal();
      ACTIONS.openMeasureByOrder(o.id);
    };
    $("#seqClose").onclick = () => {
      closeModal();
      render();
    };
    $("#seqSave").onclick = async () => {
      syncFieldEditsFromDOM();
      if (!await saveSequenceChanges()) return;
      closeModal();
      toast(`Synced sequence & stage for ${o.orderNo} → ${o.status}`);
      render();
    };
  };

  renderModalContent();
}

function searchPicker(title, placeholder, choices, onPick, extra) {
  const opener = document.activeElement;
  openModal(`
    <div>
      <h2 id="pickTitle">${esc(title)}</h2>
      <input class="picker-search" id="pickSearch" type="search" aria-label="${esc(placeholder)}" placeholder="${esc(placeholder)}">
      <div class="picker-results" id="pickList"></div>
      <div class="actions">
        ${extra ? `<button class="btn" id="pickExtra">${esc(extra.label)}</button>` : ""}
        <button class="btn" id="pickCancel">Cancel</button>
      </div>
    </div>
  `);
  const search = $("#pickSearch");
  const dismiss = () => {
    closeModal();
    opener?.focus();
  };
  const draw = () => {
    const query = search.value.trim().toLowerCase();
    const matches = choices.filter(choice => [choice.label, choice.detail, choice.keywords].join(" ").toLowerCase().includes(query));
    $("#pickList").innerHTML = matches.length
      ? matches.map((choice, index) => `<button type="button" class="btn picker-choice" data-pick="${index}">${esc(choice.label)}
        <span>${esc(choice.detail)}</span></button>`).join("")
      : '<p role="status">No matches. Try a different search.</p>';
    $$("#pickList [data-pick]").forEach(button => button.onclick = () => {
      dismiss();
      onPick(matches[Number(button.dataset.pick)].value);
    });
  };
  draw();
  search.oninput = draw;
  search.onkeydown = event => {
    if (event.key === "Escape") {
      event.preventDefault();
      dismiss();
    }
    if (event.key === "Enter") {
      event.preventDefault();
      const matches = $$("#pickList [data-pick]");
      if (matches.length === 1) matches[0].click();
    }
  };
  search.focus();
  $("#pickCancel").onclick = dismiss;
  if (extra) $("#pickExtra").onclick = () => { dismiss(); extra.run(); };
}

const ACTIONS = {
  newClient() { clientModal(null, false); },
  editClient(id) { clientModal(DB.clients[id], false); },
  newEmployee() { employeeModal(null); },
  editEmployee(id) { employeeModal(DB.employees[id]); },
  deleteEmployee(id) {
    const emp = DB.employees[id];
    if (!emp) return;
    if (Object.keys(DB.employees).length <= 1) {
      toast("At least one employee must remain in the roster.");
      return;
    }
    confirmDialog(
      "Remove Employee",
      `Remove "${emp.name}" (${emp.role}) from the active team roster? Past measurement dockets and orders will keep their recorded name.`,
      "Remove Employee",
      async () => {
        delete DB.employees[id];
        if (!await persist()) return;
        toast(emp.name + " removed from roster");
        render();
      }
    );
  },
  newOrder(id) { orderModal(null, id); },
  newOrderPick() { orderModal(null, Object.keys(DB.clients)[0]); },
  editOrder(id) {
    try {
      const order = latestStoredDatabase().orders[id];
      if (order) { DB.orders = { ...DB.orders, [id]: order }; orderModal(order); }
    } catch (error) { toast(error.message); }
  },
  openGarments(id) { openGarmentWorkspace(id); },
  viewLinkedOrder(id) { go("orderOverview", {id, fromMeasurement: true}); },
  openFabricReview() {
    Object.assign(FABRIC_DIRECTORY, {query: "", category: "", review: true, limit: 25});
    go("swatches");
  },
  backFromGarments() {
    const overview = GARMENT_WORKSPACE?.overview;
    go(overview ? "orderOverview" : GARMENT_WORKSPACE?.fromWorkshop ? "team" : "orders", overview);
  },
  inspectTrackedGarment(jobId) { inspectGarment(VIEW.id, jobId); },
  openTrackedFitting(jobId) { editTrackedFitting(VIEW.id, jobId, false); },
  addTrackedFitting(jobId) { editTrackedFitting(VIEW.id, jobId, true); },
  openSequenceModal(id) { sequenceModal(id); },
  openEnquiryWizard() { enquiryWizardModal(); },
  newSwatch() { swatchModal(null); },
  editSwatch(id) { swatchModal(DB.swatches[id]); },
  newMeasurePick() { pickClientModal(); },
  measureFor(id) {
    leaveMeasurementDraft(() => {
      ACTIVE_MEASURE_TAB = "lower";
      MREC = blankMeasure(id);
      go("measure");
    });
  },
  openMeasure(id) {
    if (DB.measurements[id]) {
      if (MREC?.id === id) { go("measure"); return; }
      leaveMeasurementDraft(() => {
        ACTIVE_MEASURE_TAB = "lower";
        MREC = JSON.parse(JSON.stringify(DB.measurements[id]));
        go("measure");
      });
    }
  },
  openMeasureByOrder(orderId) {
    const o = DB.orders[orderId];
    if (!o) return;
    let m = DB.measurements[o.measurementId];
    if (m?.clientId !== o.clientId) {
      m = Object.values(DB.measurements).find(x =>
        x.clientId === o.clientId && o.orderNo && orderNumberKey(x.orderNo) === orderNumberKey(o.orderNo)
      );
    }
    if (!m) {
      // Create a linked measurement docket for this order so the user can immediately enter measurements
      m = blankMeasure(o.clientId);
      m.orderNo = o.orderNo;
      m.swatchCode = o.swatchCode || "";
      m.measuredBy = o.assignedTo || DB.settings.measuredByDefault || "";
      m.estGarmentType = o.garments || "2-Piece Bespoke Suit";
      m.selectedGarments = [];
    }
    const open = () => {
      ACTIVE_MEASURE_TAB = "lower";
      MREC = JSON.parse(JSON.stringify(m));
      go("measure");
    };
    if (MREC?.id === m.id) go("measure");
    else leaveMeasurementDraft(open);
  },
  dupMeasure(id) {
    const src = DB.measurements[id];
    if (!src) return;
    leaveMeasurementDraft(() => {
      ACTIVE_MEASURE_TAB = "lower";
      MREC = blankMeasure(src.clientId);
      MREC.measures = JSON.parse(JSON.stringify(src.measures || {}));
      MREC.ticks = JSON.parse(JSON.stringify(src.ticks || {}));
      MREC.texts = JSON.parse(JSON.stringify(src.texts || {}));
      MREC.swatchCode = src.swatchCode || "";
      MREC.unit = src.unit || "in";
      go("measure");
      toast("Created new docket copied from " + fmtDate(src.date));
    });
  },
  copyPrev() {
    const prev = Object.values(DB.measurements)
      .filter(m => m.clientId === MREC.clientId && m.id !== MREC.id)
      .sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""))[0]
      || Object.values(DB.measurements)
      .filter(m => m.clientId === MREC.clientId)
      .sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""))[0];

    if (!prev) {
      toast("No previous measurement record found for this client.");
      return;
    }
    MREC.measures = JSON.parse(JSON.stringify(prev.measures || {}));
    MREC.ticks = JSON.parse(JSON.stringify(prev.ticks || {}));
    MREC.texts = JSON.parse(JSON.stringify(prev.texts || {}));
    MREC.swatchCode = prev.swatchCode || MREC.swatchCode;
    MREC.unit = prev.unit || "in";
    render();
    mountMeasure();
    toast("Copied measurements from " + fmtDate(prev.date));
  },
  clearMeasure() {
    confirmDialog(
      "Clear All Measurements",
      "Are you sure you want to clear all fields in the current measurement docket?",
      "Clear Fields",
      () => {
        MREC = blankMeasure(MREC.clientId);
        render();
        mountMeasure();
        toast("Measurement fields cleared");
      }
    );
  },
  async clearLogo() {
    DB.settings.logoDataUrl = "";
    if (!await persist()) return;
    toast("Reverted to default Modisto crest logo");
    render();
  },
  async saveSettings() {
    DB.settings.appsScriptUrl = $("#setUrl").value.trim();
    DB.settings.measuredByDefault = $("#setBy").value.trim();
    DB.settings.atelierContactLine1 = $("#setContact1").value.trim();
    DB.settings.atelierContactLine2 = $("#setContact2").value.trim();
    DB.settings.printPagesMode = $("#setPrintMode").value;
    if (!await persist()) return;
    toast("Branding & Print Header settings saved");
  },
  exportRecovery() {
    if (SHARED_MODE) { toast("Staging does not read this browser's local recovery records. Export the shared records instead."); return; }
    const keys = DEMO_MODE ? [DB_KEY] : [DB_KEY, "modisto_bespoke_v6", "modisto_bespoke_v5", "modisto_bespoke_v4", "modisto_bespoke_v3"];
    const raw = localStorage.getItem(RECOVERY_KEY) || keys.map(key => localStorage.getItem(key)).find(value => value !== null);
    if (!raw) { toast("No pre-change backup is available yet. Export Database saves the current records."); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([raw], { type: "application/json" }));
    a.download = "modisto-pre-change-recovery.json";
    a.click();
    URL.revokeObjectURL(a.href);
  },
  exportDb() {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "modisto-bespoke-db-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  },
  importDb() {
    if (SHARED_MODE) { globalThis.ModistoShared.openImport(); return; }
    const f = $("#importFile");
    f.onchange = () => {
      const file = f.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result);
          if (!data.clients) throw new Error("Invalid backup");
          const imported = normalizeDatabase(data);
          // A deliberate import can repair an unreadable current store. Keep its bytes first.
          const wasBlocked = STORAGE_BLOCKED;
          if (wasBlocked) {
            const original = localStorage.getItem(DB_KEY);
            if (original !== null && !localStorage.getItem(RECOVERY_KEY)) localStorage.setItem(RECOVERY_KEY, original);
          }
          STORAGE_BLOCKED = false;
          try { writeDatabase(imported); } catch (error) { STORAGE_BLOCKED = wasBlocked; throw error; }
          DB = imported;
          MREC = null;
          toast("Database backup imported");
          go("dashboard");
        } catch (e) {
          toast("Invalid Modisto backup JSON file.");
        }
      };
      r.readAsText(file);
    };
    f.click();
  },
  resetSeed() {
    location.href = "?demo=1";
  },

  wipeDb() {
    if (SHARED_MODE) { toast("Shared records cannot be erased through the browser-local wipe action."); return; }
    confirmDialog(
      "Erase All Data",
      "Erase ALL clients, measurements, swatches, and orders from this browser? Export a backup first if needed.",
      "Erase Everything",
      () => {
        DB = { clients: {}, measurements: {}, orders: {}, swatches: {}, employees: {}, settings: DB.settings };
        persist();
        MREC = null;
        toast("All local data erased");
        go("dashboard");
      }
    );
  }
};

/* ---------------- SAFE BOOT SEQUENCE ---------------- */
try {
  if (SHARED_MODE) {
    globalThis.ModistoShared.boot({
      normalize: normalizeDatabase, openModal, closeModal,
      activate(data) { DB = data; MREC = null; GARMENT_WORKSPACE = null; GARMENT_PRINT_SHEET = null; SHARED_FORM_DIRTY = false; renderSidebarBrandAndEmployees(); go("dashboard"); },
      clear() {
        DB = emptyDatabase();
        MREC = null;
        GARMENT_WORKSPACE = null;
        GARMENT_PRINT_SHEET = null;
        SHARED_FORM_DIRTY = false;
        Object.assign(ORDER_LIST, INITIAL_ORDER_LIST);
        TODAY_BRANCH = "";
        SELECTED_TEAM_EMP_ID = "";
        Object.assign(CLIENT_DIRECTORY, {query: "", branch: "", country: "", sort: "name", limit: 25});
        Object.assign(FABRIC_DIRECTORY, {query: "", category: "", review: false, limit: 25});
        TRACKING_RETURN = null;
        $("#main").replaceChildren();
        renderSidebarBrandAndEmployees();
        document.body.classList.remove("garment-print-mode");
        window.onbeforeprint = null;
      },
      saved() { SHARED_FORM_DIRTY = false; },
      dirty() { return Boolean(( $("#overlay").classList.contains("on") && SHARED_FORM_DIRTY ) || garmentWorkspaceDirty() || (VIEW.name === "measure" && MREC && measurementBaselines.get(MREC) !== JSON.stringify(MREC))); }
    }).catch(error => { document.body.classList.add("shared-locked"); document.getElementById("sharedRoot").textContent = "Local staging could not start: " + error.message; });
  } else go("dashboard");
} catch (err) {
  console.error("Boot recovery triggered:", err);
  $("#main").textContent = "The interface could not load. Your stored records have been retained. Export or recover the original JSON before retrying.";
}
</script>
</body>
</html>
