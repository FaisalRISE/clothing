/* ============================================================================
   6. COSTING & PROFITABILITY ENGINE VIEW
   ============================================================================ */
function vCosting() {
  const orders = Object.values(DB.orders);
  let totRev = 0, totFabric = 0, totTrims = 0, totLabour = 0, totShip = 0, totCost = 0, totProfit = 0, totHours = 0;

  orders.forEach(o => {
    const ec = calcOrderEconomics(o);
    totRev += ec.quoted;
    totFabric += ec.fabricTotal;
    totTrims += ec.trims;
    totLabour += (ec.cutter + ec.karigar);
    totShip += ec.shipping;
    totCost += ec.totalCost;
    totProfit += ec.profit;
    totHours += ec.hours;
  });

  const overallMargin = totRev > 0 ? ((totProfit / totRev) * 100).toFixed(1) : "0.0";
  const avgProfitPerHr = totHours > 0 ? Math.round(totProfit / totHours) : 0;

  return `
  <div class="pagehead">
    <div>
      <h1>Bespoke Costing &amp; Atelier Economics</h1>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:-2px;">

      </div>

    </div>

  $("#cmName").focus();

  const saveClientRecord = (openMeasureAfter) => {
    const name = $("#cmName").value.trim();
    if (!name) { $("#cmName").focus(); return; }
    const rec = {
      id: c.id || uid("c"),
      name,
      company: $("#cmCompany").value.trim(),
      designation: $("#cmDesignation").value.trim(),
      branch: $("#cmBranch").value,
      phone: $("#cmPhone").value.trim(),
      email: $("#cmEmail").value.trim(),
      birthday: $("#cmBday").value,
      city: $("#cmCity").value.trim(),
      country: $("#cmCountry").value.trim() || "India",
      address: $("#cmAddr").value.trim(),
      posture: $("#cmPosture").value.trim(),
      likes: $("#cmLikes").value.trim(),
      remarks: $("#cmRemarks").value.trim(),
      createdAt: c.createdAt || new Date().toISOString()
    };
    DB.clients[rec.id] = rec;
    persist();
    closeModal();
    pushToSheets("Clients", flatClient(rec));

    if (openMeasureAfter) {
      if (VIEW.name === "measure" && MREC) {
        MREC.clientId = rec.id;
        MREC.orderNo = makeOrderNo();
      } else {
        MREC = blankMeasure(rec.id);
      }
      toast("Client " + rec.name + " created — ready for measurements!");
      go("measure");
    } else {
      toast(c.id ? "Client profile updated" : "Client added to database");
      go("client", { id: rec.id });
    }
  };

  $("#cmSave").onclick = () => saveClientRecord(startMeasureOnSave);
  if ($("#cmSaveAndMeasure")) {
    $("#cmSaveAndMeasure").onclick = () => saveClientRecord(true);
  }
}

          <input id="omShip" type="number" step="100" value="${esc(o.trialShippingCost ?? 1500)}">
        </div>
        <div class="field">
          <label>Estimated Craft Hours</label>
          <input id="omEstHours" type="number" step="1" value="${esc(o.estHours ?? 28)}">
        </div>
        <div class="field">
          <label>Actual Craft Hours Spent</label>
          <input id="omHours" type="number" step="1" value="${esc(o.hoursSpent ?? 30)}">
        </div>
        <div class="field">
          <label class="req">Client Quoted Price (₹)</label>
          <input id="omAmount" type="number" step="500" value="${esc(o.amount ?? 95000)}">
        </div>
        <div class="field">
          <label>Advance Received (₹)</label>
          <input id="omAdvance" type="number" step="500" value="${esc(o.advancePaid ?? 50000)}">
        </div>
        <div class="field full" style="grid-column: span 2;">
          <label>Bottleneck / Pain Point Note (If Delayed)</label>
          <input id="omPainPoint" value="${esc(o.painPointNote || "")}" placeholder="e.g. Trial rescheduled, awaiting mill fabric, extra hand-padding…">
        </div>
      </div>
      <div id="liveCostSummary" style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--gold-soft);display:flex;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;"></div>
    </div>

    <div class="field full" style="margin-top:10px;">
      <label>Order &amp; Trial Notes</label>
      <textarea id="omNotes">${esc(o.notes || "")}</textarea>
    </div>

    <div class="actions">
      ${o.id ? `<button class="btn danger" id="omDelete" style="margin-right:auto;">Delete Order</button>` : ""}
      <button class="btn" id="omCancel">Cancel</button>
      <button class="btn primary" id="omSave">${o.id ? "Save Order & Costing" : "Create Order"}</button>
    </div>
  `);

  const updateLiveCalc = () => {
    const reqM = parseFloat($("#omMeters").value) || 0;
    const swCode = $("#omSwatch").value;
    const sw = getSwatchByCode(swCode);
    const stockBox = $("#omStockAlertBox");

    if (sw && stockBox) {
      const stockM = parseFloat(sw.stockMeters) || 0;
      if (reqM > stockM) {
        const shortBy = Math.round((reqM - stockM) * 100) / 100;
        stockBox.innerHTML = `<div class="shortage-banner">
          <span><b>⚠ FABRIC SHORTAGE HIGHLIGHT (${esc(sw.code)}):</b> This order requires <b>${reqM} m</b>, but only <b>${stockM} m</b> is in stock — <b>Short by ${shortBy} m!</b></span>
          <span>Cost of shortfall: <b>${fmtINR(shortBy * sw.costPerMeter)}</b></span>
        </div>`;
      } else {
        stockBox.innerHTML = `<div class="ok-stock-banner">
          <span><b>✓ SWATCH STOCK AVAILABLE (${esc(sw.code)}):</b> Required <b>${reqM} m</b> vs <b>${stockM} m</b> in stock (<b>${Math.round((stockM - reqM) * 100) / 100} m</b> remaining)</span>
        </div>`;
      }
    } else if (stockBox) {
      stockBox.innerHTML = "";
    }

    const temp = {
      fabricMeters: reqM,
      fabricRate: $("#omRate").value,
      trimsCost: $("#omTrims").value,
      cutterCost: $("#omCutter").value,
      karigarCost: $("#omKarigarCost").value,
      trialShippingCost: $("#omShip").value,
      estHours: $("#omEstHours").value,
      hoursSpent: $("#omHours").value,
      estDays: $("#omEstDays").value,
      actualDays: $("#omActDays").value,
      amount: $("#omAmount").value,
      advancePaid: $("#omAdvance").value
    };
    const ec = calcOrderEconomics(temp);
    $("#liveCostSummary").innerHTML = `
      <span>Cloth Cost: <b>${fmtINR(ec.fabricTotal)}</b></span>
      <span>Total Cost: <b>${fmtINR(ec.totalCost)}</b></span>
      <span>Net Profit: <b style="color:${ec.profit >= 0 ? "var(--green)" : "var(--danger)"};">${fmtINR(ec.profit)} (${ec.marginPct.toFixed(1)}%)</b></span>
      <span>Time Variance: <b style="color:${ec.daysVariance > 0 ? "var(--danger)" : "var(--green)"};">${ec.daysVariance > 0 ? `+${ec.daysVariance}d over est` : `On time`}</b></span>
      <span>Balance Due: <b>${fmtINR(ec.balance)}</b></span>
    `;
  };

  $("#btnAutoEstCloth").onclick = () => {
    const selClientId = $("#omClient").value;
    const mrec = getClientLatestMrec(selClientId);
    const gText = $("#omGarments").value || "2-Piece Bespoke Suit";
    const est = estimateFabricFromMeasurements(mrec, gText, 1);
    $("#omMeters").value = est.totalMeters;
    updateLiveCalc();
    toast(`Estimated ${est.totalMeters}m from client measurements (${est.breakdownText})`);
  };

  $("#omSwatch").onchange = e => {
    const sw = getSwatchByCode(e.target.value);
    if (sw) {
      $("#omRate").value = sw.costPerMeter;
      if (!$("#omFabric").value.trim()) {
        $("#omFabric").value = `${sw.code} · ${sw.book} (${sw.colorName})`;
      }
      updateLiveCalc();
    }
  };

  ["omMeters", "omRate", "omTrims", "omCutter", "omKarigarCost", "omShip", "omEstHours", "omHours", "omEstDays", "omActDays", "omAmount", "omAdvance"].forEach(id => {
    $("#" + id).oninput = updateLiveCalc;
  });
  updateLiveCalc();

  $("#omCancel").onclick = closeModal;
  const del = $("#omDelete");
  if (del) {
    del.onclick = () => {
      delete DB.orders[o.id];
      persist();
      closeModal();
      toast("Order deleted");
      render();
    };
  }

  $("#omSave").onclick = () => {
    const ordDate = $("#omDate").value;
    const statusVal = $("#omStatus").value;
    const cutterVal = $("#omAssigned").value;
    const karigarVal = $("#omKarigar").value;
    const rec = {
      id: o.id || uid("o"),
      clientId: $("#omClient").value,
      orderNo: $("#omNo").value.trim(),
      status: statusVal,
      date: ordDate,
      trialDate: $("#omTrialDate").value,
      delivery: $("#omDeliver").value,
      assignedTo: cutterVal,
      karigarAssigned: karigarVal,
      estDays: parseFloat($("#omEstDays").value) || 14,
      actualDays: parseFloat($("#omActDays").value) || 14,
      estHours: parseFloat($("#omEstHours").value) || 28,
      hoursSpent: parseFloat($("#omHours").value) || 0,
      painPointNote: $("#omPainPoint").value.trim(),
      garments: $("#omGarments").value.trim(),
      swatchCode: $("#omSwatch").value,
      fabric: $("#omFabric").value.trim(),
      liningCode: $("#omLining").value.trim(),
      fabricMeters: parseFloat($("#omMeters").value) || 0,
      fabricRate: parseFloat($("#omRate").value) || 0,
      trimsCost: parseFloat($("#omTrims").value) || 0,
      cutterCost: parseFloat($("#omCutter").value) || 0,
      karigarCost: parseFloat($("#omKarigarCost").value) || 0,
      trialShippingCost: parseFloat($("#omShip").value) || 0,
      amount: parseFloat($("#omAmount").value) || 0,
      advancePaid: parseFloat($("#omAdvance").value) || 0,
      notes: $("#omNotes").value.trim(),
      workflow: o.workflow
    };
    // Synchronize workflow steps with the chosen Workshop Stage!
    syncOrderStageToWorkflow(rec, statusVal);

    // Also sync back to any linked Measurement Docket with the same Order No
    const linkedM = Object.values(DB.measurements).find(m =>
      (m.orderNo || "").trim().toUpperCase() === rec.orderNo.toUpperCase()
    );
    if (linkedM) {
      linkedM.clientId = rec.clientId;
      linkedM.swatchCode = rec.swatchCode || linkedM.swatchCode;
      linkedM.measuredBy = rec.assignedTo || linkedM.measuredBy;
    }

    DB.orders[rec.id] = rec;
    persist();
    closeModal();
    pushToSheets("Orders", flatOrder(rec));
    toast(o.id ? `Order ${rec.orderNo} & Sequence Stage (${rec.status}) updated` : "New order created");
    render();
  };
}

/* ---------------- SEQUENCE OF EVENTS & TRIAL TRACKER MODAL ---------------- */
function sequenceModal(orderId) {
  const o = DB.orders[orderId];
  if (!o) return;
  const c = DB.clients[o.clientId] || {};
  const allEmployees = Object.values(DB.employees || {});
  if (!o.workflow || !Array.isArray(o.workflow)) {
    syncOrderStageToWorkflow(o, o.status);
  }

  const renderModalContent = () => {
    const doneCount = o.workflow.filter(s => s.done).length;
    const totalDaysCalculated = o.workflow.reduce((sum, s) => sum + (s.done ? (parseFloat(s.daysTaken) || 0) : 0), 0);
    const nextPending = o.workflow.find(s => !s.done);

    openModal(`
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
        <div>
          <h2 style="margin:0;">📋 Order Sequence of Events &amp; Trial Tracker</h2>
          <div style="font-size:13px;color:var(--ink-soft);">
            Order <b>${esc(o.orderNo)}</b> · Client: <b>${esc(c.name || "—")}</b> · Garments: <b>${esc(o.garments)}</b>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:11.5px;font-weight:700;color:var(--ink-soft);">Jump Stage:</span>
          <select id="seqStageQuickSelect" style="border:1.5px solid var(--gold);border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:700;background:var(--cream);color:var(--navy);">
            ${ORDER_STAGES.map(s => `<option value="${esc(s)}" ${s === o.status ? "selected" : ""}>${esc(s)}</option>`).join("")}
          </select>
          <span class="badge ${stageBadgeClass(o.status)}" style="font-size:12px;padding:5px 10px;">
            ${doneCount}/${o.workflow.length} Done
          </span>
        </div>
      </div>

      <!-- Trial & Delivery Date Quick Bar -->
      <div class="grid3" style="background:#faf6ed;border:1px solid var(--gold-soft);border-radius:8px;padding:10px 12px;margin-bottom:12px;">
        <div class="field">
          <label>📅 Order Booked Date</label>
          <input type="date" id="seqOrderDate" value="${esc(o.date || "")}">
        </div>
        <div class="field">
          <label>📅 1st Trial / Fitting Date</label>
          <input type="date" id="seqTrialDate" value="${esc(o.trialDate || "")}">
        </div>
        <div class="field">
          <label>🚚 Promised Delivery Date</label>
          <input type="date" id="seqDeliveryDate" value="${esc(o.delivery || "")}">
        </div>
      </div>

      <!-- Next Action Banner -->
      <div style="margin-bottom:10px;padding:8px 12px;border-radius:6px;background:${nextPending ? "#fdf3e2" : "#e9f4ec"};border:1px solid ${nextPending ? "#e7cf9a" : "#86efac"};font-size:12.5px;display:flex;justify-content:space-between;align-items:center;">
        <span>
          ${nextPending
            ? `⏳ <b>Current Active Step (Stage: ${esc(o.status)}):</b> ${esc(nextPending.label)} — Assigned to <b>${esc(nextPending.assignedTo)}</b>`
            : `✓ <b>All 9 Workshop Sequence Steps Completed — Order Delivered!</b>`}
        </span>
        <span style="font-size:11.5px;color:var(--ink-soft);">Ticking a step automatically completes prior steps</span>
      </div>

      <!-- Sequence Header -->
      <div style="border:1px solid var(--line-2);border-radius:8px;overflow:hidden;">
        <div class="seq-step-row" style="background:var(--navy);color:#fff;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;">
          <span>Done</span>
          <span>Workflow Event / Stage</span>
          <span>Assigned To (Employee)</span>
          <span>Date Done</span>
          <span>Days Taken</span>
          <span>Remarks / Pending Note</span>
        </div>
        ${o.workflow.map((st, idx) => {
          const isCurrentActive = !st.done && nextPending && nextPending.key === st.key;
          return `
          <div class="seq-step-row ${st.done ? "done" : ""}" style="${isCurrentActive ? "background:#fff8eb;border-left:4px solid var(--gold);" : ""}" data-seq-row="${idx}">
            <div>
              <input type="checkbox" class="seq-chk" data-idx="${idx}" ${st.done ? "checked" : ""} style="width:18px;height:18px;cursor:pointer;accent-color:var(--green);">
            </div>
            <div>
              <div style="font-weight:700;color:${st.done ? "var(--green)" : (isCurrentActive ? "var(--gold-strong)" : "var(--navy)")};">
                ${esc(st.label)}
              </div>
              <span style="font-size:10.5px;color:${isCurrentActive ? "var(--amber)" : "var(--ink-soft)"};font-weight:${isCurrentActive ? "700" : "400"};">
                ${st.done ? "✓ Completed" : (isCurrentActive ? "▶ IN PROGRESS NOW" : "⏳ Pending")}
              </span>
            </div>
            <div>
              <select class="seq-emp" data-idx="${idx}" style="border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;font-size:12px;width:100%;background:#fff;">
                ${allEmployees.map(e => `<option value="${esc(e.name)}" ${e.name === st.assignedTo ? "selected" : ""}>${esc(e.name)}</option>`).join("")}
              </select>
            </div>
            <div>
              <input type="date" class="seq-date" data-idx="${idx}" value="${esc(st.doneDate || "")}" style="border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;font-size:12px;width:100%;background:#fff;">
            </div>
            <div>
              <input type="number" step="1" min="0" class="seq-days" data-idx="${idx}" value="${esc(st.daysTaken !== "" ? st.daysTaken : "")}" placeholder="Days" style="border:1px solid var(--line-2);border-radius:5px;padding:4px 6px;font-size:12px;width:100%;text-align:center;font-weight:700;background:#fff;">
            </div>
            <div>
              <input type="text" class="seq-note" data-idx="${idx}" value="${esc(st.notes || "")}" placeholder="Add note…" style="border:1px solid var(--line-2);border-radius:5px;padding:4px 7px;font-size:12px;width:100%;background:#fff;">
            </div>
          </div>
        `}).join("")}
      </div>

      <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-soft);">
        <span>Total Actual Days Across Completed Steps: <b style="color:var(--navy);">${totalDaysCalculated} days</b> (Estimated: <b>${o.estDays || 14} days</b>)</span>
        <button type="button" class="btn xs soft" id="seqOpenDocketBtn">📏 Open Measurement Docket (${esc(o.orderNo)})</button>
      </div>

      <div class="actions">
        <button class="btn" id="seqClose">Close</button>
        <button class="btn primary" id="seqSave">💾 Save Sequence &amp; Sync Stage</button>
      </div>
    `);

    const syncFieldEditsFromDOM = () => {
      o.date = $("#seqOrderDate").value;
      o.trialDate = $("#seqTrialDate").value;
      o.delivery = $("#seqDeliveryDate").value;

      o.workflow.forEach((step, i) => {
        const dateInp = $(`.seq-date[data-idx="${i}"]`);
        const daysInp = $(`.seq-days[data-idx="${i}"]`);
        const empSel = $(`.seq-emp[data-idx="${i}"]`);
        const noteInp = $(`.seq-note[data-idx="${i}"]`);
        if (empSel) step.assignedTo = empSel.value;
        if (noteInp) step.notes = noteInp.value.trim();
        if (dateInp) step.doneDate = dateInp.value;
        if (daysInp) step.daysTaken = daysInp.value !== "" ? parseFloat(daysInp.value) : "";
      });

      const firstPending = o.workflow.find(s => !s.done);
      o.status = firstPending ? firstPending.stage : "Delivered";
      if (firstPending && firstPending.assignedTo) {
        if (firstPending.key === "stitch_trial" || firstPending.key === "finishing") {
          o.karigarAssigned = firstPending.assignedTo;
        } else {
          o.assignedTo = firstPending.assignedTo;
        }
      }
      const sumDays = o.workflow.reduce((acc, s) => acc + (s.done ? (parseFloat(s.daysTaken) || 0) : 0), 0);
      if (sumDays > 0) o.actualDays = sumDays;
    };

    // Quick Stage Dropdown inside Sequence Modal
    $("#seqStageQuickSelect").onchange = e => {
      syncFieldEditsFromDOM();
      syncOrderStageToWorkflow(o, e.target.value);
      persist();
      renderModalContent();
    };

    // Sequential Checkbox Click: ticking step K marks 0..K done; unticking step K marks K..end pending
    $$(".seq-chk").forEach(chk => {
      chk.onchange = () => {
        syncFieldEditsFromDOM();
        const clickedIdx = parseInt(chk.dataset.idx, 10);
        const isChecking = chk.checked;
        const todayStr = new Date().toISOString().slice(0, 10);

        o.workflow.forEach((step, idx) => {
          if (isChecking && idx <= clickedIdx) {
            if (!step.done) {
              step.done = true;
              if (!step.doneDate) step.doneDate = todayStr;
              if (step.daysTaken === "" || isNaN(parseFloat(step.daysTaken))) {
                step.daysTaken = (WORKFLOW_TEMPLATE[idx] && WORKFLOW_TEMPLATE[idx].defaultDays) || 1;
              }
            }
          } else if (!isChecking && idx >= clickedIdx) {
            step.done = false;
            step.doneDate = "";
            step.daysTaken = "";
          }
        });

        const firstPending = o.workflow.find(s => !s.done);
        o.status = firstPending ? firstPending.stage : "Delivered";
        const sumDays = o.workflow.reduce((acc, s) => acc + (s.done ? (parseFloat(s.daysTaken) || 0) : 0), 0);
        o.actualDays = Math.max(1, sumDays || 1);
        persist();
        renderModalContent();
      };
    });

    $("#seqOpenDocketBtn").onclick = () => {
      syncFieldEditsFromDOM();
      persist();
      closeModal();
      ACTIONS.openMeasureByOrder(o.id);
    };
    $("#seqClose").onclick = () => {
      syncFieldEditsFromDOM();
      persist();
      closeModal();
      render();
    };
    $("#seqSave").onclick = () => {
      syncFieldEditsFromDOM();
      persist();
      closeModal();
      toast(`Synced sequence & stage for ${o.orderNo} → ${o.status}`);
      render();
    };
  };

  renderModalContent();
}

      karigarAssigned: "Ramesh Master",
      status: "New",
      estDays: 14,
      actualDays: 1,
      estHours: 28,
      hoursSpent: 1,
      painPointNote: "Enquiry logged — taking client measurements",
      fabricMeters: Math.round(estMeters * 20) / 20,
      fabricRate: sw ? sw.costPerMeter : 8500,
      trimsCost: 4500,
      cutterCost: 6000,
      karigarCost: 9000,
      trialShippingCost: 1500,
      amount: 95000,
      advancePaid: 50000,
      notes: "",
      workflow: buildDefaultWorkflow(todayStr, "New", tailor, "Ramesh Master")
    };
    persist();
    closeModal();
    ACTIVE_MEASURE_TAB = selectedList[0].tab || "lower";
    go("measure");
    toast(`Created Order ${MREC.orderNo} (${selectedList.map(x => x.name).join(", ")}) — ready for measurements!`);
  };
}

function swatchModal(s) {
  s = s || {};
  const alloc = s.code ? getSwatchAllocationStatus(s.code) : null;
  const liveOrdersMeters = alloc ? alloc.ordersMeters : 0;

  openModal(`
    <h2>${s.id ? "Edit Fabric Swatch, Min Qty Alert & Vendor Details" : "Add Fabric Swatch & Vendor to Atelier Library"}</h2>
    <div class="grid2">
      <div class="field">
        <label class="req">Swatch Number / Code</label>
        <input id="smCode" value="${esc(s.code || "SW-")}" placeholder="e.g. SW-1042">
      </div>
      <div class="field">
        <label>Category</label>
        <select id="smCat">
          ${["Suiting", "Shirting", "Ceremonial", "Trousering"].map(c => `<option ${s.category === c ? "selected" : ""}>${c}</option>`).join("")}
        </select>
      </div>
      <div class="field">
        <label class="req">Bunch Book / Collection</label>
        <input id="smBook" value="${esc(s.book || "")}" placeholder="e.g. Holland & Sherry · City Suiting">
      </div>
      <div class="field">
        <label>Mill / Weaver</label>
        <input id="smMill" value="${esc(s.mill || "")}" placeholder="e.g. Loro Piana, VBC, Soktas">
      </div>

      <!-- VENDOR / SUPPLIER DETAILS HIGHLIGHT BOX -->
      <div class="field full" style="background:#faf6ed;border:1px solid var(--gold-soft);border-radius:8px;padding:10px 12px;">
        <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--gold-strong);margin-bottom:6px;">
          🏢 Vendor / Supplier Contact (For Reordering Cloth)
        </div>
        <div class="grid2">
          <div class="field">
            <label class="req">Vendor / Supplier Name</label>
            <input id="smVendorName" value="${esc(s.vendorName || s.mill || "")}" placeholder="e.g. Luxury Fabrics India Pvt Ltd">
          </div>
          <div class="field">
            <label class="req">Vendor Phone / Email / WhatsApp</label>
            <input id="smVendorContact" value="${esc(s.vendorContact || "")}" placeholder="e.g. +91 22 2600 4411 · orders@vendor.com">
          </div>
        </div>
      </div>

      <div class="field">
        <label>Shade / Colour Name</label>
        <input id="smColorName" value="${esc(s.colorName || "")}" placeholder="e.g. Savile Midnight Navy">
      </div>
      <div class="field">
        <label>Swatch Colour Preview</label>
        <input id="smHex" type="color" value="${esc(s.colorHex || "#1b2838")}" style="height:38px;padding:3px;">
      </div>
      <div class="field full">
        <label>Composition &amp; Weight</label>
        <input id="smComp" value="${esc(s.composition || "")}" placeholder="e.g. 100% Super 150s Merino Wool (280g)">
      </div>
      <div class="field">
        <label>Cost per Meter (₹)</label>
        <input id="smCost" type="number" step="100" value="${esc(s.costPerMeter || 6500)}">
      </div>
      <div class="field">
        <label>Available Stock in Atelier (Meters)</label>
        <input id="smStock" type="number" step="0.25" value="${esc(s.stockMeters ?? 32)}">
      </div>
      <div class="field">
        <label class="req">🔔 Minimum Qty Alert Level (Meters)</label>
        <input id="smMinStock" type="number" step="0.5" value="${esc(s.minStockMeters ?? 10)}" placeholder="Alert when stock falls below this">
      </div>
      <div class="field">
        <label>Committed Order Requirement (Meters)</label>
        <input id="smAllocated" type="number" step="0.25" value="${esc(Math.max(s.allocatedMeters || 0, liveOrdersMeters))}" placeholder="e.g. 40m">
        ${liveOrdersMeters > 0 ? `<span style="font-size:10.5px;color:var(--gold-strong);">Active pipeline orders using this swatch: <b>${liveOrdersMeters}m</b> (${alloc.openOrderNos.join(", ")})</span>` : ""}
      </div>
      <div class="field full">
        <label>Tailor &amp; Cutter Notes</label>
        <textarea id="smNotes" placeholder="Drape, pressing temperature, matching lining code…">${esc(s.notes || "")}</textarea>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="smCancel">Cancel</button>
      <button class="btn primary" id="smSave">${s.id ? "Save Swatch & Vendor" : "Add Swatch & Vendor"}</button>
    </div>
  `);
  $("#smCancel").onclick = closeModal;
  $("#smSave").onclick = () => {
    const code = $("#smCode").value.trim();
    if (!code) { $("#smCode").focus(); return; }
    const stockM = parseFloat($("#smStock").value) || 0;
    const minM = parseFloat($("#smMinStock").value) || 0;
    const allocM = parseFloat($("#smAllocated").value) || 0;
    const rec = {
      id: s.id || uid("sw"),
      code,
      category: $("#smCat").value,
      book: $("#smBook").value.trim(),
      mill: $("#smMill").value.trim(),
      vendorName: $("#smVendorName").value.trim() || $("#smMill").value.trim(),
      vendorContact: $("#smVendorContact").value.trim(),
      colorName: $("#smColorName").value.trim(),
      colorHex: $("#smHex").value,
      composition: $("#smComp").value.trim(),
      costPerMeter: parseFloat($("#smCost").value) || 0,
      stockMeters: stockM,
      minStockMeters: minM,
      allocatedMeters: allocM,
      status: allocM > stockM ? "Shortage Alert" : (stockM < minM ? "Low Stock Alert" : "In Stock"),
      notes: $("#smNotes").value.trim()
    };
    DB.swatches[rec.id] = rec;
    persist();
    closeModal();
    toast("Swatch " + rec.code + ", Min Alert & Vendor details saved");
    render();
  };
}

function pickClientModal() {
  const list = Object.values(DB.clients).sort((a, b) => a.name.localeCompare(b.name));
  if (!list.length) { clientModal(null, true); return; }
  openModal(`
    <h2>New Measurement Docket — Select Existing or Add New Client</h2>
    <div class="searchrow">
      <input id="pickSearch" type="text" placeholder="Search client by name, company, city or phone…">
      <button class="btn primary" id="pickNewTop">＋ Add New Client &amp; Measure</button>
    </div>
    <div id="pickList" style="max-height:320px;overflow:auto;"></div>
    <div class="actions">
      <button class="btn" id="pickCancel">Cancel</button>
    </div>
  `);
  const draw = q => {
    q = (q || "").toLowerCase();
    $("#pickList").innerHTML = "<table><tbody>" + list
      .filter(c => !q || (c.name + " " + (c.company || "") + " " + (c.city || "") + " " + (c.phone || "")).toLowerCase().includes(q))
      .map(c => `<tr class="rowlink" data-pick="${c.id}">
        <td>
          <span class="cname">
            <span class="avatar">${esc(initials(c.name))}</span>
            <span>
              ${esc(c.name)}
              <div style="font-size:11.5px;color:var(--ink-soft);font-weight:400;">${esc(c.company || "")}</div>
            </span>
          </span>
        </td>
        <td style="color:var(--ink-soft);">${esc(c.phone || "")}</td>
        <td style="text-align:right;"><span class="badge">${esc(c.city || c.branch || "Mumbai")}</span></td>
      </tr>`).join("") + "</tbody></table>";
    $$("#pickList [data-pick]").forEach(r => r.onclick = () => {
      closeModal();
      ACTIONS.measureFor(r.dataset.pick);
    });
  };
  draw("");
  $("#pickSearch").oninput = e => draw(e.target.value);
  $("#pickSearch").focus();
  $("#pickCancel").onclick = closeModal;
  $("#pickNewTop").onclick = () => { closeModal(); clientModal(null, true); };
}

/* ============================================================================
   ACTIONS CONTROLLER
   ============================================================================ */
const ACTIONS = {
  newClient() { clientModal(null, false); },
  editClient(id) { clientModal(DB.clients[id], false); },
  newEmployee() { employeeModal(null); },
  editEmployee(id) { employeeModal(DB.employees[id]); },
  deleteEmployee(id) {
    const emp = DB.employees[id];
    if (!emp) return;
    if (Object.keys(DB.employees).length <= 1) {
      toast("At least one employee must remain in the roster.");
      return;
    }
    confirmDialog(
      "Remove Employee",
      `Remove "${emp.name}" (${emp.role}) from the active team roster? Past measurement dockets and orders will keep their recorded name.`,
      "Remove Employee",
      () => {
        delete DB.employees[id];
        persist();
        toast(emp.name + " removed from roster");
        render();
      }
    );
  },
  newOrder(id) { orderModal(null, id); },
  newOrderPick() { orderModal(null, Object.keys(DB.clients)[0]); },
  editOrder(id) { orderModal(DB.orders[id]); },
  openSequenceModal(id) { sequenceModal(id); },
  openEnquiryWizard() { enquiryWizardModal(); },
  newSwatch() { swatchModal(null); },
  editSwatch(id) { swatchModal(DB.swatches[id]); },
  newMeasurePick() { pickClientModal(); },
  measureFor(id) {
    ACTIVE_MEASURE_TAB = "lower";
    MREC = blankMeasure(id);
    go("measure");
  },
  openMeasure(id) {
    if (DB.measurements[id]) {
      ACTIVE_MEASURE_TAB = "lower";
      MREC = JSON.parse(JSON.stringify(DB.measurements[id]));
      go("measure");
    }
  },
  openMeasureByOrder(orderId) {
    const o = DB.orders[orderId];
    if (!o) return;
    let m = Object.values(DB.measurements).find(x =>
      (x.orderNo || "").trim().toUpperCase() === (o.orderNo || "").trim().toUpperCase()
    );
    if (!m) {
      // Create a linked measurement docket for this order so the user can immediately enter measurements
      m = blankMeasure(o.clientId);
      m.orderNo = o.orderNo;
      m.swatchCode = o.swatchCode || "SW-1042";
      m.measuredBy = o.assignedTo || DB.settings.measuredByDefault || "Susheel Racherla";
      m.estGarmentType = o.garments || "2-Piece Bespoke Suit";
      DB.measurements[m.id] = m;
      persist();
    }
    ACTIVE_MEASURE_TAB = "lower";
    MREC = JSON.parse(JSON.stringify(m));
    go("measure");
  },
  dupMeasure(id) {
    const src = DB.measurements[id];
    if (!src) return;
    ACTIVE_MEASURE_TAB = "lower";
    MREC = blankMeasure(src.clientId);
    MREC.measures = JSON.parse(JSON.stringify(src.measures || {}));
    MREC.ticks = JSON.parse(JSON.stringify(src.ticks || {}));
    MREC.texts = JSON.parse(JSON.stringify(src.texts || {}));
    MREC.swatchCode = src.swatchCode || "";
    MREC.unit = src.unit || "in";
    go("measure");
    toast("Created new docket copied from " + fmtDate(src.date));
  },
  copyPrev() {
    const prev = Object.values(DB.measurements)
      .filter(m => m.clientId === MREC.clientId && m.id !== MREC.id)
      .sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""))[0]
      || Object.values(DB.measurements)
      .filter(m => m.clientId === MREC.clientId)
      .sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""))[0];

    if (!prev) {
      toast("No previous measurement record found for this client.");
      return;
    }
    MREC.measures = JSON.parse(JSON.stringify(prev.measures || {}));
    MREC.ticks = JSON.parse(JSON.stringify(prev.ticks || {}));
    MREC.texts = JSON.parse(JSON.stringify(prev.texts || {}));
    MREC.swatchCode = prev.swatchCode || MREC.swatchCode;
    MREC.unit = prev.unit || "in";
    render();
    mountMeasure();
    toast("Copied measurements from " + fmtDate(prev.date));
  },
  clearMeasure() {
    confirmDialog(
      "Clear All Measurements",
      "Are you sure you want to clear all fields in the current measurement docket?",
      "Clear Fields",
      () => {
        MREC = blankMeasure(MREC.clientId);
        render();
        mountMeasure();
        toast("Measurement fields cleared");
      }
    );
  },
  clearLogo() {
    DB.settings.logoDataUrl = "";
    persist();
    toast("Reverted to default Modisto crest logo");
    render();
  },
  saveSettings() {
    DB.settings.appsScriptUrl = $("#setUrl").value.trim();
    DB.settings.measuredByDefault = $("#setBy").value.trim();
    DB.settings.atelierContactLine1 = $("#setContact1").value.trim();
    DB.settings.atelierContactLine2 = $("#setContact2").value.trim();
    DB.settings.printPagesMode = $("#setPrintMode").value;
    persist();
    toast("Branding & Print Header settings saved");
  },
  exportDb() {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "modisto-bespoke-db-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
  },
  importDb() {
    const f = $("#importFile");
    f.onchange = () => {
      const file = f.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const data = JSON.parse(r.result);
          if (!data.clients) throw new Error("Invalid backup");
          DB = Object.assign(getSeedData(), data);
          persist();
          toast("Database backup imported");
          go("dashboard");
        } catch (e) {
          toast("Invalid Modisto backup JSON file.");
        }
      };
      r.readAsText(file);
    };
    f.click();
  },
  resetSeed() {
    DB = getSeedData();
    persist();
    MREC = null;
    toast("Sample Modisto Bespoke data restored");
    go("dashboard");
  },
  wipeDb() {
    confirmDialog(
      "Erase All Data",
      "Erase ALL clients, measurements, swatches, and orders from this browser? Export a backup first if needed.",
      "Erase Everything",
      () => {
        DB = { clients: {}, measurements: {}, orders: {}, swatches: {}, employees: getSeedData().employees, settings: DB.settings };
        persist();
        MREC = null;
        toast("All local data erased");
        go("dashboard");
      }
    );
  }
};

/* ---------------- SAFE BOOT SEQUENCE ---------------- */
try {
  go("dashboard");
} catch (err) {
  console.error("Boot recovery triggered:", err);
  DB = getSeedData();
  persist();
  go("dashboard");
}
</script>
</body>
</html>
