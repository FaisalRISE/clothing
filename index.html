/* ============================================================================
   2. CLIENTS DIRECTORY & CLIENT PROFILE VIEW (With Company, Designation & City/Country Sort)
   ============================================================================ */
function bindDirectory(prefix, state, renderRows, fields) {
  const results = document.getElementById(prefix + "Rows");
  if (!results) return;
  const refresh = () => {
    results.innerHTML = renderRows(state);
    bindCommon();
  };
  for (const [id, field] of Object.entries(fields)) {
    const control = document.getElementById(id);
    control[control.type === "search" ? "oninput" : "onchange"] = () => {
      state[field] = control.type === "checkbox" ? control.checked : control.value;
      state.limit = 25;
      refresh();
    };
  }
  const more = results.querySelector("[data-directory-more]");
  if (more) more.onclick = () => {
    const previous = state.limit;
    state.limit += 25;
    refresh();
    results.querySelectorAll(".directory-card")[previous]?.querySelector("button, summary")?.focus();
  };
}

function directoryResults(items, limit, singular, plural, card) {
  if (!items.length) return `<p role="status">No matching ${plural}.</p>`;
  return `<p class="tracking-count" role="status">${items.length} ${items.length === 1 ? singular : plural}</p>
    <div class="directory-items">${items.slice(0, limit).map(card).join("")}</div>
    ${items.length > limit ? '<button class="btn tracking-load" data-directory-more>Load more</button>' : ""}`;
}

function directoryFacts(facts) {
  const recorded = facts.filter(([,value]) => value != null && value !== "");
  return recorded.length ? `<dl>${recorded.map(([label,value]) =>
    `<dt>${esc(label)}</dt><dd>${esc(value)}</dd>`).join("")}</dl>` : "<p>No details recorded.</p>";
}

function clientRows({query, branch, country, sort, limit}) {
  const activeCounts = new Map();
  const quotes = new Map();
  for (const order of Object.values(DB.orders)) {
    const id = order.clientId;
    if (!["Delivered", "Cancelled"].includes(order.status)) activeCounts.set(id, (activeCounts.get(id) || 0) + 1);
    if (sort === "spend") quotes.set(id, (quotes.get(id) || 0) + (parseFloat(order.amount) || 0));
  }
  const q = query.trim().toLowerCase();
  const list = Object.values(DB.clients).filter(client => {
    const values = [client.name, client.company, client.designation, client.city, client.country, client.phone, client.email, client.posture];
    return (!q || values.join(" ").toLowerCase().includes(q)) &&
      (!branch || (client.branch || "").includes(branch)) &&
      (!country || (client.country || "").toLowerCase() === country.toLowerCase());
  }).sort((a, b) => {
    const compare = sort === "spend" ? (quotes.get(b.id) || 0) - (quotes.get(a.id) || 0) :
      sort === "name" ? 0 : (a[sort] || "").localeCompare(b[sort] || "");
    return compare || a.name.localeCompare(b.name);
  });
  return directoryResults(list, limit, "client", "clients", client => {
    const count = activeCounts.get(client.id) || 0;
    return `<article class="card tracking-panel directory-card">
      <h2><button class="tracking-link" data-go="client|${esc(client.id)}">${esc(client.name)}</button></h2>
      <p>${esc(client.branch || "Branch unrecorded")} · ${count} active ${count === 1 ? "order" : "orders"}</p>
    </article>`;
  });
}

function vClients() {
  const {query, branch, country, sort} = CLIENT_DIRECTORY;
  const countries = [...new Set(Object.values(DB.clients).map(c => c.country).filter(Boolean))].sort();
  return `<div class="tracking">
    <div class="tracking-heading"><h1>Clients</h1><button class="btn primary" data-act="newClient">New client</button></div>
    <div class="tracking-controls" data-tracking-controls>
      <label class="tracking-search">Search clients
        <input type="search" id="clientSearch" placeholder="Name, company, phone or location" value="${esc(query)}">
      </label>
    </div>
    <details class="tracking-filters" data-tracking-controls ${branch || country || sort !== "name" ? "open" : ""}>
      <summary>Filters</summary>
      <div class="tracking-controls">
        <label>Branch <select id="clientBranchFilter">
          <option value="">All branches</option>${["Mumbai", "London"].map(name => `<option ${name === branch ? "selected" : ""}>${name}</option>`).join("")}
        </select></label>
        <label>Country <select id="clientCountryFilter">
          <option value="">All countries</option>${countries.map(name => `<option ${name === country ? "selected" : ""}>${esc(name)}</option>`).join("")}

function vClient(id) {
  const client = DB.clients[id];
  if (!client) return '<button class="btn" data-go="clients">Back to Clients</button><p>Client unavailable.</p>';
  const dockets = Object.values(DB.measurements).filter(m => m.clientId === id)
    .sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""));
  const orders = Object.values(DB.orders).filter(o => o.clientId === id)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const active = orders.filter(order => !["Delivered", "Cancelled"].includes(order.status));
  const past = orders.filter(order => !active.includes(order));
  const orderLinks = list => `<ul class="tracking-queue">${list.map(order => `<li>
    ${trackedOrderButton({order}, order.orderNo || "Open order")}
    <span>${esc(garmentOrderDescription(order))} · ${esc(order.status || "Stage unrecorded")}</span>
  </li>`).join("")}</ul>`;
  return `<div class="tracking client-profile">
    <button class="tracking-link" data-go="clients">← Clients</button>
    <div class="tracking-heading"><div><h1>${esc(client.name)}</h1><p>${esc(client.branch || "Branch unrecorded")}</p></div>
      <button class="btn primary" data-act="newOrder" data-id="${esc(id)}">New order</button></div>
    <div class="tracking-controls">
      <button class="btn" data-act="measureFor" data-id="${esc(id)}">New measurement</button>
      <button class="btn" data-act="editClient" data-id="${esc(id)}">Edit profile</button>
    </div>
    <section class="card tracking-panel"><h2>Active orders</h2>${active.length ? orderLinks(active) : "<p>No active orders.</p>"}</section>
    <details class="card tracking-panel"><summary>Client details</summary>
      ${directoryFacts([["Phone", client.phone], ["Email", client.email], ["Company", client.company], ["Designation", client.designation],
        ["Address", client.address], ["City", client.city], ["Country", client.country], ["Birthday", trackingDate(client.birthday) ? fmtDate(client.birthday) : client.birthday],
        ["Posture", client.posture], ["Style preferences", client.likes], ["Cutter remarks", client.remarks]])}
    </details>
    <details class="card tracking-panel"><summary>Measurements (${dockets.length})</summary>
      ${dockets.length ? `<ul class="tracking-queue">${dockets.map(docket => `<li>
        <button class="tracking-link" data-act="openMeasure" data-id="${esc(docket.id)}">${esc(docket.orderNo || "Open docket")}</button>
        <span>${esc([trackingDate(docket.date) ? fmtDate(docket.date) : "Date unrecorded", docket.measuredBy, docket.unit, docket.swatchCode].filter(Boolean).join(" · "))}</span>
        <div><button class="btn" data-act="dupMeasure" data-id="${esc(docket.id)}">Copy to new docket</button></div>
      </li>`).join("")}</ul>` : "<p>No measurements recorded.</p>"}
    </details>
    <details class="card tracking-panel"><summary>Past orders (${past.length})</summary>
      ${past.length ? orderLinks(past) : "<p>No past orders.</p>"}
    </details>
  </div>`;
}

function convertMeasurementUnit(record, targetUnit) {
  const sourceUnit = record.unit || "in";
  if (!["in", "cm"].includes(sourceUnit) || !["in", "cm"].includes(targetUnit)) throw new Error("Unknown unit");
  if (sourceUnit === targetUnit) return;
  const convert = value => {
    if (value == null || String(value).trim() === "") return value;
    if (!Number.isFinite(Number(value))) throw new Error("A measurement is not numeric; correct it before converting.");
    const number = sourceUnit === "in" ? Number(value) * 2.54 : Number(value) / 2.54;
    return String(Number(number.toPrecision(15)));
  };
  const measures = Object.fromEntries(Object.entries(record.measures || {}).map(([key,value]) => [key,convert(value)]));
  const texts = { ...record.texts };
  for (const key of ["bowLegInches", "knockKneesInches", "shoulderDownInches"]) {
    if (Object.hasOwn(texts, key)) texts[key] = convert(texts[key]);
  }
  record.measures = measures;
  record.texts = texts;
  record.unit = targetUnit;
}

const MEASUREMENT_VIEW_KEY = DB_KEY + "_measurement_view";
let measureViewPreference;
try { measureViewPreference = localStorage.getItem(MEASUREMENT_VIEW_KEY); } catch {}
let PRINT_PREVIEW_OPEN = false;

function measurementViewMode() {
  if (["tabs", "relevant", "all"].includes(measureViewPreference)) return measureViewPreference;
  return DB.settings.viewMode === "tabs" || matchMedia("(max-width: 720px)").matches ? "tabs" : "relevant";
}

function orderNumberKey(value) {
  return String(value ?? "").trim().toUpperCase();
}

function linkedOrderForDocket(docket, orders = DB.orders) {
  const number = orderNumberKey(docket.orderNo);
  const clientOrders = Object.values(orders).filter(order => order.clientId === docket.clientId);
  return clientOrders.find(order => docket.id && order.measurementId === docket.id)
    || clientOrders.find(order => !order.measurementId && number && orderNumberKey(order.orderNo) === number);
}

function relevantMeasurementSections(record) {
  const sections = new Set();
  const names = record.selectedGarments?.length ? record.selectedGarments.map(g => g.name).join(" ") : (record.estGarmentType || "");
  if (/suit|tuxedo/i.test(names)) { sections.add("lower"); sections.add("upper"); }
  if (/trouser|gurkha|pyjama/i.test(names)) sections.add("lower");
  if (/shirt/i.test(names)) sections.add("shirt");
  if (/blazer|jacket/i.test(names) && !/nehru/i.test(names)) sections.add("upper");
  if (/3-piece|waistcoat|bandi|sherwani|kurta/i.test(names)) sections.add("wbs");
  for (const [section, schemas] of Object.entries({ lower: [SCHEMA.lower], shirt: [SCHEMA.shirt], upper: [SCHEMA.upper], wbs: [SCHEMA.waistcoat,SCHEMA.bandi,SCHEMA.sherwani] })) {
    if (schemas.some(schema => schema.measures.some(key => record.measures?.[key] != null && record.measures[key] !== ""))) sections.add(section);
  }
  for (const [section, keys] of Object.entries({ lower: ["bowLegInches", "knockKneesInches", "bowLegComment", "knockKneesComment", "forwardStanceComment"], shirt: ["shirtComments", "cuffComment", "collarComment"], upper: ["shoulderDownInches", "suitComments"], wbs: ["waistcoatComments", "bandiComments", "sherwaniComments"] })) {
    if (keys.some(key => record.texts?.[key] != null && String(record.texts[key]).trim() !== "")) sections.add(section);
  }
  return sections.size ? sections : new Set(["lower", "shirt", "upper", "wbs"]);
}

function applyMeasurementSections() {
  const mode = measurementViewMode();
  const relevant = relevantMeasurementSections(MREC);
  const tabs = $$("#mtabs [data-p]");
  const visibleTabs = tabs.filter(tab => mode !== "relevant" || tab.dataset.p === "vguide" || relevant.has(tab.dataset.p));
  if (!visibleTabs.some(tab => tab.dataset.p === ACTIVE_MEASURE_TAB)) {
    ACTIVE_MEASURE_TAB = visibleTabs[0].dataset.p;
  }
  for (const tab of tabs) {
    const section = tab.dataset.p;
    const active = section === ACTIVE_MEASURE_TAB;
    tab.hidden = !visibleTabs.includes(tab);
    tab.classList.toggle("on", active);
    tab.setAttribute("aria-pressed", String(active));
    $("#panel-" + section).classList.toggle("on", mode === "tabs" || section === "vguide" ? active : !tab.hidden);
  }
  $("#panel-summary").classList.toggle("on", PRINT_PREVIEW_OPEN);
  $("#mViewMode").value = mode;
}

function updateLiveFabricEstimatorUI() {
  const fabEst = estimateFabricFromMeasurements(MREC, MREC.estGarmentType || "2-Piece Bespoke Suit", MREC.estSetCount || 1);
  const swatchStatus = getSwatchAllocationStatus(MREC.swatchCode, 0);
  const projectedWithThis = swatchStatus ? Math.round((swatchStatus.stockMeters - fabEst.totalMeters) * 100) / 100 : null;

  const sumEl = $("#fabricEstSummaryText");
  if (sumEl) {
    sumEl.innerHTML = `Est. Cloth Needed: <b style="font-size:14px;color:var(--navy);">${fabEst.totalMeters.toFixed(2)} m</b> <span style="color:var(--ink-soft);font-size:11.5px;">(${esc(fabEst.breakdownText)})</span>`;
  }
  const alertEl = $("#fabricStockCheckAlert");
  if (alertEl) {
    alertEl.innerHTML = `
      <span>
        Quick Reference for this Client:
        <b>2-Pc Suit:</b> ${fabEst.perGarment.suit2pc.toFixed(2)}m &nbsp;·&nbsp;
        <b>3-Pc Suit:</b> ${fabEst.perGarment.suit3pc.toFixed(2)}m &nbsp;·&nbsp;
        <b>Trouser:</b> ${fabEst.perGarment.trouser.toFixed(2)}m &nbsp;·&nbsp;
        <b>Shirt:</b> ${fabEst.perGarment.shirt.toFixed(2)}m &nbsp;·&nbsp;
        <b>Sherwani:</b> ${fabEst.perGarment.sherwani.toFixed(2)}m
      </span>
      <span>
        ${swatchStatus ? (
          (swatchStatus.isShort || fabEst.totalMeters > swatchStatus.stockMeters)
            ? `<span style="color:var(--danger);font-weight:700;">⚠ STOCK ALERT (${esc(swatchStatus.swatch.code)}): Need ${Math.max(fabEst.totalMeters, swatchStatus.requiredMeters)}m vs ${swatchStatus.stockMeters}m in stock — Short by ${Math.max(0, Math.round((Math.max(fabEst.totalMeters, swatchStatus.requiredMeters) - swatchStatus.stockMeters) * 100) / 100)}m!</span>`
            : `<span style="color:var(--green);font-weight:700;">✓ ${esc(swatchStatus.swatch.code)} In Stock: ${swatchStatus.stockMeters}m available (${projectedWithThis}m remaining after this ${fabEst.totalMeters}m order)</span>`
        ) : `<span style="color:var(--ink-soft);">Select a Swatch # to verify stock availability</span>`}
      </span>
    `;
  }
}

function mountMeasure() {
  if (!measurementBaselines.has(MREC)) measurementBaselines.set(MREC, JSON.stringify(MREC));
  const renderMList = (boxId, list) => {
    const box = $(boxId);
    if (!box) return;
    box.innerHTML = "";
    list.forEach(name => {
      const v = MREC.measures[name] != null ? MREC.measures[name] : "";
      const row = document.createElement("div");
      row.className = "mrow";
      row.innerHTML = `
        <span class="lbl">${esc(name)}</span>
        <input type="number" step="any" inputmode="decimal" placeholder="0.00" data-m="${esc(name)}" value="${esc(v)}" aria-label="${esc(name)}">
        <span class="unit unitlbl">${esc(MREC.unit)}</span>
      `;
      box.appendChild(row);
    });
  };

  const renderTList = (boxId, list) => {
    const box = $(boxId);
    if (!box) return;
    box.innerHTML = "";
    list.forEach(([name, options]) => {
      const row = document.createElement("div");
      row.className = "trow";
      row.innerHTML = `
        <span class="lbl">${esc(name)}</span>
        <span class="seg">
          ${options.map(o => `<button type="button" data-t="${esc(name)}" data-v="${esc(o)}" class="${MREC.ticks[name] === o ? "on" : ""}">${esc(o)}</button>`).join("")}
        </span>
      `;
      box.appendChild(row);
    });
  };

  renderMList("#m-lower", SCHEMA.lower.measures);
  renderTList("#t-lower", SCHEMA.lower.ticks);
  renderMList("#m-shirt", SCHEMA.shirt.measures);
  renderTList("#t-shirt", SCHEMA.shirt.ticks);
  renderMList("#m-upper", SCHEMA.upper.measures);
  renderTList("#t-upper", SCHEMA.upper.ticks);
  renderMList("#m-waistcoat", SCHEMA.waistcoat.measures);
  renderMList("#m-bandi", SCHEMA.bandi.measures);
  renderMList("#m-sherwani", SCHEMA.sherwani.measures);

  // Render Interactive Visual Guide (Tab 5)
  const renderInteractiveVGuide = () => {
    const vgBox = $("#interactiveVGuideGrid");
    if (!vgBox) return;
    vgBox.innerHTML = VISUAL_GUIDE_ITEMS.map(item => {
      let val = "";
      if (item.field === "__STANCE_INCHES__") {
        val = MREC.texts[MREC.ticks["Leg Stance"] === "Knock Knees" ? "knockKneesInches" : "bowLegInches"] ?? "";
      } else {
        val = MREC.measures[item.field] ?? (item.altField ? MREC.measures[item.altField] : "") ?? "";
      }
      return `
        <div class="vg-card">
          <div class="vg-head"><span class="code">${esc(item.code)} -</span> ${esc(item.title)}</div>
          <div class="vg-svg">${item.svg}</div>
          <div class="vg-inp-row">
            <span class="ulbl unitlbl">${esc(MREC.unit)}</span>
            <input type="number" step="any" inputmode="decimal" placeholder="0.00" data-vg-field="${esc(item.field)}" data-vg-alt="${esc(item.altField || "")}" value="${esc(val)}">
          </div>
          <div class="vg-desc">${esc(item.desc)}</div>
        </div>
      `;
    }).join("");

    $$("input[data-vg-field]").forEach(inp => {
      inp.onfocus = () => {
        LAST_FOCUSED_INPUT = inp;
        const indicator = $("#focusedFieldLabel");
        if (indicator) indicator.innerHTML = `Active Visual Diagram: <b style="color:#fff;">${esc(inp.dataset.vgField === "__STANCE_INCHES__" ? "Bow/Knock Inches" : inp.dataset.vgField)}</b>`;
      };
      inp.oninput = () => {
        const f = inp.dataset.vgField;
        const v = inp.value.trim();
        if (f === "__STANCE_INCHES__") {
          if (MREC.ticks["Leg Stance"] === "Knock Knees") MREC.texts.knockKneesInches = v;
          else MREC.texts.bowLegInches = v;
          const bInp = $(`input[data-x="bowLegInches"]`);
          const kInp = $(`input[data-x="knockKneesInches"]`);
          if (bInp && MREC.ticks["Leg Stance"] !== "Knock Knees") bInp.value = v;
          if (kInp && MREC.ticks["Leg Stance"] === "Knock Knees") kInp.value = v;
        } else {
          if (v === "") delete MREC.measures[f];
          else MREC.measures[f] = v;
          const mainInp = $(`input[data-m="${CSS.escape(f)}"]`);
          if (mainInp) mainInp.value = v;
        }
        updateLiveFabricEstimatorUI();
        buildSummary();
      };
    });
  };
  renderInteractiveVGuide();

  // Sync segmented buttons & Suit Matrix buttons
  function syncTickUI(key) {
    const val = MREC.ticks[key];
    $$(`button[data-t="${CSS.escape(key)}"]`).forEach(b => b.classList.toggle("on", b.dataset.v === val));
    $$(`button[data-mat-t="${CSS.escape(key)}"]`).forEach(b => b.classList.toggle("on", b.dataset.matV === val));
    if (key === "Leg Stance") {
      const callout = $("#legStanceCallout");
      const badge = $("#stanceActiveBadge");
      if (badge) badge.textContent = val || "Regular";
      if (callout) callout.classList.toggle("active-highlight", val === "Bow Leg" || val === "Knock Knees");
    }
    updateLiveFabricEstimatorUI();
    buildSummary();
  }

  $$(".seg button[data-t]").forEach(b => b.onclick = () => {
    const key = b.dataset.t;
    const val = b.dataset.v;
    if (MREC.ticks[key] === val) delete MREC.ticks[key];
    else MREC.ticks[key] = val;
    syncTickUI(key);
  });

  $$("button[data-mat-t]").forEach(b => b.onclick = () => {
    const key = b.dataset.matT;
    const val = b.dataset.matV;
    MREC.ticks[key] = val;
    syncTickUI(key);
  });

  // Track focused measurement input for the Quarter-Inch Helper Bar
  $$("input[data-m], input[data-x='bowLegInches'], input[data-x='knockKneesInches']").forEach(inp => {
    inp.addEventListener("focus", () => {
      LAST_FOCUSED_INPUT = inp;
      const lbl = inp.dataset.m || inp.dataset.x;
      const indicator = $("#focusedFieldLabel");
      if (indicator) indicator.innerHTML = `Active field: <b style="color:#fff;">${esc(lbl)}</b>`;
    });
  });

  // Quarter-Inch Helper Bar buttons (.0, .25, .5, .75, -0.25, +0.25)
  $$(".fraction-bar .fbtn").forEach(btn => {
    btn.onclick = () => {
      if (!LAST_FOCUSED_INPUT) {
        toast("Tap any measurement box first, then click a quarter-inch button.");
        return;
      }
      let cur = parseFloat(LAST_FOCUSED_INPUT.value);
      if (isNaN(cur)) cur = 0;

      if (btn.dataset.frac !== undefined) {
        const whole = Math.floor(cur);
        const frac = parseFloat(btn.dataset.frac);
        const nextVal = whole + frac;
        LAST_FOCUSED_INPUT.value = nextVal.toString();
      } else if (btn.dataset.step !== undefined) {
        const delta = parseFloat(btn.dataset.step);
        const nextVal = Math.max(0, Math.round((cur + delta) * 100) / 100);
        LAST_FOCUSED_INPUT.value = nextVal.toString();
      }
      LAST_FOCUSED_INPUT.dispatchEvent(new Event("input"));
      LAST_FOCUSED_INPUT.focus();
    };
  });

  // Bind measurement inputs
  $$("input[data-m]").forEach(i => i.oninput = () => {
    if (i.value.trim() === "") delete MREC.measures[i.dataset.m];
    else MREC.measures[i.dataset.m] = i.value.trim();
    const vgInp = $(`input[data-vg-field="${CSS.escape(i.dataset.m)}"]`) || $(`input[data-vg-alt="${CSS.escape(i.dataset.m)}"]`);
    if (vgInp) vgInp.value = i.value.trim();
    updateLiveFabricEstimatorUI();
    buildSummary();
  });

  // Bind text/comment inputs
  $$("input[data-x], textarea[data-x]").forEach(i => i.oninput = () => {
    if (i.value.trim() === "") delete MREC.texts[i.dataset.x];
    else MREC.texts[i.dataset.x] = i.value.trim();
    if (i.dataset.x === "bowLegInches" || i.dataset.x === "knockKneesInches") {
      const vgStance = $(`input[data-vg-field="__STANCE_INCHES__"]`);
      if (vgStance) vgStance.value = i.value.trim();
    }
    buildSummary();
  });

  // Bind swatch sub-fields (both <select> and <input>)
  $$("[data-field]").forEach(i => {
    const handler = () => {
      MREC[i.dataset.field] = i.value.trim();
      buildSummary();
    };
    i.oninput = handler;
    i.onchange = handler;
  });

  // Multi-Garment Picker Cards inside Measurements
  $$("#measureGarmentPicker [data-gp-id]").forEach(btn => {
    btn.onclick = () => {
      const gid = btn.dataset.gpId;
      const gObj = GARMENT_CATALOG.find(x => x.id === gid);
      if (!gObj) return;
      if (!MREC.selectedGarments) MREC.selectedGarments = [];
      const idx = MREC.selectedGarments.findIndex(x => x.id === gid || x.name === gObj.name);
      if (idx >= 0) {
        MREC.selectedGarments.splice(idx, 1);
        btn.classList.remove("sel");
      } else {
        MREC.selectedGarments.push({ id: gObj.id, name: gObj.name, qty: 1, swatchCode: MREC.swatchCode || "" });
        btn.classList.add("sel");
      }
      if (MREC.selectedGarments.length > 0) {
        MREC.estGarmentType = MREC.selectedGarments[0].name;
        const estGarSel = $("#estGarmentSelect");
        if (estGarSel) estGarSel.value = MREC.estGarmentType;
      }
      const badge = $("#selectedGarmentsSummaryBadge");
      if (badge) {
        badge.textContent = MREC.selectedGarments.length
          ? MREC.selectedGarments.map(g => `${g.qty || 1}× ${g.name}`).join(" + ")
          : "Click items below";
      }
      applyMeasurementSections();
      updateLiveFabricEstimatorUI();
      buildSummary();
    };
  });

  $("#mNotes").oninput = e => { MREC.notes = e.target.value; buildSummary(); };
  $("#mOrderNo").oninput = e => {
    MREC.orderNo = e.target.value;
    $("#measureContext").textContent = MREC.orderNo || "New docket";
    buildSummary();
  };
  $("#mDate").onchange = e => { MREC.date = e.target.value; buildSummary(); };
  $("#mSwatchCode").onclick = () => pickPrimarySwatch(code => {
    MREC.swatchCode = code;
    $("#mSwatchCode").textContent = code ? "Search swatches · " + code : "Search swatches";
    $("#docketDetailsLabel").textContent = code ? "Docket details · " + code : "Docket details";
    updateLiveFabricEstimatorUI();
    buildSummary();
    markDirty();
  });
  $("#mBy").onchange = e => {
    MREC.measuredBy = e.target.value;
    buildSummary();
  };
  $("#mUnit").onchange = e => {
    try {
      convertMeasurementUnit(MREC, e.target.value);
      LAST_FOCUSED_INPUT = null;
      render();
      $("#mUnit").focus({preventScroll: true});
      toast("Numeric measurements converted to " + MREC.unit + ". Free-text notes retain their written units.");
    } catch (error) {
      e.target.value = MREC.unit;
      toast(error.message);
    }
  };

  // Fabric Estimator controls inside Measurements
  const estGarSel = $("#estGarmentSelect");
  const estSetInp = $("#estSetCountInput");
  if (estGarSel) {
    estGarSel.onchange = () => {
      MREC.estGarmentType = estGarSel.value;
      updateLiveFabricEstimatorUI();
      buildSummary();
    };
  }
  if (estSetInp) {
    estSetInp.oninput = () => {
      MREC.estSetCount = parseFloat(estSetInp.value) || 1;
      updateLiveFabricEstimatorUI();
      buildSummary();
    };
  }

  $("#mClientSelect").onclick = () => pickClientModal(id => {
    if (id === MREC.clientId) return;
    const latest = Object.values(DB.measurements)
      .filter(docket => docket.clientId === id)
      .sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""))[0];
    if (latest) ACTIONS.openMeasure(latest.id);
    else ACTIONS.measureFor(id);
  }, "Search clients", () => leaveMeasurementDraft(() => clientModal(null, true)));
  $("#mViewMode").onchange = event => {
    measureViewPreference = event.target.value;
    try { localStorage.setItem(MEASUREMENT_VIEW_KEY, measureViewPreference); } catch {}
    applyMeasurementSections();
  };

  // Toggle 1-Page vs 2-Page Print Format WITHOUT jumping back to Tab 1 (Point 7 Fix!)
  const applyPrintModeInPlace = async (newMode) => {
    DB.settings.printPagesMode = newMode;
    if (!await persist()) return;
    const label = newMode === "2page" ? "2 Pages (Table + Visual Guide)" : "1 Page (Condensed Table Only)";
    $$("[data-set-pmode]").forEach(b => b.classList.toggle("primary", b.dataset.setPmode === newMode));
    buildSummary();
    toast(`Print Sheet set to ${label}`);
  };

  $$("[data-set-pmode]").forEach(b => b.onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    applyPrintModeInPlace(b.dataset.setPmode);
  });

  $$("#mtabs .tab[data-p]").forEach(t => t.onclick = () => {
    ACTIVE_MEASURE_TAB = t.dataset.p;
    applyMeasurementSections();
    if (measurementViewMode() !== "tabs") {
      $("#panel-" + t.dataset.p).scrollIntoView({ behavior: "smooth", block: "start" });
    }
  });
  $("#abSave").onclick = saveMeasure;
  $("#abCreateOrder").hidden = Boolean(linkedOrderForDocket(MREC));
  $("#abCreateOrder").onclick = createOrderFromMeasurement;
  $("#abNewClient").onclick = () => leaveMeasurementDraft(() => clientModal(null, true));
  $("#abPrint").onclick = () => {
    PRINT_PREVIEW_OPEN = true;
    buildSummary();
    applyMeasurementSections();
    $("#panel-summary").scrollIntoView({ behavior: "smooth", block: "start" });
    $("#printNow").focus({ preventScroll: true });
  };
  $("#printNow").onclick = () => { buildSummary(); window.print(); };
  $("#closePrintPreview").onclick = () => {
    PRINT_PREVIEW_OPEN = false;
    applyMeasurementSections();
    $("#abPrint").focus();
  };
  $("#abCopyPrev").onclick = () => ACTIONS.copyPrev();
  $("#abClearAll").onclick = () => ACTIONS.clearMeasure();
  $("#abNewMeasure").onclick = () => pickClientModal();
  LAST_FOCUSED_INPUT = null;
  $$(".fraction-bar .fbtn").forEach(b => b.disabled = MREC.unit === "cm");
  $("#focusedFieldLabel").textContent = MREC.unit === "cm" ? "Metric entry: type decimals directly. Fraction buttons apply in inches." : "Focus a measurement, then choose a fraction.";
  applyMeasurementSections();

  if ($("#status")) {
    $("#status").textContent = MREC.savedAt
      ? "Editing saved docket · " + MREC.orderNo
      : "New measurement docket — click Save Measurements when done";
  }

  const markDirty = () => {
    if (measurementBaselines.get(MREC) !== JSON.stringify(MREC)) {
      $("#status").textContent = "Unsaved measurement changes · " + MREC.orderNo;
    }
  };
  $("#main").oninput = markDirty;
  $("#main").onchange = markDirty;
  $$(".seg button[data-t], button[data-mat-t], #measureGarmentPicker [data-gp-id]").forEach(button => button.addEventListener("click", markDirty));
  markDirty();
  buildSummary();
}

function buildDocketHeaderHTML(pageNum, totalPages) {
  const c = DB.clients[MREC.clientId] || {};
  const sw = getSwatchByCode(MREC.swatchCode);
  const line1 = (DB.settings && DB.settings.atelierContactLine1) || "Mumbai Atelier: Andheri West · London Studio: Northwood";

async function saveMeasure() {
  if (!DB.clients[MREC.clientId]) { toast("Choose a client before saving."); return; }
  const snapshot = JSON.parse(JSON.stringify(MREC));
  snapshot.savedAt = new Date().toISOString();
  let next;
  try {
    const latest = latestStoredDatabase();
    if (JSON.stringify(latest.measurements[snapshot.id] || null) !== JSON.stringify(DB.measurements[snapshot.id] || null)) {
      throw new Error("This docket changed in another tab. Copy your draft notes, then reload the saved docket before retrying.");
    }
    next = { ...latest, measurements: { ...latest.measurements, [snapshot.id]: snapshot } };
    await writeDatabase(next);
  } catch (e) {
    $("#status").textContent = "Save failed — draft retained. " + e.message;
    toast("Measurement save failed. " + e.message);
    return;
  }
  DB = next;
  MREC.savedAt = snapshot.savedAt;
  measurementBaselines.set(MREC, JSON.stringify(MREC));
  $("#status").textContent = (SHARED_MODE ? "Saved to local staging server · " : "Saved locally · ") + MREC.orderNo + " · " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  toast(SHARED_MODE ? "Measurements saved to staging server" : "Measurements saved locally");
  // An opaque no-cors response cannot acknowledge a Sheets write.
  if (DB.settings.appsScriptUrl) {
    const sent = await pushToSheets("Measurements", flatMeasure(snapshot));
    toast(sent ? "Saved locally; Sheets export sent (unconfirmed)." : "Saved locally; Sheets export failed.");
  }
}

  if (!item.order.garmentJobs?.length) return "Breakdown needed";

function openGarmentWorkspace(orderId) {
  let latest;
  try { latest = latestStoredDatabase(); } catch (error) { toast(error.message); return; }
  const order = latest.orders[orderId];
  if (!order) return;
  DB.orders = { ...DB.orders, [orderId]: order };
  GARMENT_WORKSPACE = {
    orderId, original: JSON.stringify(order), savedJobs: JSON.stringify(order.garmentJobs || []),
    overview: VIEW.name === "orderOverview" ? {...VIEW} : null,
    fromWorkshop: VIEW.name === "team",
    jobs: copyGarmentData(order.garmentJobs || []), versions: copyGarmentData(latest.measurementVersions || {})
  };
  go("garments", { id: orderId });
}

  openGarmentWorkspace(orderId);
  if (VIEW.name !== "garments" || GARMENT_WORKSPACE.orderId !== orderId) return;
  const card = $$("[data-job-card]").find(element => element.dataset.jobCard === jobId);

function garmentTimeline(workflow, today) {
  const next = (workflow || []).find(step => !step.done);
  const fittings = (workflow || []).filter(isTrialWorkflowStep);
  const upcoming = fittings.filter(step => !step.done && trackingDate(step.scheduledDate) >= today)
    .sort((a, b) => a.scheduledDate.localeCompare(b.scheduledDate))[0];
  return {next, upcoming, fittings};
}

function workflowDisplayLabel(step) {
  const label = (step.label || "Task").replace(/^\d+\.\s*/, "");
  return isTrialWorkflowStep(step) ? label.replace(/\s+Done$/, "") : label;
}

function garmentWorkflowHistory(workflow) {
  if (!workflow?.length) return "<p>No workflow recorded.</p>";
  return `<ul>${workflow.map(step => `<li><b>${esc(workflowDisplayLabel(step))}</b> · ${step.done ? "Completed" : "Pending"}
    ${trackingDate(step.scheduledDate) ? " · Scheduled " + esc(fmtDate(step.scheduledDate)) : ""}
    ${isTrialWorkflowStep(step) && !step.done && !trackingDate(step.scheduledDate) ? " · Date not scheduled" : ""}
    ${step.done && trackingDate(step.doneDate) ? " · Completed " + esc(fmtDate(step.doneDate)) : ""}
    ${step.assignedTo ? " · " + esc(step.assignedTo) : ""}
    ${step.notes ? `<p>${esc(step.notes)}</p>` : ""}

}

                ${event.before.measurementVersionId !== event.after.measurementVersionId ? `<p>Measurement copy · ${esc(event.before.measurementVersionId || "Unrecorded")} → ${esc(event.after.measurementVersionId || "Unrecorded")}</p>` : ""}

  const version = GARMENT_WORKSPACE.versions[job.measurementVersionId];

  return `

      <label for="gjDocket">Saved measurements</label>
      <select id="gjDocket"><option value="">Choose later</option>
        ${version && !dockets.some(docket => docket.id === version.sourceMeasurementId) ? `<option selected value="${esc(version.sourceMeasurementId)}">Keep saved measurement copy</option>` : ""}
        ${dockets.map(docket => `<option value="${esc(docket.id)}" ${docket.id === version?.sourceMeasurementId ? "selected" : ""}>${esc(docket.orderNo || docket.id)} · ${fmtDate(docket.date)} · ${esc(docket.unit || "in")}</option>`).join("")}
      </select>
      ${version ? `<p>Current copy saved ${esc(version.sourceSavedAt || version.snapshot.date || "date not recorded")}</p>

      <label for="gjSwatch">Fabric swatch</label>
      <input id="gjSwatch" list="gjSwatchOptions" value="${esc(job.swatchCode || "")}" placeholder="Type a swatch code">

    </div>

function readGarmentAssignments(job = {}) {
  const workspace = GARMENT_WORKSPACE;
  const order = DB.orders[workspace.orderId];
  const typedSwatch = $("#gjSwatch").value.trim();
  const swatch = getSwatchByCode(typedSwatch);
  if (typedSwatch && !swatch && typedSwatch !== job.swatchCode) throw new Error("Choose a swatch from the fabric library.");
  const maker = $("#gjMaker").value.trim();
  if (maker && maker !== job.maker && !Object.values(DB.employees).some(employee => employee.name === maker)) {
    throw new Error("Choose a maker from the team roster.");
  }
  const docketId = $("#gjDocket").value;
  const current = workspace.versions[job.measurementVersionId];
  let versionId = docketId ? job.measurementVersionId || "" : "";
  if (docketId && (docketId !== current?.sourceMeasurementId || $("#gjRefresh")?.checked)) {
    const latest = latestStoredDatabase();
    if (latest.measurements[docketId]?.clientId !== order.clientId) throw new Error("Choose measurements for this client.");
    versionId = captureGarmentMeasurement(docketId, latest, workspace.versions);
  }
  return { maker, swatchCode: swatch?.code || typedSwatch, measurementVersionId: versionId };
}

function garmentJobModal(jobId, {addFitting = false} = {}) {
  const workspace = GARMENT_WORKSPACE;
  const job = workspace.jobs.find(item => item.id === jobId);
  const editing = Boolean(job);
  if (job?.cancellation) { toast("Reinstate the garment before editing it."); return; }
  if (addFitting && (!job || job.status === "Delivered")) { toast("This garment no longer has an active fitting."); return; }
  let draftWorkflow = copyGarmentData(job?.workflow || []);
  const taskFields = fitting => draftWorkflow.map((step, index) => isTrialWorkflowStep(step) !== fitting ? "" : `
    <div class="garment-task">
      <label><input type="checkbox" data-gj-done="${index}" ${step.done ? "checked" : ""}>${esc(step.label)}</label>
      ${isTrialWorkflowStep(step) ? `<label class="garment-task-date">Scheduled date<input type="date" data-gj-planned="${index}" aria-label="Scheduled date for ${esc(step.label)}" value="${esc(step.scheduledDate || "")}"></label>` : ""}
      <label class="garment-task-date">Completed date<input type="date" data-gj-date="${index}" aria-label="Completion date for ${esc(step.label)}" value="${esc(step.doneDate || "")}"></label>
      <input type="text" data-gj-note="${index}" aria-label="Notes for ${esc(step.label)}" value="${esc(step.notes || "")}" placeholder="Task notes">
    </div>`).join("");
  openModal(`
    <h2>${editing ? "Edit " + esc(job.label) : "Add garment jobs"}</h2>
    ${editing ? `<div class="field"><label for="gjLabel">Garment name</label><input id="gjLabel" value="${esc(job.label)}"></div>` : `
      <div class="grid2">
        <div class="field"><label for="gjType">Garment or bundle</label><select id="gjType">
          ${Object.entries(GARMENT_JOB_BUNDLES).map(([id, value]) => `<option value="${id}">${esc(value.label)}</option>`).join("")}
          ${Object.entries(GARMENT_JOB_TYPES).map(([id, value]) => `<option value="${id}">${esc(value.label)}</option>`).join("")}
        </select></div>
        <div class="field"><label for="gjQty">Quantity</label><input id="gjQty" type="number" min="1" max="100" step="1" value="1"></div>
      </div><p id="gjPreview" role="status"></p>
      ${DB.orders[workspace.orderId].garmentJobs?.length ? '<div class="field"><label for="gjAddReason">Reason for adding garments</label><input id="gjAddReason" placeholder="e.g. Client requested an extra shirt"></div>' : ""}`}
    <div class="grid3">${garmentAssignmentFields(job)}</div>
    ${editing ? `
      <div class="field"><label for="gjStage">Current garment stage</label><select id="gjStage">
        ${ORDER_STAGES.map(stage => `<option ${stage === job.status ? "selected" : ""}>${esc(stage)}</option>`).join("")}
      </select></div>
      <div class="field"><label for="gjNotes">Garment instructions</label><textarea id="gjNotes">${esc(job.notes || "")}</textarea></div>
      <h3>Fittings</h3>
      <button type="button" class="btn" id="gjAddTrial">＋ Add trial / fitting</button>
      <div class="garment-tasks" id="gjFittings">${taskFields(true)}</div>
      <details class="garment-task-group"><summary>Workshop tasks</summary>
        <div class="garment-tasks" id="gjTasks">${taskFields(false)}</div>
      </details>` : "<p>Confirm the components, then save the garment list to start tracking them.</p>"}
    <p id="gjError" role="alert"></p>
    <div class="actions"><button class="btn" id="gjCancel">Cancel</button><button class="btn primary" id="gjApply">Apply to garment list</button></div>
  `);
  if (!editing) {
    const preview = () => {
      const type = $("#gjType").value;
      const components = GARMENT_JOB_BUNDLES[type]?.components || [type];
      $("#gjPreview").textContent = $("#gjQty").value + " × " + components.map(component => GARMENT_JOB_TYPES[component].label).join(" + ");
    };
    $("#gjType").onchange = preview;
    $("#gjQty").oninput = preview;
    preview();
  }
  const readTaskFields = () => draftWorkflow.map((step, index) => {
    const done = $(`[data-gj-done="${index}"]`).checked;
    const date = $(`[data-gj-date="${index}"]`).value;
    const updated = { ...step, done,
      doneDate: done ? (date || (step.done ? step.doneDate : "") || new Date().toISOString().slice(0, 10)) : "",
      notes: $(`[data-gj-note="${index}"]`).value };
    const planned = $(`[data-gj-planned="${index}"]`);
    if (planned && (planned.value || "scheduledDate" in step)) updated.scheduledDate = planned.value;
    return updated;
  });
  if (editing) $("#gjAddTrial").onclick = () => {
    draftWorkflow = appendAdditionalTrial(readTaskFields());
    if (ORDER_STAGES.indexOf($("#gjStage").value) >= ORDER_STAGES.indexOf("1st Trial / Fitting")) {
      $("#gjStage").value = "1st Trial / Fitting";
    }
    $("#gjFittings").innerHTML = taskFields(true);
    $("#gjTasks").innerHTML = taskFields(false);
    const lastTrial = draftWorkflow.findLastIndex(isTrialWorkflowStep);
    $(`[data-gj-planned="${lastTrial}"]`).focus();
  };
  if (addFitting) $("#gjAddTrial").click();
  $("#gjCancel").onclick = closeModal;
  $("#gjApply").onclick = () => {
    try {
      const assignments = readGarmentAssignments(job);
      if (editing) {
        const workflow = readTaskFields();
        const completionChanged = workflow.some(step => step.done !== Boolean(job.workflow.find(old => old.key === step.key)?.done));
        let status = $("#gjStage").value;
        if (completionChanged && status === job.status) status = workflow.find(step => !step.done)?.stage || "Delivered";
        const updated = applyGarmentJobEdit(job, {
          ...assignments, label: $("#gjLabel").value.trim(), notes: $("#gjNotes").value,
          workflow, status
        });
        workspace.jobs = workspace.jobs.map(item => item.id === job.id ? updated : item);
      } else {
        if ($("#gjAddReason")) {
          assignments.additionReason = $("#gjAddReason").value.trim();
          if (!assignments.additionReason) throw new Error("Enter a reason for adding garments to this order.");
        }
        const added = makeGarmentJobs($("#gjType").value, Number($("#gjQty").value), assignments, workspace.jobs);
        workspace.jobs.push(...added);
      }
      closeModal();
      render();
    } catch (error) { $("#gjError").textContent = error.message; }
  };
}

    <p>This changes only this garment. Other suit pieces remain separate.</p>
    <p>Its saved measurements, maker, fabric, trial notes and completed tasks will be retained. Order totals and reserved fabric require a separate review.</p>

function openGarmentWorkshopSheet(jobId) {
  if (garmentWorkspaceDirty()) { toast("Save garment changes before opening a workshop sheet."); return; }
  try {
    const latest = latestStoredDatabase();
    const order = latest.orders[GARMENT_WORKSPACE.orderId];
    if (JSON.stringify(order) !== GARMENT_WORKSPACE.original) {
      throw new Error("This order changed in another tab. Reopen its garment list before printing.");
    }
    GARMENT_PRINT_SHEET = buildGarmentWorkshopSheet(latest, order.id, jobId);
    go("garmentPrint");
    $("#workshopPrintNow").focus({preventScroll:true});
    window.scrollTo(0,0);
  } catch (error) { toast(error.message); }
}

function vGarmentWorkshopSheet() {
  const sheet = GARMENT_PRINT_SHEET;
  const value = raw => raw == null || raw === "" ? "—" : esc(raw);
  const measurement = raw => raw == null || raw === "" ? "—" : esc(raw) + " " + esc(sheet.unit);
  const rows = (items,numeric = false) => items.map(item => `<tr><td>${esc(item.label)}</td><td class="workshop-value">${numeric || item.numeric ? measurement(item.value) : value(item.value)}</td></tr>`).join("");
  const note = (label,text) => text ? `<h3>${esc(label)}</h3><p class="workshop-note">${esc(text)}</p>` : "";
  // Keep long notes in short rows so they can break cleanly between pages.
  const chunks = text => String(text).split(/\r?\n/).flatMap(line => {
    const result = [];
    let current = "";
    for (const word of line.match(/\S+\s*|\s+/g) || [""]) {
      if (current && current.length + word.length > 600) { result.push(current); current = ""; }
      current += word;
    }
    result.push(current);
    return result;
  });
  const noteRows = (label,text) => text ? `<tr><td colspan="4"><h3>${esc(label)}</h3></td></tr>` + chunks(text)
    .map(line => `<tr><td colspan="4"><p class="workshop-lines">${esc(line) || "&nbsp;"}</p></td></tr>`).join("") : "";
  return `
    <style id="garmentPageStyle"></style>
    <div class="workshop-actions no-print">
      <button class="btn" id="workshopBack">← Garment jobs</button>
      <button class="btn primary" id="workshopPrintNow">Print workshop sheet</button>
      <span>Saved garment details · ${esc(sheet.unit === "cm" ? "Centimetres" : sheet.unit === "in" ? "Inches" : sheet.unit)}</span>
    </div>
    <article id="garmentPrintSheet" class="workshop-paper" aria-label="Garment workshop sheet">
      <p id="workshopPrintWarning" role="alert" hidden style="border:3px solid #9a2525;padding:10px;font-weight:bold;"></p>
      <table class="workshop-document">
        <colgroup><col style="width:20%"><col style="width:16%"><col style="width:16%"><col style="width:48%"></colgroup>
        <thead><tr><td colspan="4"><div class="workshop-running-header">
          <b>MODISTO BESPOKE · WORKSHOP SHEET${DEMO_MODE ? " · DEMO SAMPLE" : ""}</b>
          <span>${esc(sheet.clientName)} · Order ${esc(sheet.orderNo)} · Job ${esc(sheet.jobId)}</span>
        </div></td></tr></thead>
        <tbody><tr><td colspan="4"><header class="workshop-header">
          ${DEMO_MODE ? "<p><b>DEMO - SAMPLE WORKSHOP SHEET</b></p>" : ""}
          <h2>${esc(sheet.jobLabel)} · ${esc(sheet.garmentType)}</h2>
          <p><b>Client:</b> ${esc(sheet.clientName)} · ${esc(sheet.clientId)}</p>
          <div class="workshop-meta">
            <div><b>Maker:</b> ${value(sheet.maker)}</div><div><b>Stage:</b> ${value(sheet.stage)}</div>
            <div><b>Fabric swatch:</b> ${value(sheet.swatchCode)}${sheet.swatchDescription ? " · " + esc(sheet.swatchDescription) : ""}</div>
            <div><b>Promised delivery:</b> ${fmtDate(sheet.delivery)}</div>
            <div><b>Order first trial:</b> ${fmtDate(sheet.orderTrialDate)}</div>
            <div><b>Measurement unit:</b> ${sheet.unit === "in" ? "Inches (in)" : sheet.unit === "cm" ? "Centimetres (cm)" : esc(sheet.unit)}</div>
          </div>
          <div class="workshop-copy-ref">Measurement copy ${esc(sheet.versionId)} · Docket ${esc(sheet.sourceDocket)}<br>
            Measured ${fmtDate(sheet.measuredDate)} by ${value(sheet.measuredBy)} · Copied ${value(sheet.copiedAt)}</div>
        </header></td></tr>
          <tr><td colspan="4"><div class="workshop-columns">
            <div>${sheet.sections.map(section => `<h3>${esc(section.title)}</h3><table class="workshop-table"><tbody>${rows(section.rows,true)}</tbody></table>`).join("")}</div>
            <div><h3>Posture &amp; garment options</h3>
              ${sheet.options.length ? `<table class="workshop-table"><tbody>${rows(sheet.options)}</tbody></table>` : "<p>No garment options recorded.</p>"}
              ${sheet.instructions.map(item => note(item.label, item.numeric ? (item.value + " " + sheet.unit) : String(item.value))).join("")}
            </div>
          </div></td></tr>
          ${noteRows("Garment instructions",sheet.jobNotes)}${noteRows("Saved docket instructions",sheet.docketNotes)}
          ${sheet.otherNotes.length ? `<tr><td colspan="4"><h3>Other saved docket references - review applicability</h3></td></tr>` + sheet.otherNotes.map(item => noteRows(item.label,item.numeric ? item.value + " " + sheet.unit : String(item.value))).join("") : ""}
          ${sheet.trials.length ? `<tr><td colspan="4"><h3>Trials &amp; fitting notes</h3></td></tr>
            <tr class="workshop-trial-head"><th>Trial</th><th>Scheduled</th><th>Completed</th><th>Fitting / alteration notes</th></tr>
            ${sheet.trials.map(trial => chunks(trial.notes).map((text,index) => `<tr class="workshop-trial-row"><td>${esc(trial.label)}${index ? " (continued)" : ""}</td><td>${fmtDate(trial.scheduledDate)}</td>
              <td>${trial.done ? (trial.doneDate ? fmtDate(trial.doneDate) : "Done - date unrecorded") : "Pending" + (trial.doneDate ? " (date recorded: " + fmtDate(trial.doneDate) + ")" : "")}</td>
              <td class="workshop-note">${value(text)}</td></tr>`).join("")).join("")}` : ""}
          ${sheet.taskNotes.map(item => noteRows(item.label,item.value)).join("")}
          <tr><td colspan="4"><div class="workshop-signoff">Cutter checked: ____________________ &nbsp; Date: ________________<br>
            <small>Use this garment's saved measurement copy. Blank measurements are unrecorded; zero values are shown explicitly.</small></div></td></tr>
        </tbody>
      </table>
    </article>`;
}

function mountGarmentWorkshopSheet() {
  const sheet = GARMENT_PRINT_SHEET;
  const heading = (DEMO_MODE ? "DEMO · " : "") + "MODISTO · " + sheet.clientName + " · Order " + sheet.orderNo + " · Job " + sheet.jobId;
  $("#garmentPageStyle").textContent = '@media print { @page garment-sheet { @top-left { content: ' + JSON.stringify(heading) + '; font: 8px Arial, sans-serif; color: #17202b; } @bottom-right { content: counter(page); font: 8px Arial, sans-serif; } } }';
  const validate = () => {
    try {
      const current = buildGarmentWorkshopSheet(latestStoredDatabase(),sheet.orderId,sheet.jobId);
      if (JSON.stringify(current) !== JSON.stringify(sheet)) throw new Error("This garment sheet changed. Reopen its preview before printing.");
      $("#workshopPrintWarning").hidden = true;
      return true;
    } catch (error) {
      $("#workshopPrintWarning").textContent = "DO NOT PRODUCE — " + error.message;
      $("#workshopPrintWarning").hidden = false;
      toast(error.message);
      return false;
    }
  };
  window.onbeforeprint = validate;
  $("#workshopPrintNow").onclick = () => { if (validate()) window.print(); };
  $("#workshopBack").onclick = () => {
    const sheet = GARMENT_PRINT_SHEET;
    openGarmentWorkspace(sheet.orderId);
    $(`[data-job-print="${sheet.jobId}"]`)?.focus();
  };
}

function mountGarmentJobs() {
  $("#gjAdd").onclick = () => garmentJobModal();
  $$("#main [data-job-edit]").forEach(button => button.onclick = () => garmentJobModal(button.dataset.jobEdit));
  $$("#main [data-job-copy]").forEach(button => button.onclick = () => showGarmentMeasurement(button.dataset.jobCopy));
  $$("#main [data-job-print]").forEach(button => button.onclick = () => openGarmentWorkshopSheet(button.dataset.jobPrint));
  $$("#main [data-job-cancel]").forEach(button => button.onclick = () => garmentCancellationModal(button.dataset.jobCancel));
  if ($("#gjReview")) $("#gjReview").onclick = () => {
    if (garmentWorkspaceDirty()) { toast("Save garment changes before reviewing order totals."); return; }
    ACTIONS.editOrder(GARMENT_WORKSPACE.orderId);
  };
  $$("#main [data-job-remove]").forEach(button => button.onclick = () => {

function refreshTrackedResults() {
  const calendar = trackingCalendar();
  const {view, query, stage, branch, group, limit} = ORDER_LIST;
  let items = trackedOrders(calendar, branch).filter(item =>
    (!stage || item.order.status === stage) && (!group || item.stageGroup === group) &&
    orderSearchText(item.order, item.client).includes(query.trim().toLowerCase()));
  switch (view) {
    case "active": items = items.filter(item => item.active); break;
    case "attention": items = items.filter(item => item.reasons.length).sort(trackingAttentionSort); break;
    case "ready": items = items.filter(item => item.collection); break;
    case "overdue": items = items.filter(item => item.overdue).sort(trackingAttentionSort); break;
  }
  if (view === "active" || view === "ready") {
    items.sort((a, b) => (a.delivery || "9999").localeCompare(b.delivery || "9999"));
  } else if (view === "all") {
    items.sort((a, b) => (b.order.date || "").localeCompare(a.order.date || ""));
  }
  const eventView = view === "fittings" || view === "agenda";
  const records = eventView ? trackingEvents(items, event => event.date >= calendar.today &&
    (view === "agenda" || (event.date <= calendar.through && event.key !== "delivery"))) : items;
  $("#orderResultCount").textContent = records.length + (eventView ? " events" : " orders");
  const shown = records.slice(0, limit);
  $("#orderRows").innerHTML = !shown.length ? '<p class="empty">No matches. Try another view or clear your filters.</p>' :
    (eventView ? trackingEventList(shown) : orderRows(shown, calendar.today)) +
    (records.length > limit ? '<button type="button" class="btn tracking-load" id="orderLoadMore">Load more</button>' : "");
}

function workshopAssignments(employees, orders) {
  const unassigned = {id: "", name: "Needs assignment", jobs: [], legacy: []};
  const roster = employees.map(employee => ({...employee, jobs: [], legacy: []}));
  const folded = value => (value || "").toLowerCase();
  for (const order of orders) {
    if (["Delivered", "Cancelled"].includes(order.status)) continue;
    if (order.garmentJobs?.length) {
      for (const job of order.garmentJobs) {
        if (job.cancellation || job.status === "Delivered") continue;
        const matches = roster.filter(employee => employee.name === job.maker);
        for (const entry of matches.length ? matches : [unassigned]) entry.jobs.push({order, job});
      }
    } else {
      const names = [order.assignedTo, order.karigarAssigned, ...(order.workflow || []).filter(step => !step.done).map(step => step.assignedTo)];
      const matches = roster.filter(employee => names.some(name => name && folded(name) === folded(employee.name)));
      for (const entry of matches.length ? matches : [unassigned]) entry.legacy.push(order);
    }
  }
  return [unassigned, ...roster];
}

function workshopQueueRow(order, job, calendar) {

  const {next, upcoming} = garmentTimeline((job || order).workflow, calendar.today);

    item.delivery ? (item.overdue ? "Delivery overdue · " : "Delivery · ") + fmtDate(item.delivery) : ""

    ${job ? `<button class="tracking-link" data-workshop-job="${esc(job.id)}" data-workshop-order="${esc(order.id)}">${esc(title)}</button>`

}

function fabricStockRecorded(swatch) {
  const raw = swatch.stockMeters;
  return raw != null && String(raw).trim() !== "" && Number.isFinite(Number(raw)) && Number(raw) >= 0;
}

function fabricNeedsReview(swatch, stock) {
  return !fabricStockRecorded(swatch) || Boolean(stock?.needsReorder);
}

function swatchRows({query, category, review, limit}) {
  const q = query.trim().toLowerCase();
  const swatches = Object.values(DB.swatches).filter(swatch =>
    (!category || swatch.category === category) && (!q ||
      [swatch.code, swatch.book, swatch.colorName, swatch.composition, swatch.mill, swatch.vendorName, swatch.notes]
        .join(" ").toLowerCase().includes(q)))
    .sort((a, b) => a.code.localeCompare(b.code))
    .map(swatch => ({swatch, stock: getSwatchAllocationStatus(swatch.code)}))
    .filter(({swatch, stock}) => !review || fabricNeedsReview(swatch, stock));
  return directoryResults(swatches, limit, "swatch", "swatches", ({swatch: s, stock}) => {
    const recorded = fabricStockRecorded(s);
    const status = !recorded ? "Stock unrecorded" : stock?.isShort ? `${stock.shortage} m short` :
      stock?.belowMin ? "Below minimum" : `${stock?.surplus ?? s.stockMeters} m available`;
    const color = /^#(?:[\da-f]{3}|[\da-f]{6})$/i.test(s.colorHex || "") ? s.colorHex : "#8e8578";
    return `<article class="card tracking-panel directory-card">
      <div class="tracking-panel-heading"><h2><span class="fabric-sample" style="background:${color}" aria-hidden="true"></span> ${esc(s.code)}</h2>
        <span class="badge ${!recorded || stock?.needsReorder ? "s-Cutting" : "s-Ready"}">${esc(status)}</span></div>
      <p>${esc(s.colorName || "Shade unrecorded")}${s.category ? " · " + esc(s.category) : ""}</p>
      <details><summary>Swatch details</summary>
        ${directoryFacts([["Book", s.book], ["Mill", s.mill], ["Composition", s.composition], ["Supplier", s.vendorName],
          ["Contact", s.vendorContact], ["Cost per metre", s.costPerMeter == null || String(s.costPerMeter).trim() === "" ? "" : fmtINR(s.costPerMeter)],
          ["Recorded stock", recorded ? s.stockMeters + " m" : "Unrecorded"], ["Minimum stock", s.minStockMeters == null || s.minStockMeters === "" ? "" : s.minStockMeters + " m"],
          ["Allocation calculation", stock ? stock.requiredMeters + " m required" : ""], ["Referenced orders", stock?.openOrderNos.filter(Boolean).join(", ")],
          ["Notes", s.notes]])}
        <button class="btn" data-act="editSwatch" data-id="${esc(s.id)}">Edit swatch</button>
      </details>
    </article>`;
  });
}

/* ============================================================================

   ============================================================================ */
function vCosting() {
  const orders = Object.values(DB.orders);
  let totRev = 0, totFabric = 0, totTrims = 0, totLabour = 0, totShip = 0, totCost = 0, totProfit = 0, totHours = 0;

  orders.forEach(o => {
    const ec = calcOrderEconomics(o);
    totRev += ec.quoted;
    totFabric += ec.fabricTotal;
    totTrims += ec.trims;
    totLabour += (ec.cutter + ec.karigar);
    totShip += ec.shipping;
    totCost += ec.totalCost;
    totProfit += ec.profit;
    totHours += ec.hours;
  });

  const overallMargin = totRev > 0 ? ((totProfit / totRev) * 100).toFixed(1) : "0.0";
  const avgProfitPerHr = totHours > 0 ? Math.round(totProfit / totHours) : 0;

  return `
  <div class="pagehead">
    <div>
      <h1>Costing &amp; reports</h1>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:-2px;">
        Estimates use recorded quotes and entered costs. Missing cost inputs contribute zero to these totals.
      </div>
    </div>
    <button class="btn primary" data-act="newOrderPick">＋ Log New Order Costing</button>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="num">${fmtINR(totRev)}</div>
      <div class="lbl">Total quoted value</div>
      <div class="sub">Across ${orders.length} bespoke orders</div>
    </div>
    <div class="stat">
      <div class="num">${fmtINR(totFabric + totTrims)}</div>
      <div class="lbl">Material &amp; Trims Cost</div>
      <div class="sub">Fabric: ${fmtINR(totFabric)} · Trims: ${fmtINR(totTrims)}</div>
    </div>
    <div class="stat">
      <div class="num">${fmtINR(totLabour)}</div>
      <div class="lbl">Cutter &amp; Karigar Labour</div>
      <div class="sub">${totHours} total bespoke craft hours</div>
    </div>
    <div class="stat green">
      <div class="num">${fmtINR(totProfit)}</div>
      <div class="lbl">Estimated order contribution</div>
      <div class="sub">${overallMargin}% Gross Margin</div>
    </div>
    <div class="stat gold">
      <div class="num">${fmtINR(avgProfitPerHr)}/hr</div>
      <div class="lbl">Contribution per recorded hour</div>
      <div class="sub">Measures time-vs-return efficiency</div>
    </div>

let modalOpener = null;
function openModal(html) {
  SHARED_FORM_DIRTY = false;
  const modal = $("#modal");
  if (!$("#overlay").classList.contains("on")) modalOpener = document.activeElement;
  modal.innerHTML = html;
  const title = modal.querySelector("h2");
  if (title) {
    title.id ||= "modalTitle";
    modal.setAttribute("aria-labelledby", title.id);
  } else modal.removeAttribute("aria-labelledby");
  $("#overlay").classList.add("on");
  modal.focus();
}
function closeModal() {
  SHARED_FORM_DIRTY = false;
  $("#overlay").classList.remove("on");
  modalOpener?.focus({preventScroll: true});
  modalOpener = null;
}
$("#overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") closeModal();
});
$("#modal").addEventListener("keydown", event => {
  if (event.defaultPrevented) return;
  if (event.key === "Escape") {
    event.preventDefault();
    closeModal();
  }
  if (event.key !== "Tab") return;
  const controls = $$("#modal :is(button, input, textarea, select, a[href], summary, [tabindex])")
    .filter(control => !control.disabled && control.tabIndex >= 0 && control.getClientRects().length);
  const first = controls[0];
  const last = controls.at(-1);
  const active = document.activeElement;
  if (!controls.includes(active) || (event.shiftKey ? active === first : active === last)) {
    event.preventDefault();
    (event.shiftKey ? last : first)?.focus();
  }
});
