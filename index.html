<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modisto Bespoke — Atelier CRM, Measurement Docket & Costing Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --navy: #131b29;
  --navy-2: #1c2739;
  --navy-3: #25334a;
  --gold: #8b6f3e;
  --gold-strong: #755c2f;
  --gold-soft: #c9b083;
  --gold-tint: #f8f3e8;
  --cream: #f3ecdd;
  --bg: #f6f4ef;
  --card: #ffffff;
  --line: #e7e2d7;
  --line-2: #d8d2c4;
  --ink: #26221c;
  --ink-soft: #6d675c;
  --green: #2e6b46;
  --green-bg: #e9f4ec;
  --amber: #8a6116;
  --amber-bg: #fdf3e2;
  --danger: #9b3b2e;
  --danger-bg: #fbeae8;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(20,25,40,.05), 0 10px 28px -20px rgba(20,25,40,.25);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13.5px;
  line-height: 1.48;
  -webkit-font-smoothing: antialiased;
}
.serif { font-family: 'Cormorant Garamond', Georgia, serif; }

/* Layout */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.side {
  width: 218px;
  background: var(--navy);
  color: #c6ccd8;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 20px 12px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid rgba(201,176,131,.15);
  z-index: 30;
}
.side .logo {
  text-align: center;
  padding-bottom: 18px;
  margin-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.side .crest {
  width: 38px;
  height: 38px;
  margin: 0 auto 6px;
  border-radius: 9px;
  border: 1.5px solid var(--gold-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-soft);
  background: rgba(139,111,62,.14);
}
.side .logo .name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  letter-spacing: 4px;
  color: #fff;
  font-weight: 600;
  line-height: 1.1;
}
.side .logo .tag {
  font-size: 8.5px;
  letter-spacing: 2.5px;
  color: var(--gold-soft);
  text-transform: uppercase;
  margin-top: 4px;
}
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: #c6ccd8;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
}
.nav button:hover { background: var(--navy-2); color: #fff; }
.nav button.on {
  background: var(--gold);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(139,111,62,.35);
}
.nav .ic { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nav .cnt {
  margin-left: auto;
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 99px;
  background: rgba(255,255,255,.1);
  color: #e2e6ee;
}
.nav button.on .cnt { background: rgba(0,0,0,.22); color: #fff; }

.tailor-box {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,.08);
}
.tailor-card {
  background: var(--navy-2);
  border: 1px solid rgba(201,176,131,.22);
  border-radius: 9px;
  padding: 10px;
}
.tailor-card select {
  width: 100%;
  background: transparent;
  color: #fff;
  border: 0;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 2px 0;
}
.tailor-card select option { background: var(--navy); color: #fff; }
.tailor-card select:focus { outline: none; }

/* Main Content */
.main {
  flex: 1;
  min-width: 0;
  padding: 20px 26px 120px;
  max-width: 1360px;
  margin: 0 auto;
}
.pagehead {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.pagehead h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--navy);
  margin-right: auto;
  letter-spacing: .2px;
}
.crumb {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.crumb:hover { color: var(--gold); }

/* Buttons */
.btn {
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  border: 1px solid var(--line-2);
  background: #fff;
  color: var(--ink);
  transition: all .14s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn:hover { border-color: var(--gold); background: #fdfbf7; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #fff; }
.btn.primary:hover { background: var(--gold-strong); border-color: var(--gold-strong); }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.navy:hover { background: var(--navy-2); }
.btn.soft { background: var(--cream); border-color: var(--gold-soft); color: var(--gold-strong); }
.btn.soft:hover { background: #eadec8; }
.btn.danger { color: var(--danger); border-color: #e6c3be; }
.btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.xs { padding: 3px 8px; font-size: 11px; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.card-title .spacer { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--ink-soft); }

/* Dashboard KPIs */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.stat .num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px;
  font-weight: 700;
  line-height: 1.05;
  color: var(--navy);
}
.stat .lbl {
  font-size: 11px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 5px;
  font-weight: 600;
}
.stat .sub {
  font-size: 11.5px;
  color: var(--ink-soft);
  margin-top: 4px;
}
.stat.gold .num { color: var(--gold); }
.stat.green .num { color: var(--green); }

/* Tables */
.searchrow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.searchrow input, .searchrow select {
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  background: #fff;
}
.searchrow input { flex: 1; min-width: 220px; }
.searchrow input:focus, .searchrow select:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(139,111,62,.12);
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  font-size: 10.5px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: left;
  padding: 9px 10px;
  border-bottom: 1.5px solid var(--line-2);
  font-weight: 700;
  white-space: nowrap;
}
td {
  padding: 11px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  vertical-align: middle;
}
tr.rowlink { cursor: pointer; transition: background .12s; }
tr.rowlink:hover { background: #faf7f0; }

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--cream);
  color: var(--gold-strong);
  border: 1px solid var(--gold-soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
  font-size: 15px;
  margin-right: 10px;
  flex-shrink: 0;
}
.cname { display: flex; align-items: center; font-weight: 600; color: var(--navy); }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  padding: 3px 9px;
  border-radius: 100px;
  background: var(--cream);
  color: var(--gold-strong);
  border: 1px solid var(--gold-soft);
  white-space: nowrap;
}
.badge.s-New, .badge.s-Fabric { background: #eef2f7; color: #3b556e; border-color: #c3d2e0; }
.badge.s-Cutting, .badge.s-Stitching { background: var(--amber-bg); color: var(--amber); border-color: #e7cf9a; }
.badge.s-Fitting, .badge.s-Finishing { background: #f2ecfa; color: #5e4a8a; border-color: #d4c6ec; }
.badge.s-Ready { background: var(--green-bg); color: var(--green); border-color: #bcdcc7; }
.badge.s-Delivered { background: #efefec; color: #6d675c; border-color: #d8d2c4; }

.swatch-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 6px;
  background: #f8f5ee;
  border: 1px solid var(--line-2);
  color: var(--navy);
}
.swatch-dot {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  border: 1px solid rgba(0,0,0,.2);
  flex-shrink: 0;
}

/* Grids & Forms */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: start; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }
@media(max-width: 980px) { .duo, .trio, .quad { grid-template-columns: 1fr; } }
@media(max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label {
  font-size: 10.5px;
  letter-spacing: .9px;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 700;
}
.field input, .field select, .field textarea {
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  padding: 8px 11px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background: #fff;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(139,111,62,.12);
}
.field textarea { resize: vertical; min-height: 64px; }
.req::after { content: " *"; color: var(--danger); }

/* Measurement Header Bar */
.clientbar {
  display: flex;
  align-items: center;
  gap: 0;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--ink-soft);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.clientbar .cell {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-right: 1px solid var(--line);
}
.clientbar .cell:first-child { padding-left: 2px; }
.clientbar .cell:last-child { border-right: 0; }
.clientbar b { color: var(--ink); }
.clientbar input, .clientbar select {
  border: 0;
  border-bottom: 1px dashed var(--line-2);
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  padding: 2px 4px;
}
.clientbar input:focus, .clientbar select:focus {
  outline: none;
  border-bottom-color: var(--gold);
  background: var(--gold-tint);
}

/* Quarter-inch helper bar */
.fraction-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  background: var(--navy);
  color: #e5e7eb;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  font-size: 12px;
}
.fraction-bar .fbtn {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(201,176,131,.35);
  color: #fff;
  font-weight: 600;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 5px;
  cursor: pointer;
  transition: all .12s;
}
.fraction-bar .fbtn:hover { background: var(--gold); border-color: var(--gold); }

/* Tabs */
.tabs {
  display: flex;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow-x: auto;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.tab {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 12px 18px;
  border: 0;
  background: transparent;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: all .15s;
}
.tab:hover { color: var(--ink); }
.tab.on {
  color: var(--ink);
  border-bottom-color: var(--gold);
  background: linear-gradient(#fff, #faf7f0);
}
.panel { display: none; }
.panel.on { display: block; }

/* Measurement rows */
.mrow {
  display: grid;
  grid-template-columns: 1fr 112px 24px;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  border-bottom: 1px dashed rgba(216,210,196,.45);
}
.mrow:last-child { border-bottom: 0; }
.mrow .lbl { font-size: 13px; color: var(--ink); font-weight: 500; }
.mrow .lbl small { color: var(--ink-soft); font-weight: 400; font-size: 11px; }
.mrow input {
  font-size: 13.5px;
  font-weight: 600;
  text-align: center;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 6px 8px;
  width: 100%;
  background: #fff;
  color: var(--navy);
}
.mrow input:focus {
  outline: none;
  border-color: var(--gold);
  background: #fffdf9;
  box-shadow: 0 0 0 3px rgba(139,111,62,.15);
}
.mrow .unit { font-size: 11.5px; color: var(--ink-soft); }

/* Tick mark option rows */
.trow {
  display: grid;
  grid-template-columns: 138px 1fr;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
}
.trow .lbl { font-size: 13px; font-weight: 500; color: var(--ink); }
.trow input[type=text], .trow input[type=number] {
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 12.5px;
  width: 100%;
  font-family: 'Inter', sans-serif;
}
.trow input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(139,111,62,.12); }

.seg {
  display: flex;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  overflow: hidden;
  background: #fff;
}
.seg button {
  flex: 1;
  border: 0;
  background: #fff;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 600;
  padding: 7px 6px;
  cursor: pointer;
  border-right: 1px solid var(--line-2);
  transition: all .12s;
  white-space: nowrap;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: #faf7f2; }
.seg button.on {
  background: var(--cream);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--gold);
  font-weight: 700;
}

/* Conditional Callout Box (Bow Leg / Knock Knees / Collar / Cuff) */
.stance-callout {
  background: #faf6ed;
  border: 1px solid var(--gold-soft);
  border-left: 3.5px solid var(--gold);
  border-radius: 7px;
  padding: 10px 12px;
  margin: 6px 0 10px;
  transition: all .2s;
}
.stance-callout.active-highlight {
  background: #fdf5e6;
  border-color: var(--gold);
  box-shadow: 0 2px 10px rgba(139,111,62,.14);
}
.stance-callout .sc-head {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--gold-strong);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Suit Style Matrix Table (matching screenshot) */
.suit-matrix {
  width: 100%;
  border-collapse: collapse;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  overflow: hidden;
  font-size: 12px;
}
.suit-matrix th {
  background: #faf7f0;
  color: var(--ink);
  font-size: 11px;
  text-transform: none;
  letter-spacing: .2px;
  font-weight: 600;
  padding: 8px 8px;
  border: 1px solid var(--line);
  text-align: center;
}
.suit-matrix td {
  border: 1px solid var(--line);
  padding: 6px 6px;
  text-align: center;
}
.suit-matrix .m-opt {
  display: block;
  width: 100%;
  padding: 6px 6px;
  border-radius: 5px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
}
.suit-matrix .m-opt:hover { background: #faf6ed; }
.suit-matrix .m-opt.on {
  background: var(--cream);
  border-color: var(--gold);
  font-weight: 700;
  color: var(--navy);
}

/* Summary Docket */
.sum-block { margin-bottom: 16px; }
.sum-block h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  font-weight: 700;
  color: var(--navy);
  border-bottom: 1.5px solid var(--navy);
  padding-bottom: 4px;
  margin-bottom: 8px;
}
.sum-rows {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 3px 24px;
}
.sum-rows .sr {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px dotted var(--line-2);
  padding: 5px 0;
  font-size: 12.5px;
}
.sum-rows .sr b { font-weight: 600; color: var(--navy); text-align: right; }

/* Modal & Toast */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(19,27,41,.52);
  backdrop-filter: blur(2px);
  z-index: 60;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 16px;
  overflow: auto;
}
.overlay.on { display: flex; }
.modal {
  background: var(--card);
  border-radius: var(--radius);
  max-width: 780px;
  width: 100%;
  padding: 24px;
  box-shadow: 0 24px 70px -20px rgba(19,27,41,.55);
  border: 1px solid var(--line);
}
.modal h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 25px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 14px;
}
.modal .actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.actionbar {
  position: fixed;
  left: 218px;
  right: 0;
  bottom: 0;
  z-index: 40;
  background: rgba(246,244,239,.95);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line-2);
  padding: 10px 26px;
  display: none;
}
.actionbar.on { display: block; }
.actionbar .inner {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  max-width: 1360px;
  margin: 0 auto;
}
.status { font-size: 12px; color: var(--ink-soft); margin-right: auto; }

.toast {

  color: #fff;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 20px;
  border-radius: 100px;
  border: 1px solid var(--gold-soft);

  pointer-events: none;
  transition: all .25s;

}

/* ================= VISUAL ANATOMICAL MEASUREMENT GUIDE (FREEM STYLE) ================= */

@media(max-width: 720px) { .vguide-grid { grid-template-columns: repeat(2, 1fr); } }
@media(max-width: 480px) { .vguide-grid { grid-template-columns: 1fr; } }

/* ================= CONDENSED A4 DOCKET PREVIEW & PRINT ENGINE ================= */
.docket-sheet-wrapper {

}
.docket-page {

.docket-brand-title {

.docket-brand-tag {

}
.docket-client-box .dcb-lbl {

  color: #6d675c;

}
.docket-client-box .dcb-val {

  font-weight: 700;
  color: #131b29;

}

}

.docket-4col {

}
.docket-col-head {

}

}
.docket-tbl td {

  border-bottom: 1px solid #e5e7eb;

}

.docket-tbl td.dk { color: #374151; font-weight: 500; }
.docket-tbl td.dv {

}
.docket-subhead {
  background: #f3ecdd;

  font-weight: 800;

}
.docket-footer-bar {

  padding-top: 6px;

}

.shortage-banner {
  background: var(--danger-bg);
  border: 1.5px solid var(--danger);

  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

  background: var(--green-bg);
  border: 1.5px solid #86efac;
  color: var(--green);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}

/* Multi-Garment Enquiry Picker Tags */
.garment-picker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
  gap: 8px;
  margin-top: 8px;
}
.gp-card {
  border: 1.5px solid var(--line-2);
  border-radius: 8px;
  background: #fff;
  padding: 8px 10px;

  transition: all .14s;
  display: flex;
  flex-direction: column;
  gap: 3px;
  position: relative;
  text-align: left;
}
.gp-card:hover {
  border-color: var(--gold);
  background: #fdfbf7;
}
.gp-card.sel {
  border-color: var(--gold);
  background: var(--cream);
  box-shadow: inset 0 0 0 1px var(--gold);
}
.gp-card .gp-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  color: var(--navy);
}
.gp-card .gp-sub {
  font-size: 10.5px;
  color: var(--ink-soft);
}

/* Sequence of Events Stepper */
.seq-step-row {
  display: grid;
  grid-template-columns: 28px 1.3fr 1.1fr 135px 95px 1fr;
  gap: 8px;
  align-items: center;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 12.5px;
  background: #fff;
}

  background: #f4fbf6;
}
@media(max-width: 820px) {
  .seq-step-row {
    grid-template-columns: 1fr;
    gap: 4px;
  }
}

@media(max-width: 920px) {
  .docket-banner { grid-template-columns: 1fr; }
  .docket-client-box { grid-template-columns: repeat(2, 1fr); }
  .docket-4col { grid-template-columns: 1fr 1fr; }
}

@media(max-width: 820px) {
  .side {
    width: 100%;
    height: auto;
    position: static;
    flex-direction: row;
    align-items: center;
    padding: 10px 12px;
    gap: 8px;
    overflow-x: auto;
  }
  .side .logo { margin: 0 8px 0 0; padding: 0; border: 0; display: flex; align-items: center; gap: 8px; }
  .side .crest { width: 28px; height: 28px; margin: 0; }
  .side .logo .name { font-size: 17px; letter-spacing: 2px; }
  .side .logo .tag, .tailor-box, .nav .cnt { display: none; }
  .nav { flex-direction: row; }
  .nav button { padding: 7px 10px; font-size: 12px; white-space: nowrap; }
  .app { flex-direction: column; }
  .main { padding: 14px 14px 130px; }
  .actionbar { left: 0; }
  .trow { grid-template-columns: 1fr; gap: 4px; }
}

@media print {
  @page {
    size: A4 portrait;
    margin: 6mm;
  }
  html, body {
    background: #ffffff !important;
    color: #000000 !important;
    font-size: 10px !important;
    margin: 0 !important;
    padding: 0 !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  .side, .pagehead, .clientbar, .fraction-bar, .tabs, .actionbar, .toast, .overlay, .no-print,
  #panel-lower, #panel-shirt, #panel-upper, #panel-wbs, #panel-vguide, #InteractiveNotesRow {
    display: none !important;
  }
  .app, .main, #printArea {
    display: block !important;
    padding: 0 !important;
    margin: 0 !important;
    max-width: 100% !important;
    width: 100% !important;
  }
  #panel-summary {
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  .docket-sheet-wrapper {
    gap: 0 !important;
  }
  .docket-page {
    border: 1.5px solid #131b29 !important;
    box-shadow: none !important;
    padding: 8px 10px !important;
    margin: 0 !important;
    page-break-after: always;
    break-after: page;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .docket-page:last-child {
    page-break-after: auto;
    break-after: auto;
  }
  .docket-banner {
    grid-template-columns: 1.15fr 1.85fr !important;
  }
  .docket-client-box {
    grid-template-columns: repeat(4, 1fr) !important;
  }
  .docket-4col {
    grid-template-columns: repeat(4, 1fr) !important;
    gap: 6px !important;
  }
  .vguide-grid {
    grid-template-columns: repeat(5, 1fr) !important;
    gap: 6px !important;
  }
  .vg-svg {
    height: 92px !important;
  }
  .vg-desc {
    font-size: 8px !important;
    padding: 3px 4px !important;
  }
}
/* Measurement milestone: keep wide content inside its own workspace. */
.main, .card, .duo > *, .trio > * { min-width: 0; }
.main { width: 100%; }
.clientbar .cell { flex-wrap: wrap; max-width: 100%; }
.clientbar input, .clientbar select { max-width: 100%; }
.clientbar .btn { max-width: 100%; white-space: normal; overflow-wrap: anywhere; text-align: left; }
.measurement-sections > .panel.on { margin-bottom: 18px; }
.measurement-view { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.measurement-view select, .picker-search { padding: 8px; border: 1px solid var(--line-2); border-radius: var(--radius); background: white; }
.picker-search { width: 100%; }
.picker-results { display: grid; gap: 6px; margin-top: 10px; max-height: min(320px, 45vh); overflow: auto; }
.picker-choice { display: block; text-align: left; white-space: normal; overflow-wrap: anywhere; }
.picker-choice span { display: block; color: var(--ink-soft); font-size: 12px; }
.garment-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; position: sticky; top: 0; z-index: 25; background: var(--bg); padding: 10px 0; }
.garment-card p { margin: 8px 0; overflow-wrap: anywhere; }

/* Today and order tracking */
.tracking { display: grid; gap: 16px; min-width: 0; overflow-wrap: anywhere; }
.tracking h1, .tracking h2, .tracking p { margin: 0; }
.tracking h1 { font: 700 clamp(29px, 4vw, 38px)/1.1 'Cormorant Garamond', Georgia, serif; color: var(--navy); }
.tracking h2 { font-size: 18px; font-weight: 650; color: var(--navy); }
.tracking-heading, .tracking-panel-heading, .tracking-controls {
  display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap;
}
.tracking-heading p, .tracking-count, .tracking-panel p, .tracking-order small { color: var(--ink-soft); }
.tracking-controls { justify-content: flex-start; }
.tracking-controls label { display: grid; gap: 4px; min-width: 0; font-weight: 600; }
.tracking-controls label.tracking-checkbox { display: flex; align-items: center; gap: 8px; min-height: 44px; align-self: end; cursor: pointer; }
.tracking-controls .tracking-checkbox input { min-height: 0; width: 18px; height: 18px; }
.tracking-controls input, .tracking-controls select {
  min-height: 44px; max-width: 100%; padding: 8px 10px; font: inherit; font-weight: 400;
  border: 1px solid var(--line-2); border-radius: 8px; background: var(--card); color: var(--navy);
}
.tracking-search { flex: 1 1 260px; }
.tracking-more { align-self: end; }
.tracking-more[open] { padding: 0 10px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.tracking summary { min-height: 44px; padding: 12px 2px; cursor: pointer; font-weight: 650; }
.tracking button, .tracking select { min-height: 44px; }
.tracking button { white-space: normal; }
.tracking :focus-visible { outline: 2px solid var(--gold-strong); outline-offset: 3px; }
.tracking-metrics, .tracking-columns { display: grid; gap: 12px; }
.tracking-metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tracking-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tracking-metric {
  display: grid; gap: 2px; padding: 14px 16px; text-align: left; cursor: pointer; color: var(--navy);
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); font: inherit;
}
.tracking-metric strong { font-size: 29px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tracking-metric:hover, .production-bars button:hover { background: var(--cream); border-color: var(--gold); }
.tracking-metric span { font-weight: 650; }
.tracking-panel, .tracking-results { margin: 0; min-width: 0; }
.tracking-panel { display: grid; gap: 8px; align-content: start; }
.tracking-panel > .btn { justify-self: start; }
.tracking-queue, .tracking-orders { padding: 0; margin: 0; list-style: none; }
.tracking-queue li { padding: 4px 0 9px; display: grid; border-top: 1px solid var(--line); }
.tracking-queue li > span { color: var(--ink-soft); }
.tracking-link {
  justify-self: start; border: 0; padding: 0; background: transparent; color: var(--gold-strong);
  font: inherit; font-weight: 700; text-align: left; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.production-bars { display: grid; }
.production-bars button {
  display: grid; grid-template-columns: minmax(75px, 8em) minmax(0, 1fr) 3ch; gap: 12px; align-items: center;
  text-align: left; font: inherit; color: var(--navy); background: none;
  border: 1px solid transparent; border-radius: 6px; padding: 4px 8px; cursor: pointer;
}
.production-track { height: 10px; background: var(--cream); border-radius: 8px; overflow: hidden; }
.production-track > span { display: block; height: 100%; background: var(--gold); }
.tracking-views { display: flex; flex-wrap: wrap; gap: 6px; }
.tracking-views [aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: white; }
.tracking-filters { border-bottom: 1px solid var(--line); }
.tracking-filters .tracking-controls { padding-bottom: 10px; }
.tracking-order, .tracking-order-head {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1.05fr) minmax(0, .75fr);
  align-items: start; gap: 12px;
}
.tracking-order-head { padding: 0 0 10px; color: var(--ink-soft); font-size: 12px; font-weight: 700; }
.tracking-order { padding: 12px 0; border-top: 1px solid var(--line); }
.tracking-order small, .tracking-identity > span { display: block; }
.tracking-identity > span { color: var(--ink-soft); }
.tracking-order .badge { white-space: normal; }
.tracking-order .tracking-exception { margin-top: 4px; }
.tracking .tracking-overdue { color: var(--danger); font-weight: 650; }
.tracking-description { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.tracking-mobile-label { display: none !important; }
.tracking-load { margin-top: 10px; }
.tracking-overview { max-width: 1050px; }
.tracking-jobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 315px), 1fr)); gap: 12px; }
.tracking-job p, .tracking-job ul { margin: 0; }
.tracking-job .tracking-controls { gap: 6px; }
.tracking-job details[open] { display: grid; gap: 8px; }
.tracking-job details[open] > * + * { margin-bottom: 8px; }
.tracking-panel ul { margin: 0; padding-inline-start: 1.3em; }
.tracking-panel > .tracking-queue { padding-inline-start: 0; }
.tracking-workload { display: grid; gap: 4px; }
.tracking-workload button {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
  color: var(--navy); text-align: left; font: inherit; cursor: pointer;
}
.tracking-workload button[aria-pressed="true"] { background: var(--cream); border-color: var(--gold); }
.tracking-workload button > :last-child { text-align: right; }
.tracking-workload small { display: block; color: var(--ink-soft); }
.garment-task-group { margin-top: 10px; }
.garment-task-group summary { min-height: 44px; padding-block: 10px; cursor: pointer; font-weight: 650; }
@media (max-width: 900px) {
  .tracking-order-head { display: none; }
  .tracking-order { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 12px; }
  .tracking-order:first-child { border-top: 0; }
  .tracking-stage { grid-column: 2; grid-row: 1; text-align: right; }
  .tracking-garments { grid-column: 1 / -1; }
  .tracking-mobile-label { display: block !important; }
}
@media (max-width: 620px) {
  .tracking { gap: 12px; }
  .tracking-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tracking-columns { grid-template-columns: minmax(0, 1fr); }
  .tracking-metric, .tracking-panel, .tracking-results { padding: 12px; }
}
.garment-card.is-cancelled { background: #f1f2f3; border-left: 4px solid #68707c; }
.garment-card .btn:disabled, .garment-toolbar .btn:disabled, #btnAutoEstCloth:disabled { opacity: .45; cursor: not-allowed; }
.garment-tasks { display: grid; gap: 10px; margin-top: 14px; }
.garment-task { border: 1px solid var(--line); padding: 10px; border-radius: 7px; }
.garment-task label { display: flex; gap: 8px; align-items: center; }
.garment-task .garment-task-date { display: block; margin-top: 8px; }

.measurement-copy { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }

.workshop-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.workshop-paper { max-width: 900px; margin: 0 auto; background: white; color: #17202b; padding: 24px; border: 1px solid #c7c9cd; font: 13px/1.4 Arial, sans-serif; overflow-wrap: anywhere; }

.workshop-header { border-bottom: 2px solid #17202b; padding-bottom: 10px; margin-bottom: 12px; }
.workshop-running-header { padding: 0 0 6px; font-size: 11px; }
.workshop-running-header span { display: block; font-size: 10px; margin-top: 3px; }
.workshop-header h2 { margin: 2px 0 6px; font: bold 24px/1.2 Arial, sans-serif; }

.workshop-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; margin-top: 8px; }

<script>
/* ============================================================================
   MODISTO BESPOKE — ATELIER CRM, MEASUREMENT DOCKET, TEAM TIMELINE, SWATCHES & COSTING
   ============================================================================ */

const SCHEMA = {

    ],
    ticks: [

      ["Biceps Fit", ["Yes", "No"]],
      ["Cuff", ["Single", "Double", "Cocktail"]],
      ["Collar Type", ["Spread", "Pointed", "Cutway", "Chinese", "Others"]],
      ["Initials", ["Yes", "No"]]
    ]
  },

  /* 3. SUIT / UPPER BODY MEASUREMENTS */
  upper: {
    title: "Suit / Upper Body Measurements",
    measures: [
      "Suit Length Front",
      "Chest (Suit)",
      "Belly (Suit)",
      "Hip (Upper)",
      "Shoulder (Suit)",
      "Full Sleeve Length",
      "Suit Cuff",
      "Neck (Suit)",
      "AC",
      "CB",
      "Arch (Suit)",

      "Natural Waist (Suit)",

      "Right Shoulder Drop (Suit)",
      "Incline (Suit)",
      "Sleeve Inside (Suit)",
      "Arm Hole",
      "4th Measurement",
      "Round Back"
    ],
    ticks: [
      ["Shoulder Down", ["Right Down", "Left Down", "Both", "Regular"]],
      ["Hunchback", ["Yes", "No"]],
      ["Suit Style", ["1 Button", "2 Button", "3 Button", "Double Breasted"]],
      ["Vents", ["Side Vents", "Centre Vent", "No Vents"]],
      ["Lapel", ["Notch", "Peak", "Shawl", "Peak Shawl"]],
      ["Patch Pockets", ["Yes", "No"]],
      ["Slant Pockets", ["Yes", "No"]],
      ["Ticket Pocket", ["Yes", "No"]]
    ]
  },

  /* 4. WAISTCOAT / BANDI / SHERWANI / KURTA */
  waistcoat: {
    title: "Waistcoat Measurements",
    measures: ["Waistcoat Front Length", "Waistcoat Back Length", "Waistcoat Belly"]
  },
  bandi: {
    title: "Bandi Measurements",
    measures: ["Bandi Front Length", "Bandi Back Length"]
  },
  sherwani: {
    title: "Sherwani & Kurta Measurements",
    measures: ["Sherwani Front Length", "Sherwani Back Length", "Kurta Length"]
  }
};

const ORDER_STAGES = [
  "New",
  "Fabric Ordered",
  "Fabric Received",
  "Cutting",
  "Stitching",
  "1st Trial / Fitting",
  "Finishing",
  "Ready",
  "Delivered"
];
const ORDER_FILTER_STAGES = [...ORDER_STAGES, "Cancelled"];

const WORKFLOW_TEMPLATE = [
  { key: "booked", label: "1. Order Booked & Docket Created", stage: "New", defaultDays: 1 },
  { key: "fab_ord", label: "2. Fabric Ordered from Vendor/Mill", stage: "Fabric Ordered", defaultDays: 2 },
  { key: "fab_rec", label: "3. Fabric Received & Inspected", stage: "Fabric Received", defaultDays: 3 },
  { key: "cutting", label: "4. Master Pattern & Cloth Cutting", stage: "Cutting", defaultDays: 2 },
  { key: "stitch_trial", label: "5. Basted Stitching for Trial", stage: "Stitching", defaultDays: 4 },
  { key: "trial_1", label: "6. 1st Trial / Fitting Done", stage: "1st Trial / Fitting", defaultDays: 2 },
  { key: "finishing", label: "7. Final Alterations & Hand Finishing", stage: "Finishing", defaultDays: 3 },
  { key: "ready", label: "8. Quality Check & Pressed Ready", stage: "Ready", defaultDays: 1 },
  { key: "delivered", label: "9. Delivered to Client", stage: "Delivered", defaultDays: 1 }
];

const GARMENT_CATALOG = [
  { id: "suit2", name: "2-Piece Bespoke Suit", icon: "🤵", baseMeters: 3.25, tab: "upper", cat: "Suiting" },
  { id: "suit3", name: "3-Piece Bespoke Suit", icon: "🎩", baseMeters: 4.10, tab: "upper", cat: "Suiting" },
  { id: "blazer", name: "Sports Blazer / Jacket", icon: "🧥", baseMeters: 2.00, tab: "upper", cat: "Suiting" },
  { id: "shirt", name: "Bespoke Shirt", icon: "👔", baseMeters: 1.85, tab: "shirt", cat: "Shirting" },
  { id: "trouser", name: "Bespoke Trousers", icon: "👖", baseMeters: 1.35, tab: "lower", cat: "Suiting" },
  { id: "gurkha", name: "Gurkha Trousers", icon: "👖", baseMeters: 1.50, tab: "lower", cat: "Suiting" },
  { id: "kurta", name: "Kurta-Pyjama Set", icon: "👘", baseMeters: 3.50, tab: "wbs", cat: "Ceremonial" },
  { id: "sherwani", name: "Sherwani Set", icon: "👑", baseMeters: 4.25, tab: "wbs", cat: "Ceremonial" },
  { id: "bandi", name: "Bandi / Nehru Jacket", icon: "🦺", baseMeters: 1.40, tab: "wbs", cat: "Ceremonial" },
  { id: "waistcoat", name: "Waistcoat", icon: "🦺", baseMeters: 1.00, tab: "wbs", cat: "Suiting" },
  { id: "tuxedo", name: "Tuxedo / Dinner Suit", icon: "🥂", baseMeters: 3.50, tab: "upper", cat: "Suiting" }
];

const GARMENT_OPTIONS = GARMENT_CATALOG.map(g => g.name);

function buildDefaultWorkflow(orderDate, currentStage, cutterName, karigarName) {
  // A stage is a current summary, never evidence that earlier work happened.
  return WORKFLOW_TEMPLATE.map(step => ({
    key: step.key, label: step.label, stage: step.stage,
    done: false, doneDate: "", daysTaken: "",
    assignedTo: (step.key === "stitch_trial" || step.key === "finishing")
      ? (karigarName || "") : (cutterName || ""),
    notes: ""
  }));
}

const GARMENT_JOB_TYPES = {
  jacket: { label: "Jacket", schema: "upper" },
  trousers: { label: "Trousers", schema: "lower" },
  shirt: { label: "Shirt", schema: "shirt" },
  waistcoat: { label: "Waistcoat", schema: "waistcoat" },
  bandi: { label: "Bandi", schema: "bandi" },
  sherwani: { label: "Sherwani", schema: "sherwani" },
  kurta: { label: "Kurta", schema: "sherwani" },
  pyjama: { label: "Pyjama", schema: "lower" }
};
const GARMENT_JOB_BUNDLES = {
  suit2: { label: "2-piece suit", components: ["jacket", "trousers"] },
  suit3: { label: "3-piece suit", components: ["jacket", "trousers", "waistcoat"] }
};

function copyGarmentData(value) {
  return JSON.parse(JSON.stringify(value));
}

function isTrialWorkflowStep(step) {
  return /^trial_\d+$/.test(step.key || "") || step.stage === "1st Trial / Fitting";
}

function appendAdditionalTrial(workflow) {
  const result = copyGarmentData(workflow);
  const trials = result.filter(isTrialWorkflowStep);
  let number = Math.max(1, trials.length, ...trials.map(step =>
    Number(step.trialNumber || (step.key || "").match(/^trial_(\d+)$/)?.[1]) || 1
  )) + 1;
  while (result.some(step => step.key === "trial_" + number)) number++;
  const suffix = number % 100 >= 11 && number % 100 <= 13 ? "th" : ({1:"st",2:"nd",3:"rd"}[number % 10] || "th");
  let insertAt = result.findIndex(step => step.key === "finishing");
  for (let i = 0; i < result.length; i++) if (isTrialWorkflowStep(result[i])) insertAt = i + 1;
  if (insertAt < 0) insertAt = result.length;
  result.splice(insertAt, 0, {
    key: "trial_" + number, trialNumber: number, label: number + suffix + " Trial / Fitting",
    stage: "1st Trial / Fitting", scheduledDate: "", done: false, doneDate: "",
    daysTaken: "", assignedTo: "", notes: ""
  });
  return result;
}

const WORKSHOP_TEXT_FIELDS = {
  lower: [["bowLegInches", "Bow leg correction", true], ["knockKneesInches", "Knock-knee correction", true],
    ["bowLegComment", "Bow leg instructions"], ["knockKneesComment", "Knock-knee instructions"],
    ["forwardStanceComment", "Forward stance instructions"], ["outfoldHeight", "Outfold height"]],
  shirt: [["cuffComment", "Cuff instructions"], ["collarComment", "Collar instructions"],
    ["shirtInitialsText", "Shirt initials"], ["shirtComments", "Shirt cutter instructions"]],
  upper: [["shoulderDownInches", "Shoulder correction", true], ["Initials in Suit", "Suit initials"],
    ["suitComments", "Suit cutter instructions"]],
  waistcoat: [["waistcoatComments", "Waistcoat cutter instructions"]],
  bandi: [["bandiComments", "Bandi cutter instructions"]],
  sherwani: [["sherwaniComments", "Sherwani / kurta cutter instructions"]]
};

function buildGarmentWorkshopSheet(database, orderId, jobId) {
  const order = database.orders[orderId];
  const job = order?.garmentJobs?.find(item => item.id === jobId);
  if (!job || !GARMENT_JOB_TYPES[job.type]) throw new Error("This saved garment job is no longer available.");
  if (job.cancellation) throw new Error("This garment is cancelled. Reinstate it and save before issuing a workshop sheet.");
  const client = database.clients[order.clientId];
  const version = database.measurementVersions?.[job.measurementVersionId];
  const snapshot = version?.snapshot;
  if (!client) throw new Error("The client is no longer available.");
  if (!snapshot) throw new Error("Choose saved measurements for this garment, then save the garment list before printing.");
  if (version.clientId !== order.clientId || snapshot.clientId !== order.clientId) {
    throw new Error("This measurement copy does not belong to the order's client.");
  }
  const schemaId = GARMENT_JOB_TYPES[job.type].schema;
  const schema = SCHEMA[schemaId];
  const needsReference = ["waistcoat", "bandi", "sherwani"].includes(schemaId);
  let keys = schema.measures;
  if (job.type === "kurta") keys = keys.filter(key => key === "Kurta Length");
  if (job.type === "sherwani") keys = keys.filter(key => key !== "Kurta Length");
  const measures = fields => fields.map(label => ({ label, value: snapshot.measures?.[label] ?? "" }));
  const sections = [];
  if (needsReference) sections.push({title:"Upper-body reference from saved docket",rows:measures(SCHEMA.upper.measures)});
  sections.push({title:GARMENT_JOB_TYPES[job.type].label + " measurements",rows:measures(keys)});
  const tickKeys = needsReference ? ["Shoulder Down", "Hunchback"] : (schema.ticks || []).map(([key]) => key);
  if (schemaId === "shirt") tickKeys.push("Shoulder Down", "Hunchback");
  const options = tickKeys.map(label => ({label,value:snapshot.ticks?.[label] ?? ""}));
  const fields = [...(WORKSHOP_TEXT_FIELDS[schemaId] || [])];
  if (needsReference || schemaId === "shirt") fields.unshift(WORKSHOP_TEXT_FIELDS.upper[0]);
  const hasValue = value => value != null && String(value).trim() !== "";
  const instructions = fields.filter(([key]) => hasValue(snapshot.texts?.[key]))
    .map(([key,label,numeric]) => ({label,value:snapshot.texts[key],numeric:Boolean(numeric)}));
  const knownTexts = new Set(Object.values(WORKSHOP_TEXT_FIELDS).flat().map(([key]) => key));
  const knownTicks = new Set(Object.values(SCHEMA).flatMap(value => (value.ticks || []).map(([key]) => key)));
  const knownMeasures = new Set(Object.values(SCHEMA).flatMap(value => value.measures));
  const otherNotes = [
    ...Object.entries(snapshot.texts || {}).filter(([key,value]) => !knownTexts.has(key) && hasValue(value)),
    ...Object.entries(snapshot.ticks || {}).filter(([key,value]) => !knownTicks.has(key) && hasValue(value))
  ].map(([label,value]) => ({label:label.replace(/([a-z])([A-Z])/g,"$1 $2"),value}));
  otherNotes.push(...Object.entries(snapshot.measures || {}).filter(([key,value]) => !knownMeasures.has(key) && hasValue(value))
    .map(([label,value]) => ({label,value,numeric:true})));
  const swatch = Object.values(database.swatches).find(item => item.code === job.swatchCode);
  return copyGarmentData({
    orderId:order.id, orderNo:order.orderNo, orderDate:order.date || "", orderTrialDate:order.trialDate || "",
    delivery:order.delivery || "", clientId:client.id, clientName:client.name || "Unnamed client",
    jobId:job.id, jobLabel:job.label, garmentType:GARMENT_JOB_TYPES[job.type].label,
    stage:job.status, maker:job.maker || "", swatchCode:job.swatchCode || "",
    swatchDescription:swatch ? [swatch.colorName,swatch.book].filter(Boolean).join(" · ") : "",
    versionId:job.measurementVersionId, sourceDocket:snapshot.orderNo || version.sourceMeasurementId,
    measuredDate:snapshot.date || "", measuredBy:snapshot.measuredBy || "", copiedAt:version.copiedAt || "",
    unit:snapshot.unit || "in", sections, options, instructions, otherNotes,
    docketNotes:snapshot.notes || "", jobNotes:job.notes || "",
    trials:(job.workflow || []).filter(isTrialWorkflowStep).map(step => ({
      label:step.label,scheduledDate:step.scheduledDate || "",done:Boolean(step.done),doneDate:step.doneDate || "",notes:step.notes || ""
    })),
    taskNotes:(job.workflow || []).filter(step => !isTrialWorkflowStep(step) && hasValue(step.notes))
      .map(step => ({label:step.label,value:step.notes}))
  });
}

function makeGarmentJobs(type, quantity, defaults, existingJobs = []) {
  if (!Number.isInteger(quantity) || quantity < 1 || quantity > 100) {
    throw new Error("Enter a whole quantity between 1 and 100.");
  }
  const bundle = GARMENT_JOB_BUNDLES[type];
  const components = bundle?.components || (GARMENT_JOB_TYPES[type] ? [type] : null);
  if (!components) throw new Error("Choose a garment type.");
  const jobs = [];
  for (let item = 0; item < quantity; item++) {
    const bundleId = bundle ? uid("bundle") : "";
    for (const component of components) {
      const number = [...existingJobs, ...jobs].filter(job => job.type === component).length + 1;
      jobs.push({
        id: uid("job"), type: component, label: GARMENT_JOB_TYPES[component].label + " " + number,
        bundleId, bundleLabel: bundle ? bundle.label : "",
        maker: defaults.maker || "", swatchCode: defaults.swatchCode || "",
        measurementVersionId: defaults.measurementVersionId || "",
        status: "New", notes: "", createdAt: new Date().toISOString(),
        workflow: buildDefaultWorkflow("", "New", "", ""), history: []
      });
      if (defaults.additionReason) jobs[jobs.length - 1].additionReason = defaults.additionReason.trim();
    }
  }
  return jobs;
}

function captureGarmentMeasurement(docketId, database, versions) {
  if (!docketId) return "";
  const docket = database.measurements[docketId];
  if (!docket) throw new Error("That saved measurement docket is no longer available.");
  const serialized = JSON.stringify(docket);
  const existing = Object.values(versions).find(version =>
    version.sourceMeasurementId === docketId && JSON.stringify(version.snapshot) === serialized
  );
  if (existing) return existing.id;
  const id = uid("mv");
  versions[id] = {
    id, sourceMeasurementId: docketId, clientId: docket.clientId,
    sourceSavedAt: docket.savedAt || "", copiedAt: new Date().toISOString(),
    snapshot: copyGarmentData(docket)
  };
  return id;
}

function garmentOrderStage(jobs) {
  if (!jobs.length) return "New";
  const active = jobs.filter(job => !job.cancellation);
  if (!active.length) return "Cancelled";
  const stages = active.map(job => ORDER_STAGES.indexOf(job.status));
  return ORDER_STAGES[Math.max(0, Math.min(...stages))];
}

function garmentProgressText(jobs) {
  const active = jobs.filter(job => !job.cancellation);
  const cancelled = jobs.length - active.length;
  if (!active.length && cancelled) return "0 active garments · " + cancelled + " cancelled";
  const ready = active.filter(job => job.status === "Ready" || job.status === "Delivered").length;
  const delivered = active.filter(job => job.status === "Delivered").length;
  const text = delivered === active.length && active.length
    ? delivered + " of " + active.length + " garments delivered"
    : ready + " of " + active.length + " garments ready";
  return text + (cancelled ? " · " + active.length + " active · " + cancelled + " cancelled" : "");
}

function garmentOrderDescription(order) {
  if (!order.garmentJobs?.length) return order.garments || "";
  const counts = new Map();
  for (const job of order.garmentJobs.filter(item => !item.cancellation)) counts.set(job.type, (counts.get(job.type) || 0) + 1);
  if (!counts.size) return "All garments cancelled";
  return [...counts].map(([type, quantity]) => quantity + "× " + (GARMENT_JOB_TYPES[type]?.label || type)).join(" + ");
}

function orderSearchText(order, client = {}) {
  const garmentFields = (order.garmentJobs || []).flatMap(job =>
    [job.label, GARMENT_JOB_TYPES[job.type]?.label, job.maker, job.swatchCode]);
  return [order.orderNo, client.name, order.garments, garmentOrderDescription(order),
    order.swatchCode, order.fabric, order.assignedTo, order.karigarAssigned, ...garmentFields].join(" ").toLowerCase();
}

function orderWorkflowSummary(order) {
  const jobs = order.garmentJobs || [];
  const active = jobs.filter(job => !job.cancellation);
  const workflow = jobs.length ? active.flatMap(job => job.workflow || []) : order.workflow || [];
  const nextJob = active.find(job => job.status !== "Delivered" && job.workflow?.some(step => !step.done));
  const next = jobs.length ? nextJob?.workflow.find(step => !step.done) : workflow.find(step => !step.done);
  return {total:workflow.length,done:workflow.filter(step => step.done).length,
    delivered:order.status === "Delivered",cancelled:order.status === "Cancelled" || (jobs.length > 0 && !active.length),
    next:next ? {label:next.label,garment:nextJob?.label || "",assignedTo:next.assignedTo || nextJob?.maker || ""} : null};
}

function orderWorkflowNote(progress) {
  if (progress.cancelled) return "No active garments · history retained";
  if (progress.delivered) return "Delivery recorded" + (progress.total > progress.done ? " · " + (progress.total-progress.done) + " tasks not marked complete" : "");
  if (!progress.next) return progress.total ? "All recorded tasks complete" : "No workflow recorded";
  const next = progress.next;
  const label = [next.garment,next.label.replace(/^\d+\.\s*/, "")].filter(Boolean).join(" · ");
  return "Next: " + label + (next.assignedTo ? " (" + next.assignedTo + ")" : "");
}

const PRODUCTION_GROUPS = [
  ["Preparation", ["New", "Fabric Ordered", "Fabric Received"]],
  ["Making", ["Cutting", "Stitching"]],
  ["Fitting", ["1st Trial / Fitting"]],
  ["Finishing", ["Finishing"]],
  ["Ready", ["Ready"]]
];

function trackingDate(value) {
  if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return "";
  const date = new Date(value + "T00:00:00Z");
  return Number.isFinite(+date) && date.toISOString().slice(0, 10) === value ? value : "";
}

function summarizeTrackedOrder(order, client, today, through) {
  const active = !["Delivered", "Cancelled"].includes(order.status);
  const jobs = order.garmentJobs || [];
  const retained = jobs.filter(job => !job.cancellation);
  const working = active ? retained.filter(job => job.status !== "Delivered") : [];
  const ready = retained.filter(job => job.status === "Ready").length;
  const delivered = retained.filter(job => job.status === "Delivered").length;
  const delivery = trackingDate(order.delivery);
  const overdue = active && Boolean(delivery && delivery < today);
  const branch = (client?.branch || "").split(" · ")[0];
  const stageGroup = PRODUCTION_GROUPS.find(([, stages]) => stages.includes(order.status))?.[0] || "Other";
  const events = [];
  if (active) {
    const sources = jobs.length ? working : [order];
    for (const source of sources) {
      const trials = (source.workflow || []).filter(isTrialWorkflowStep);
      trials.forEach((trial, index) => {
        const date = trackingDate(trial.scheduledDate);
        if (!trial.done && date) {
          events.push({
            key: (jobs.length ? source.id : "order") + "-trial-" + index,
            date, label: "Fitting " + (trial.trialNumber || (trial.key || "").match(/^trial_(\d+)$/)?.[1] || index + 1),
            garment: jobs.length ? source.label : "", jobId: jobs.length ? source.id : ""
          });
        }
      });
      if (!jobs.length && !trials.length && trackingDate(order.trialDate)) {
        events.push({key: "legacy-fitting", date: order.trialDate, label: "Fitting (legacy date)", garment: ""});
      }
    }
    if (delivery) events.push({key: "delivery", date: delivery, label: "Delivery", garment: ""});
  }
  events.sort((a, b) => a.date.localeCompare(b.date));
  const fittings = events.filter(event => event.key !== "delivery");
  const upcomingFittings = fittings.filter(event => event.date >= today && event.date <= through);
  const reasons = [];
  if (overdue) reasons.push({priority: 0, text: "Delivery overdue", date: delivery});
  if (fittings.some(event => event.date < today)) reasons.push({priority: 1, text: "Past fitting date — confirm outcome"});
  if (active && !jobs.length) reasons.push({priority: 2, text: "Garment breakdown needed"});
  const missing = [
    ["maker", "maker"], ["swatchCode", "fabric swatch"], ["measurementVersionId", "measurement copy"]
  ].filter(([field]) => working.some(job => !job[field])).map(([, label]) => label);
  if (missing.length) reasons.push({priority: 2, text: "Missing " + missing.join(", ")});
  if (order.commercialReviewRequired) reasons.push({priority: 3, text: "Fabric / payment review pending"});
  return {
    order, client, active, delivery, overdue, branch: ["Mumbai", "London"].includes(branch) ? branch : "Unspecified",
    ready, delivered, total: retained.length, cancelled: jobs.length - retained.length,
    collection: active && (jobs.length ? ready > 0 : order.status === "Ready"),
    stageGroup, events, upcomingFittings, reasons,
    nextEvent: events.find(event => event.date >= today) || null
  };
}

function recordedOrderPayments(order) {
  const value = raw => raw == null || String(raw).trim() === "" || !Number.isFinite(Number(raw)) || Number(raw) < 0 ? null : Number(raw);
  const quoted = value(order.amount), received = value(order.advancePaid);
  const known = quoted !== null && received !== null;
  return {quoted,received,balance:known ? Math.max(0,quoted-received) : null,excess:known ? Math.max(0,received-quoted) : null};
}

function orderTimingRecorded(order) {
  return [order.actualDays,order.estDays].every(value => value != null && String(value).trim() !== "" && Number.isFinite(Number(value)));
}

function applyGarmentJobEdit(job, fields) {
  if (job.cancellation) throw new Error("Reinstate the garment before changing its measurements or progress.");
  const updated = { ...copyGarmentData(job), ...fields };
  if (!updated.label.trim()) throw new Error("Enter a name for this garment.");
  if (!ORDER_STAGES.includes(updated.status)) throw new Error("Choose a valid stage.");
  return recordGarmentJobChange(job, updated);
}

function recordGarmentJobChange(job, updated, details = {}) {
  const before = { ...job };
  const after = { ...updated };
  delete before.history;
  delete after.history;
  if (JSON.stringify(before) !== JSON.stringify(after)) {
    updated.updatedAt = new Date().toISOString();
    updated.history = [...(job.history || []), { at: updated.updatedAt, ...details, before, after }];
  }
  return updated;
}

function reviseGarmentCancellation(job, reason, reinstate = false) {
  reason = String(reason || "").trim();
  if (!reason) throw new Error("Enter a reason for this garment change.");
  if (reinstate && !job.cancellation) throw new Error("This garment is already active.");
  if (!reinstate && job.cancellation) throw new Error("This garment is already cancelled.");
  if (!reinstate && job.status === "Delivered") throw new Error("Delivered garments need a return/refund review; they cannot be cancelled here.");
  const updated = copyGarmentData(job);
  updated.cancellation = reinstate ? null : {at:new Date().toISOString(),reason,stage:job.status};
  return recordGarmentJobChange(job, updated, {kind:reinstate ? "Reinstated" : "Cancelled",reason});
}

const ORDER_COMMERCIAL_FIELDS = {
  amount:"Order quote", advancePaid:"Recorded received total", fabricMeters:"Fabric metres used for costing",
  reservedFabricMeters:"Fabric reservation metres",
  fabricRate:"Fabric rate", trimsCost:"Trims cost", cutterCost:"Cutter cost", karigarCost:"Maker cost",
  trialShippingCost:"Trial / shipping cost", swatchCode:"Order fabric swatch", fabric:"Fabric description", liningCode:"Lining code"
};

function orderFabricReservation(order) {
  if (order.reservedFabricMeters != null) return Number(order.reservedFabricMeters) || 0;
  return order.status === "Delivered" ? 0 : Number(order.fabricMeters) || 0;
}

function reviewOrderCommercials(before, after, reason, confirmed = false) {
  if (!before.garmentJobs?.length) return after;
  const changes = {};
  for (const field of Object.keys(ORDER_COMMERCIAL_FIELDS)) {
    const numeric = !["swatchCode","fabric","liningCode"].includes(field);
    const normalize = value => value == null || value === "" ? null : numeric ? Number(value) : String(value);
    const previous = field === "reservedFabricMeters" ? orderFabricReservation(before) : normalize(before[field]);
    const next = field === "reservedFabricMeters" ? orderFabricReservation(after) : normalize(after[field]);
    if (field === "reservedFabricMeters" && after[field] != null && (!Number.isFinite(Number(after[field])) || Number(after[field]) < 0)) throw new Error("Fabric reservation metres must be zero or a positive number.");
    if (previous === next) continue;
    if (numeric && next !== null && (!Number.isFinite(next) || next < 0)) throw new Error(ORDER_COMMERCIAL_FIELDS[field] + " must be zero or a positive number.");
    changes[field] = {before:field === "reservedFabricMeters" ? previous : before[field] ?? null,after:field === "reservedFabricMeters" ? next : after[field] ?? null};
  }
  if (!Object.keys(changes).length && !confirmed) return after;
  reason = String(reason || "").trim();
  if (!reason) throw new Error("Enter a reason for the fabric/payment review or changed order totals.");
  return {
    ...after, commercialReviewRequired:confirmed ? false : Boolean(before.commercialReviewRequired),
    commercialAdjustments:[...(before.commercialAdjustments || []), {
      id:uid("review"),at:new Date().toISOString(),reason,changes,confirmed,
      garmentRevisionCount:(before.garmentRevisions || []).length
    }]
  };
}

function commitGarmentWorkspace(workspace) {
  const latest = latestStoredDatabase();
  const order = latest.orders[workspace.orderId];
  if (!order || JSON.stringify(order) !== workspace.original) {
    throw new Error("This order changed in another tab. Reopen its garment list before saving.");
  }
  if (!latest.clients[order.clientId]) throw new Error("The client is no longer available.");
  if (!workspace.jobs.length) throw new Error("Add at least one garment job.");
  const versions = { ...(latest.measurementVersions || {}) };
  const ids = new Set();
  const versionIds = new Set();
  const revisions = [];
  const previousJobs = order.garmentJobs || [];
  for (const previous of previousJobs) {
    const job = workspace.jobs.find(item => item.id === previous.id);
    if (!job) throw new Error("Saved garments cannot be removed. Cancel the garment with a reason instead.");
    if (job.type !== previous.type || job.bundleId !== previous.bundleId) throw new Error("A saved garment's identity cannot be replaced.");
    if (JSON.stringify((job.history || []).slice(0,(previous.history || []).length)) !== JSON.stringify(previous.history || [])) {
      throw new Error("Existing garment activity cannot be removed or changed.");
    }
    if ((previous.workflow || []).some(step => !job.workflow.some(item => item.key === step.key))) throw new Error("Existing workflow tasks cannot be removed.");
    const events = (job.history || []).slice((previous.history || []).length);
    for (const event of events.filter(item => ["Cancelled","Reinstated"].includes(item.kind))) {
      if (!String(event.reason || "").trim()) throw new Error("Enter a reason for the garment change.");
      revisions.push({id:uid("revision"),at:new Date().toISOString(),kind:event.kind,jobId:job.id,label:job.label,reason:event.reason});
    }
    if (JSON.stringify(job.cancellation || null) !== JSON.stringify(previous.cancellation || null) && !events.some(event => ["Cancelled","Reinstated"].includes(event.kind))) {
      throw new Error("Use the cancellation or reinstatement action to change a garment's cancellation state.");
    }
    if (previous.cancellation && !events.some(event => event.kind === "Reinstated") && JSON.stringify(job) !== JSON.stringify(previous)) throw new Error("Reinstate the garment before editing it.");
  }
  for (const job of workspace.jobs) {
    if (!job.id || ids.has(job.id) || !GARMENT_JOB_TYPES[job.type] || !ORDER_STAGES.includes(job.status)) {
      throw new Error("The garment list contains an invalid or duplicate job.");
    }
    ids.add(job.id);
    if (job.cancellation && (!String(job.cancellation.reason || "").trim() || job.status === "Delivered")) throw new Error("Invalid cancellation record.");
    if (previousJobs.length && !previousJobs.some(item => item.id === job.id)) {
      if (!String(job.additionReason || "").trim()) throw new Error("Enter a reason for adding garments to this order.");
      revisions.push({id:uid("revision"),at:new Date().toISOString(),kind:"Added",jobId:job.id,label:job.label,reason:job.additionReason});
    }
    if (job.measurementVersionId) versionIds.add(job.measurementVersionId);
    for (const event of job.history || []) {
      if (event.before.measurementVersionId) versionIds.add(event.before.measurementVersionId);
      if (event.after.measurementVersionId) versionIds.add(event.after.measurementVersionId);
    }
  }
  for (const versionId of versionIds) {
    const version = workspace.versions[versionId];
    if (!version || version.clientId !== order.clientId || version.snapshot.clientId !== order.clientId) {
      throw new Error("Choose measurements belonging to this order's client.");
    }
    if (versions[version.id] && JSON.stringify(versions[version.id]) !== JSON.stringify(version)) {
      throw new Error("The saved measurement copy changed. Reopen the garment list.");
    }
    versions[version.id] = copyGarmentData(version);
  }
  const updated = {
    ...order, garmentJobs: copyGarmentData(workspace.jobs), status: garmentOrderStage(workspace.jobs),
    garmentJobsReviewedAt: new Date().toISOString()
  };
  if (!order.garmentJobs?.length) {
    updated.productionBeforeGarmentJobs = { status: order.status || "New", recordedAt: updated.garmentJobsReviewedAt };
  }
  if (revisions.length) {
    updated.garmentRevisions = [...(order.garmentRevisions || []),...revisions];
    updated.commercialReviewRequired = true;
    // Freeze the existing reservation even if cancelling the last unfinished garment closes the order.
    if (order.reservedFabricMeters == null) updated.reservedFabricMeters = orderFabricReservation(order);
  }
  const next = {
    ...latest, measurementVersions: versions,
    orders: { ...latest.orders, [order.id]: updated }
  };
  const pending = writeDatabase(next);
  const finish = () => { DB = next; return next.orders[order.id]; };
  return pending?.then ? pending.then(finish) : finish();
}

/* ---------------- LOCAL STORAGE: PRESERVE LEGACY RECORDS ---------------- */
const DEMO_MODE = new URLSearchParams(location.search).get("demo") === "1";
const SHARED_MODE = Boolean(globalThis.ModistoShared?.enabled) && !DEMO_MODE;
const DB_KEY = DEMO_MODE ? "modisto_bespoke_demo_v7" : SHARED_MODE ? "modisto_shared_local" : "modisto_bespoke_v7";
const RECOVERY_KEY = DB_KEY + "_recovery";
let STORAGE_BLOCKED = false;

function emptyDatabase() {
  const settings = { ...getSeedData().settings, measuredByDefault: "", viewMode: "relevant",
    atelierContactLine2: "" };
  return { clients: {}, measurements: {}, measurementVersions: {}, orders: {}, swatches: {}, employees: {}, settings };
}

function normalizeDatabase(data) {
  if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("Invalid database");
  const result = { ...data };
  for (const key of ["clients", "measurements", "measurementVersions", "orders", "swatches", "employees"]) {
    if (result[key] == null) result[key] = {};
    if (typeof result[key] !== "object" || Array.isArray(result[key])) throw new Error("Invalid " + key);
  }
  result.settings = { ...emptyDatabase().settings, ...data.settings };
  return result;
}

function syncOrderStageToWorkflow(o, newStage) {
  if (!o) return;
  if (o.garmentJobs?.length) {
    o.status = garmentOrderStage(o.garmentJobs);
    return;
  }
  if (ORDER_STAGES.includes(newStage)) o.status = newStage;
  if (!Array.isArray(o.workflow)) {
    o.workflow = buildDefaultWorkflow(o.date, o.status, o.assignedTo, o.karigarAssigned);
  }
  // Keep every existing step, date, assignment and extension intact.
}

function load_() {
  if (SHARED_MODE) return emptyDatabase();
  try {
    const keys = DEMO_MODE ? [DB_KEY] : [DB_KEY, "modisto_bespoke_v6", "modisto_bespoke_v5", "modisto_bespoke_v4", "modisto_bespoke_v3"];
    for (const key of keys) {
      const raw = localStorage.getItem(key);
      if (raw !== null) return normalizeDatabase(JSON.parse(raw));
    }
    return DEMO_MODE ? getSeedData() : emptyDatabase();
  } catch (e) {
    // Never replace unreadable records with sample data or overwrite the source.
    STORAGE_BLOCKED = true;
    console.error("Stored data could not be loaded; source retained.", e);
    return emptyDatabase();
  }
}

let DB = load_();
const measurementBaselines = new WeakMap();

function latestStoredDatabase() {
  if (SHARED_MODE) return normalizeDatabase(globalThis.ModistoShared.snapshot());
  const keys = DEMO_MODE ? [DB_KEY] : [DB_KEY, "modisto_bespoke_v6", "modisto_bespoke_v5", "modisto_bespoke_v4", "modisto_bespoke_v3"];
  for (const key of keys) {
    const raw = localStorage.getItem(key);
    if (raw !== null) return normalizeDatabase(JSON.parse(raw));
  }
  return DB;
}

function writeDatabase(next) {
  if (STORAGE_BLOCKED) throw new Error("Stored data could not be loaded. Recover the original JSON before saving.");
  if (SHARED_MODE) return globalThis.ModistoShared.commit(next);
  if (!localStorage.getItem(RECOVERY_KEY)) {
    localStorage.setItem(RECOVERY_KEY, localStorage.getItem(DB_KEY) || JSON.stringify(DB));
  }
  localStorage.setItem(DB_KEY, JSON.stringify(next));
}

function persist() {
  const success = () => { updateNavCounts(); renderSidebarBrandAndEmployees(); return true; };
  const failure = e => {
    if (SHARED_MODE) DB = normalizeDatabase(globalThis.ModistoShared.snapshot());
    toast((SHARED_MODE ? "Shared save failed — form retained. " : "Could not save locally — export a JSON backup in Settings. ") + e.message);
    return false;
  };
  try {
    const pending = writeDatabase(DB);
    return pending?.then ? pending.then(success,failure) : success();
  } catch (e) { return failure(e); }
}

/* ---------------- SMART MEASUREMENT-BASED FABRIC ESTIMATOR & STOCK CHECK ---------------- */
function estimateFabricFromMeasurements(mrec, garmentType, qtySets) {
  const m = (mrec && mrec.measures) || {};
  const t = (mrec && mrec.ticks) || {};
  const u = (mrec && mrec.unit) || "in";
  const toIn = val => {
    const n = parseFloat(val);
    if (isNaN(n) || n <= 0) return 0;
    return u === "cm" ? n / 2.54 : n;
  };

  // Extract key lengths & girths in inches (with sensible bespoke defaults if not yet typed)
  const outseam = toIn(m["Side Length (Outseam)"]) || 40.5;
  const suitLen = toIn(m["Suit Length Front"]) || 30.0;
  const suitSleeve = toIn(m["Full Sleeve Length"]) || toIn(m["Sleeve (Full)"]) || 24.75;
  const shirtLen = toIn(m["Shirt Length"]) || 29.5;
  const shirtSleeve = toIn(m["Sleeve (Full)"]) || 24.75;
  const chest = toIn(m["Chest (Suit)"]) || toIn(m["Chest"]) || 41.0;
  const waist = toIn(m["Waist"]) || 34.0;
  const wcLen = toIn(m["Waistcoat Front Length"]) || 25.5;
  const bandiLen = toIn(m["Bandi Front Length"]) || 27.5;
  const sherwaniLen = toIn(m["Sherwani Front Length"]) || 38.5;
  const kurtaLen = toIn(m["Kurta Length"]) || 41.5;

  // Calculate base meters per piece (assuming 58"-60" width suiting/shirting):
  // Trouser: (Outseam + 8" hem/turnup/allowance) / 39.37 -> plus extra if chest/waist > 42" or Gurkha/Pleats
  let trouserM = ((outseam + 9) / 39.37);
  if (waist > 38) trouserM += 0.25;
  if (t["Gurkha Trouser"] === "Y") trouserM += 0.15;
  if (t["Outfold at Bottom"] === "Y") trouserM += 0.10;
  trouserM = Math.max(1.25, Math.round(trouserM * 20) / 20);

  // Jacket / Suit Coat: ((Suit Length + Sleeve Length + 10" seam/facings/lapel) / 39.37)
  let jacketM = ((suitLen + suitSleeve + 11) / 39.37);
  if (chest >= 44) jacketM += 0.35;
  else if (chest >= 41) jacketM += 0.15;
  if (t["Suit Style"] === "Double Breasted") jacketM += 0.25;
  if (t["Patch Pockets"] === "Yes") jacketM += 0.10;
  jacketM = Math.max(1.85, Math.round(jacketM * 20) / 20);

  // Shirt: ((Shirt Length + Shirt Sleeve + 12" collar/cuffs/yoke) / 39.37)
  let shirtM = ((shirtLen + shirtSleeve + 13) / 39.37);
  if (chest >= 43) shirtM += 0.25;
  if (t["Cuff"] === "Double") shirtM += 0.10;
  shirtM = Math.max(1.75, Math.round(shirtM * 20) / 20);

  // Waistcoat / Bandi / Sherwani / Kurta
  const waistcoatM = Math.max(0.85, Math.round(((wcLen + 8) / 39.37) * 20) / 20);
  const bandiM = Math.max(1.25, Math.round(((bandiLen + 14) / 39.37) * 20) / 20);
  const sherwaniM = Math.max(2.90, Math.round(((sherwaniLen + suitSleeve + 16) / 39.37) * 20) / 20);
  const kurtaM = Math.max(2.40, Math.round(((kurtaLen + shirtSleeve + 12) / 39.37) * 20) / 20);

  const g = garmentType || "2-Piece Bespoke Suit";
  let singleSetMeters = 3.5;
  let breakdownText = "";

  if (g.includes("3-Piece")) {
    singleSetMeters = jacketM + trouserM + waistcoatM;
    breakdownText = `Jacket (${jacketM.toFixed(2)}m) + Trouser (${trouserM.toFixed(2)}m) + Waistcoat (${waistcoatM.toFixed(2)}m)`;
  } else if (g.includes("2-Piece") || g.includes("Tuxedo")) {
    singleSetMeters = jacketM + trouserM;
    breakdownText = `Jacket (${jacketM.toFixed(2)}m) + Trouser (${trouserM.toFixed(2)}m)`;
  } else if (g.includes("Shirt")) {
    singleSetMeters = shirtM;
    breakdownText = `Shirt Length ${shirtLen}" + Sleeve ${shirtSleeve}" + Collar/Cuff (${shirtM.toFixed(2)}m)`;
  } else if (g.includes("Trouser")) {
    singleSetMeters = trouserM;
    breakdownText = `Outseam ${outseam}" + Waist ${waist}" (${trouserM.toFixed(2)}m)`;
  } else if (g.includes("Sherwani")) {
    singleSetMeters = sherwaniM + trouserM;
    breakdownText = `Sherwani (${sherwaniM.toFixed(2)}m) + Bottom (${trouserM.toFixed(2)}m)`;
  } else if (g.includes("Bandi")) {
    singleSetMeters = bandiM;
    breakdownText = `Bandi Front ${bandiLen}" (${bandiM.toFixed(2)}m)`;
  } else if (g.includes("Waistcoat")) {
    singleSetMeters = waistcoatM;
    breakdownText = `Waistcoat Front ${wcLen}" (${waistcoatM.toFixed(2)}m)`;
  } else if (g.includes("Kurta")) {
    singleSetMeters = kurtaM + trouserM;
    breakdownText = `Kurta (${kurtaM.toFixed(2)}m) + Pyjama/Trouser (${trouserM.toFixed(2)}m)`;
  } else {
    singleSetMeters = jacketM;
    breakdownText = `Blazer / Jacket (${jacketM.toFixed(2)}m)`;
  }

  const sets = Math.max(1, parseFloat(qtySets) || 1);
  const totalMeters = Math.round(singleSetMeters * sets * 20) / 20;

  return {
    singleSetMeters: Math.round(singleSetMeters * 20) / 20,
    totalMeters,
    sets,
    breakdownText,
    perGarment: {
      suit2pc: Math.round((jacketM + trouserM) * 20) / 20,
      suit3pc: Math.round((jacketM + trouserM + waistcoatM) * 20) / 20,
      trouser: trouserM,
      shirt: shirtM,
      sherwani: sherwaniM,
      waistcoat: waistcoatM,
      bandi: bandiM
    }
  };
}

function getSwatchAllocationStatus(swatchCode, extraMeters = 0) {
  const sw = getSwatchByCode(swatchCode);
  if (!sw) return null;
  // An explicit reservation survives cancellation/delivery until staff review it.
  const openOrders = Object.values(DB.orders).filter(o =>
    (o.status !== "Delivered" || o.reservedFabricMeters != null) && orderFabricReservation(o) > 0 &&
    ((o.swatchCode || "").toUpperCase() === sw.code.toUpperCase() ||
     (o.fabric || "").toUpperCase().includes(sw.code.toUpperCase()))
  );
  const ordersMeters = openOrders.reduce((sum, o) => sum + orderFabricReservation(o), 0);
  const requiredMeters = Math.max(ordersMeters, parseFloat(sw.allocatedMeters) || 0) + (parseFloat(extraMeters) || 0);
  const stockMeters = parseFloat(sw.stockMeters) || 0;
  const minStockMeters = parseFloat(sw.minStockMeters) || 0;
  const diff = Math.round((stockMeters - requiredMeters) * 100) / 100;
  const shortage = diff < 0 ? Math.abs(diff) : 0;
  const belowMin = stockMeters < minStockMeters;

  return {
    swatch: sw,
    stockMeters,
    minStockMeters,
    ordersMeters: Math.round(ordersMeters * 100) / 100,
    requiredMeters: Math.round(requiredMeters * 100) / 100,
    shortage,
    surplus: diff >= 0 ? diff : 0,
    isShort: shortage > 0,
    belowMin,
    needsReorder: shortage > 0 || belowMin,
    openOrderCount: openOrders.length,
    openOrderNos: openOrders.map(o => o.orderNo)
  };
}

function calcOrderEconomics(o) {
  const meters = parseFloat(o.fabricMeters) || 0;
  const rate = parseFloat(o.fabricRate) || 0;
  const fabricTotal = Math.round(meters * rate);
  const trims = parseFloat(o.trimsCost) || 0;
  const cutter = parseFloat(o.cutterCost) || 0;
  const karigar = parseFloat(o.karigarCost) || 0;
  const shipping = parseFloat(o.trialShippingCost) || 0;
  const totalCost = fabricTotal + trims + cutter + karigar + shipping;
  const quoted = parseFloat(o.amount) || 0;
  const advance = parseFloat(o.advancePaid) || 0;
  const balance = Math.max(0, quoted - advance);
  const profit = quoted - totalCost;
  const marginPct = quoted > 0 ? ((profit / quoted) * 100) : 0;
  const hours = parseFloat(o.hoursSpent) || 0;
  const estHours = parseFloat(o.estHours) || 0;
  const estDays = parseFloat(o.estDays) || 0;
  const actualDays = parseFloat(o.actualDays) || 0;
  const profitPerHr = hours > 0 ? Math.round(profit / hours) : 0;
  return {
    fabricTotal, trims, cutter, karigar, shipping,
    totalCost, quoted, advance, balance, profit, marginPct,
    hours, estHours, estDays, actualDays,
    daysVariance: actualDays - estDays,
    hoursVariance: hours - estHours,
    profitPerHr
  };
}

function getSwatchByCode(code) {
  if (!code) return null;
  const clean = code.trim().split(" ")[0].toUpperCase();
  return Object.values(DB.swatches).find(s => (s.code || "").toUpperCase() === clean) || null;
}

function renderSwatchBadge(code) {
  if (!code) return `<span style="color:var(--ink-soft)">—</span>`;
  const sw = getSwatchByCode(code);
  const hex = sw ? sw.colorHex : "#8b6f3e";
  const label = sw ? `${sw.code} · ${sw.colorName}` : code;
  const alloc = sw ? getSwatchAllocationStatus(sw.code) : null;
  const warnTag = (alloc && alloc.isShort)
    ? ` <span style="color:var(--danger);font-weight:800;" title="Short by ${alloc.shortage}m (Req: ${alloc.requiredMeters}m vs Stock: ${alloc.stockMeters}m)">⚠ -${alloc.shortage}m</span>`
    : "";
  return `<span class="swatch-pill"><span class="swatch-dot" style="background:${esc(hex)}"></span>${esc(label)}${warnTag}</span>`;
}

function stageBadgeClass(status) {
  if (!status) return "s-New";
  if (status.includes("Trial") || status.includes("Fitting")) return "s-Fitting";
  if (status.includes("Fabric")) return "s-Fabric";
  return "s-" + status.split(" ")[0];
}

/* ---------------- OPTIONAL SHEETS SYNC ---------------- */
async function pushToSheets(sheetName, row) {
  if (SHARED_MODE) return false;
  const url = DB.settings.appsScriptUrl;
  if (!url) return false;
  try {
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ _sheet: sheetName }, row))
    });
    return true;
  } catch (e) {
    return false;
  }
}

function trackingCalendar() {
  const now = new Date();
  const today = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, "0"), String(now.getDate()).padStart(2, "0")].join("-");
  const end = new Date(today + "T00:00:00Z");
  end.setUTCDate(end.getUTCDate() + 6);
  return {today, through: end.toISOString().slice(0, 10), zone: Intl.DateTimeFormat().resolvedOptions().timeZone};
}

function trackedOrders(calendar, branch) {
  return Object.values(DB.orders)
    .map(order => summarizeTrackedOrder(order, DB.clients[order.clientId], calendar.today, calendar.through))
    .filter(item => !branch || item.branch === branch);
}

function branchOptions(selected) {
  return [["", "All branches"], ["Mumbai", "Mumbai"], ["London", "London"], ["Unspecified", "Unspecified"]]
    .map(([value, label]) => `<option value="${value}" ${selected === value ? "selected" : ""}>${label}</option>`).join("");
}

function trackedOrderButton(item, label, event) {
  return `<button type="button" class="tracking-link" data-open-tracked-order="${esc(item.order.id)}"
    ${event ? `data-tracking-event="${esc(event.key)}"` : ""}>${esc(label)}</button>`;
}

function trackingEventText(event) {
  return [event.label, event.garment, fmtDate(event.date)].filter(Boolean).join(" · ");
}

function trackingAttentionSort(a, b) {
  return a.reasons[0].priority - b.reasons[0].priority ||
    (a.delivery || "9999").localeCompare(b.delivery || "9999");
}

function trackingEvents(items, predicate) {
  return items.flatMap(item => item.events.filter(predicate).map(event => ({item, event})))
    .sort((a, b) => a.event.date.localeCompare(b.event.date));
}

function trackingEventList(events) {
  return `<ul class="tracking-queue">${events.map(({item, event}) => `<li>
    ${trackedOrderButton(item, (item.client?.name || "Unknown client") + " · " + item.order.orderNo, event)}
    <span>${esc(trackingEventText(event))}</span>
  </li>`).join("")}</ul>`;
}

    .map(label => ({label, count: active.filter(item => item.stageGroup === label).length}))

  return `<div class="tracking">
    <div class="tracking-heading">
      <div><h1>Today</h1><p>${esc(fmtDate(calendar.today))} · ${esc(calendar.zone)}</p></div>

    <div class="tracking-metrics">${metrics.map(([view, label, count]) => `
      <button type="button" class="tracking-metric" data-today-view="${view}"><strong>${count}</strong><span>${label}</span></button>
    `).join("")}</div>
