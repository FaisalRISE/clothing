<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modisto Bespoke — Atelier CRM, Measurement Docket & Costing Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --navy: #131b29;
  --navy-2: #1c2739;
  --navy-3: #25334a;
  --gold: #8b6f3e;
  --gold-strong: #755c2f;
  --gold-soft: #c9b083;
  --gold-tint: #f8f3e8;
  --cream: #f3ecdd;
  --bg: #f6f4ef;
  --card: #ffffff;
  --line: #e7e2d7;
  --line-2: #d8d2c4;
  --ink: #26221c;
  --ink-soft: #6d675c;
  --green: #2e6b46;
  --green-bg: #e9f4ec;
  --amber: #8a6116;
  --amber-bg: #fdf3e2;
  --danger: #9b3b2e;
  --danger-bg: #fbeae8;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(20,25,40,.05), 0 10px 28px -20px rgba(20,25,40,.25);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  font-size: 13.5px;
  line-height: 1.48;
  -webkit-font-smoothing: antialiased;
}
.serif { font-family: 'Cormorant Garamond', Georgia, serif; }

/* Layout */
.app { display: flex; min-height: 100vh; }

/* Sidebar */
.side {
  width: 218px;
  background: var(--navy);
  color: #c6ccd8;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 20px 12px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid rgba(201,176,131,.15);
  z-index: 30;
}
.side .logo {
  text-align: center;
  padding-bottom: 18px;
  margin-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.side .crest {
  width: 38px;
  height: 38px;
  margin: 0 auto 6px;
  border-radius: 9px;
  border: 1.5px solid var(--gold-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold-soft);
  background: rgba(139,111,62,.14);
}
.side .logo .name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 24px;
  letter-spacing: 4px;
  color: #fff;
  font-weight: 600;
  line-height: 1.1;
}
.side .logo .tag {
  font-size: 8.5px;
  letter-spacing: 2.5px;
  color: var(--gold-soft);
  text-transform: uppercase;
  margin-top: 4px;
}
.nav { display: flex; flex-direction: column; gap: 3px; }
.nav button {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: #c6ccd8;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: all .15s;
}
.nav button:hover { background: var(--navy-2); color: #fff; }
.nav button.on {
  background: var(--gold);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 12px rgba(139,111,62,.35);
}
.nav .ic { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nav .cnt {
  margin-left: auto;
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 99px;
  background: rgba(255,255,255,.1);
  color: #e2e6ee;
}
.nav button.on .cnt { background: rgba(0,0,0,.22); color: #fff; }

.tailor-box {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid rgba(255,255,255,.08);
}
.tailor-card {
  background: var(--navy-2);
  border: 1px solid rgba(201,176,131,.22);
  border-radius: 9px;
  padding: 10px;
}
.tailor-card select {
  width: 100%;
  background: transparent;
  color: #fff;
  border: 0;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  padding: 2px 0;
}
.tailor-card select option { background: var(--navy); color: #fff; }
.tailor-card select:focus { outline: none; }

/* Main Content */
.main {
  flex: 1;
  min-width: 0;
  padding: 20px 26px 120px;
  max-width: 1360px;
  margin: 0 auto;
}
.pagehead {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.pagehead h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--navy);
  margin-right: auto;
  letter-spacing: .2px;
}
.crumb {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-soft);
  cursor: pointer;
  border: 0;
  background: none;
  padding: 0;
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.crumb:hover { color: var(--gold); }

/* Buttons */
.btn {
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  border: 1px solid var(--line-2);
  background: #fff;
  color: var(--ink);
  transition: all .14s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn:hover { border-color: var(--gold); background: #fdfbf7; }
.btn.primary { background: var(--gold); border-color: var(--gold); color: #fff; }
.btn.primary:hover { background: var(--gold-strong); border-color: var(--gold-strong); }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.navy:hover { background: var(--navy-2); }
.btn.soft { background: var(--cream); border-color: var(--gold-soft); color: var(--gold-strong); }
.btn.soft:hover { background: #eadec8; }
.btn.danger { color: var(--danger); border-color: #e6c3be; }
.btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn.xs { padding: 3px 8px; font-size: 11px; }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--gold);
  margin: 0 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}
.card-title .spacer { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--ink-soft); }

/* Dashboard KPIs */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
  gap: 14px;
  margin-bottom: 16px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.stat .num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 34px;
  font-weight: 700;
  line-height: 1.05;
  color: var(--navy);
}
.stat .lbl {
  font-size: 11px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 5px;
  font-weight: 600;
}
.stat .sub {
  font-size: 11.5px;
  color: var(--ink-soft);
  margin-top: 4px;
}
.stat.gold .num { color: var(--gold); }
.stat.green .num { color: var(--green); }

/* Tables */
.searchrow { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.searchrow input, .searchrow select {
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  background: #fff;
}
.searchrow input { flex: 1; min-width: 220px; }
.searchrow input:focus, .searchrow select:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(139,111,62,.12);
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  font-size: 10.5px;
  letter-spacing: 1.1px;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: left;
  padding: 9px 10px;
  border-bottom: 1.5px solid var(--line-2);
  font-weight: 700;
  white-space: nowrap;
}
td {
  padding: 11px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  vertical-align: middle;
}
tr.rowlink { cursor: pointer; transition: background .12s; }
tr.rowlink:hover { background: #faf7f0; }

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--cream);
  color: var(--gold-strong);
  border: 1px solid var(--gold-soft);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Cormorant Garamond', serif;
  font-weight: 700;
  font-size: 15px;
  margin-right: 10px;
  flex-shrink: 0;
}
.cname { display: flex; align-items: center; font-weight: 600; color: var(--navy); }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .3px;
  padding: 3px 9px;
  border-radius: 100px;
  background: var(--cream);
  color: var(--gold-strong);
  border: 1px solid var(--gold-soft);
  white-space: nowrap;
}
.badge.s-New, .badge.s-Fabric { background: #eef2f7; color: #3b556e; border-color: #c3d2e0; }
.badge.s-Cutting, .badge.s-Stitching { background: var(--amber-bg); color: var(--amber); border-color: #e7cf9a; }
.badge.s-Fitting, .badge.s-Finishing { background: #f2ecfa; color: #5e4a8a; border-color: #d4c6ec; }
.badge.s-Ready { background: var(--green-bg); color: var(--green); border-color: #bcdcc7; }
.badge.s-Delivered { background: #efefec; color: #6d675c; border-color: #d8d2c4; }

.swatch-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 6px;
  background: #f8f5ee;
  border: 1px solid var(--line-2);
  color: var(--navy);
}
.swatch-dot {
  width: 11px;
  height: 11px;
  border-radius: 3px;
  border: 1px solid rgba(0,0,0,.2);
  flex-shrink: 0;
}

/* Grids & Forms */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.quad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; align-items: start; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; }
@media(max-width: 980px) { .duo, .trio, .quad { grid-template-columns: 1fr; } }
@media(max-width: 760px) { .grid2, .grid3 { grid-template-columns: 1fr; } }

.field { display: flex; flex-direction: column; gap: 4px; }
.field.full { grid-column: 1 / -1; }
.field label {
  font-size: 10.5px;
  letter-spacing: .9px;
  text-transform: uppercase;
  color: var(--ink-soft);
  font-weight: 700;
}
.field input, .field select, .field textarea {
  border: 1px solid var(--line-2);
  border-radius: var(--radius-sm);
  padding: 8px 11px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background: #fff;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(139,111,62,.12);
}
.field textarea { resize: vertical; min-height: 64px; }
.req::after { content: " *"; color: var(--danger); }

/* Measurement Header Bar */
.clientbar {
  display: flex;
  align-items: center;
  gap: 0;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--ink-soft);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 8px 14px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}
.clientbar .cell {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-right: 1px solid var(--line);
}
.clientbar .cell:first-child { padding-left: 2px; }
.clientbar .cell:last-child { border-right: 0; }
.clientbar b { color: var(--ink); }
.clientbar input, .clientbar select {
  border: 0;
  border-bottom: 1px dashed var(--line-2);
  background: transparent;
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  padding: 2px 4px;
}
.clientbar input:focus, .clientbar select:focus {
  outline: none;
  border-bottom-color: var(--gold);
  background: var(--gold-tint);
}

/* Quarter-inch helper bar */
.fraction-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  background: var(--navy);
  color: #e5e7eb;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 12px;
  font-size: 12px;
}
.fraction-bar .fbtn {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(201,176,131,.35);
  color: #fff;
  font-weight: 600;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 5px;
  cursor: pointer;
  transition: all .12s;
}
.fraction-bar .fbtn:hover { background: var(--gold); border-color: var(--gold); }

/* Tabs */
.tabs {
  display: flex;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow-x: auto;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.tab {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 12px 18px;
  border: 0;
  background: transparent;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
  transition: all .15s;
}
.tab:hover { color: var(--ink); }
.tab.on {
  color: var(--ink);
  border-bottom-color: var(--gold);
  background: linear-gradient(#fff, #faf7f0);
}
.panel { display: none; }
.panel.on { display: block; }
.all-view .panel { display: block !important; margin-bottom: 18px; }
.all-view #panel-summary { display: block !important; }

/* Measurement rows */
.mrow {
  display: grid;
  grid-template-columns: 1fr 112px 24px;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  border-bottom: 1px dashed rgba(216,210,196,.45);
}
.mrow:last-child { border-bottom: 0; }
.mrow .lbl { font-size: 13px; color: var(--ink); font-weight: 500; }
.mrow .lbl small { color: var(--ink-soft); font-weight: 400; font-size: 11px; }
.mrow input {
  font-size: 13.5px;
  font-weight: 600;
  text-align: center;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 6px 8px;
  width: 100%;
  background: #fff;
  color: var(--navy);
}
.mrow input:focus {
  outline: none;
  border-color: var(--gold);
  background: #fffdf9;
  box-shadow: 0 0 0 3px rgba(139,111,62,.15);
}
.mrow .unit { font-size: 11.5px; color: var(--ink-soft); }

/* Tick mark option rows */
.trow {
  display: grid;
  grid-template-columns: 138px 1fr;
  align-items: center;
  gap: 10px;
  padding: 5px 0;
}
.trow .lbl { font-size: 13px; font-weight: 500; color: var(--ink); }
.trow input[type=text], .trow input[type=number] {
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 7px 10px;
  font-size: 12.5px;
  width: 100%;
  font-family: 'Inter', sans-serif;
}
.trow input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(139,111,62,.12); }

.seg {
  display: flex;
  border: 1px solid var(--line-2);
  border-radius: 6px;
  overflow: hidden;
  background: #fff;
}
.seg button {
  flex: 1;
  border: 0;
  background: #fff;
  color: var(--ink-soft);
  font-size: 12px;
  font-weight: 600;
  padding: 7px 6px;
  cursor: pointer;
  border-right: 1px solid var(--line-2);
  transition: all .12s;
  white-space: nowrap;
}
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--ink); background: #faf7f2; }
.seg button.on {
  background: var(--cream);
  color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--gold);
  font-weight: 700;
}

/* Conditional Callout Box (Bow Leg / Knock Knees / Collar / Cuff) */
.stance-callout {
  background: #faf6ed;
  border: 1px solid var(--gold-soft);
  border-left: 3.5px solid var(--gold);
  border-radius: 7px;
  padding: 10px 12px;
  margin: 6px 0 10px;
  transition: all .2s;
}
.stance-callout.active-highlight {
  background: #fdf5e6;
  border-color: var(--gold);
  box-shadow: 0 2px 10px rgba(139,111,62,.14);
}
.stance-callout .sc-head {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--gold-strong);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Suit Style Matrix Table (matching screenshot) */
.suit-matrix {
  width: 100%;
  border-collapse: collapse;
  border: 1px solid var(--line-2);
  border-radius: 8px;
  overflow: hidden;
  font-size: 12px;
}
.suit-matrix th {
  background: #faf7f0;
  color: var(--ink);
  font-size: 11px;
  text-transform: none;
  letter-spacing: .2px;
  font-weight: 600;
  padding: 8px 8px;
  border: 1px solid var(--line);
  text-align: center;
}
.suit-matrix td {
  border: 1px solid var(--line);
  padding: 6px 6px;
  text-align: center;
}
.suit-matrix .m-opt {
  display: block;
  width: 100%;
  padding: 6px 6px;
  border-radius: 5px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
}
.suit-matrix .m-opt:hover { background: #faf6ed; }
.suit-matrix .m-opt.on {
  background: var(--cream);
  border-color: var(--gold);
  font-weight: 700;
  color: var(--navy);
}

/* Summary Docket */
.sum-block { margin-bottom: 16px; }
.sum-block h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px;
  font-weight: 700;
  color: var(--navy);
  border-bottom: 1.5px solid var(--navy);
  padding-bottom: 4px;
  margin-bottom: 8px;
}
.sum-rows {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 3px 24px;
}
.sum-rows .sr {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px dotted var(--line-2);
  padding: 5px 0;
  font-size: 12.5px;
}
.sum-rows .sr b { font-weight: 600; color: var(--navy); text-align: right; }

/* Modal & Toast */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(19,27,41,.52);
  backdrop-filter: blur(2px);
  z-index: 60;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 16px;
  overflow: auto;
}
.overlay.on { display: flex; }
.modal {
  background: var(--card);
  border-radius: var(--radius);
  max-width: 780px;
  width: 100%;
  padding: 24px;
  box-shadow: 0 24px 70px -20px rgba(19,27,41,.55);
  border: 1px solid var(--line);
}
.modal h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 25px;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 14px;
}
.modal .actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.actionbar {
  position: fixed;
  left: 218px;
  right: 0;
  bottom: 0;
  z-index: 40;
  background: rgba(246,244,239,.95);
  backdrop-filter: blur(8px);
  border-top: 1px solid var(--line-2);
  padding: 10px 26px;
  display: none;
}
.actionbar.on { display: block; }
.actionbar .inner {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;

function buildDefaultWorkflow(orderDate, currentStage, cutterName, karigarName) {
  const stageIdx = ORDER_STAGES.indexOf(currentStage || "New");
  const baseDate = orderDate ? new Date(orderDate + "T00:00:00") : new Date();
  let runningDate = new Date(baseDate);

  return WORKFLOW_TEMPLATE.map((step, idx) => {
    const isDone = idx < stageIdx || (currentStage === "Delivered" && idx <= stageIdx);
    const prevDate = new Date(runningDate);
    runningDate.setDate(runningDate.getDate() + step.defaultDays);
    const doneDateStr = isDone ? runningDate.toISOString().slice(0, 10) : "";
    const daysTaken = isDone ? Math.max(1, Math.round((runningDate - prevDate) / 86400000)) : "";
    let person = cutterName || "Susheel Racherla";
    if (step.key === "stitch_trial" || step.key === "finishing") person = karigarName || cutterName || "Ramesh Master";
    return {
      key: step.key,
      label: step.label,
      stage: step.stage,
      done: isDone,
      doneDate: doneDateStr,
      daysTaken: daysTaken,
      assignedTo: person,
      notes: ""
    };
  });
}

/* Bi-directional synchronization between Order Stage and the 9-step Workflow Sequence */
function syncOrderStageToWorkflow(o, newStage) {
  if (!o) return;
  const stage = ORDER_STAGES.includes(newStage) ? newStage : (o.status || "New");
  o.status = stage;

  if (!o.workflow || !Array.isArray(o.workflow) || o.workflow.length !== WORKFLOW_TEMPLATE.length) {
    o.workflow = buildDefaultWorkflow(o.date, stage, o.assignedTo, o.karigarAssigned);
  }

  const stageIdx = ORDER_STAGES.indexOf(stage);
  const baseDate = o.date ? new Date(o.date + "T00:00:00") : new Date();
  let runningDate = new Date(baseDate);

  o.workflow.forEach((step, idx) => {
    const template = WORKFLOW_TEMPLATE[idx] || step;
    step.label = template.label;
    step.stage = template.stage;

    // If stage is "Delivered", all 9 steps are done.
    // Otherwise, all steps prior to stageIdx are done, and stageIdx is the current "Next / In-Progress" step.
    const shouldBeDone = (stage === "Delivered") ? true : (idx < stageIdx);

    if (shouldBeDone) {
      step.done = true;
      if (!step.daysTaken || isNaN(parseFloat(step.daysTaken))) {
        step.daysTaken = template.defaultDays || 2;
      }
      runningDate.setDate(runningDate.getDate() + (parseFloat(step.daysTaken) || 1));
      if (!step.doneDate) {
        step.doneDate = runningDate.toISOString().slice(0, 10);
      } else {
        const parsedDone = new Date(step.doneDate + "T00:00:00");
        if (!isNaN(parsedDone)) runningDate = parsedDone;
      }
    } else {
      step.done = false;
      step.doneDate = "";
      step.daysTaken = "";
    }

    if (!step.assignedTo) {
      step.assignedTo = (step.key === "stitch_trial" || step.key === "finishing")
        ? (o.karigarAssigned || o.assignedTo || "Ramesh Master")
        : (o.assignedTo || "Susheel Racherla");
    }
  });

  const completedDays = o.workflow.reduce((acc, s) => acc + (s.done ? (parseFloat(s.daysTaken) || 0) : 0), 0);
  o.actualDays = Math.max(1, completedDays || 1);
}

/* Reconcile all cross-module data (Measurements <-> Orders <-> Clients <-> Swatches <-> Workflow) */
function reconcileAllData(dbObj) {
  if (!dbObj) return;
  if (!dbObj.measurements) dbObj.measurements = {};
  if (!dbObj.orders) dbObj.orders = {};
  if (!dbObj.clients) dbObj.clients = {};
  if (!dbObj.swatches) dbObj.swatches = {};

  // 1. Ensure every Measurement Docket has a corresponding Order and synced client posture
  Object.values(dbObj.measurements).forEach(m => {
    if (!m.orderNo) m.orderNo = makeOrderNo();
    const cl = dbObj.clients[m.clientId];
    if (cl && m.ticks) {
      const stance = m.ticks["Leg Stance"] || "";
      const bowIn = m.texts?.bowLegInches ? ` (${m.texts.bowLegInches}")` : "";
      const knockIn = m.texts?.knockKneesInches ? ` (${m.texts.knockKneesInches}")` : "";
      const shDown = m.ticks["Shoulder Down"] && m.ticks["Shoulder Down"] !== "Regular"
        ? `, ${m.ticks["Shoulder Down"]}${m.texts?.shoulderDownInches ? ` (${m.texts.shoulderDownInches}")` : ""}`
        : "";
      if (stance && (!cl.posture || cl.posture === "Standard posture")) {
        cl.posture = `${stance}${bowIn}${knockIn}${shDown}`;
      }
    }

    let linkedOrder = Object.values(dbObj.orders).find(o =>
      (o.orderNo || "").trim().toUpperCase() === (m.orderNo || "").trim().toUpperCase()
    );
    if (!linkedOrder) {
      const sw = Object.values(dbObj.swatches).find(s => s.code === m.swatchCode);
      const gList = (m.selectedGarments && m.selectedGarments.length)
        ? m.selectedGarments.map(x => `${(x.qty || 1) > 1 ? x.qty + "× " : ""}${x.name}`).join(" + ")
        : (m.estGarmentType || "2-Piece Bespoke Suit");
      const orderDate = m.date || new Date().toISOString().slice(0, 10);
      const tDate = new Date(orderDate + "T00:00:00");
      tDate.setDate(tDate.getDate() + 10);
      const dDate = new Date(orderDate + "T00:00:00");
      dDate.setDate(dDate.getDate() + 18);
      const fabEst = estimateFabricFromMeasurements(m, m.estGarmentType || "2-Piece Bespoke Suit", m.estSetCount || 1);

      const newOrderId = "o_sync_" + m.id;
      linkedOrder = {
        id: newOrderId,
        clientId: m.clientId,
        orderNo: m.orderNo,
        date: orderDate,
        trialDate: tDate.toISOString().slice(0, 10),
        delivery: dDate.toISOString().slice(0, 10),
        garments: gList,
        swatchCode: m.swatchCode || "SW-1042",
        fabric: sw ? `${sw.code} · ${sw.book} (${sw.colorName})` : (m.swatchCode || "Bespoke Cloth"),
        liningCode: "Bemberg Cupro",
        assignedTo: m.measuredBy || "Susheel Racherla",
        karigarAssigned: "Ramesh Master",
        status: "Cutting",
        estDays: 14,
        actualDays: 6,
        estHours: 28,
        hoursSpent: 10,
        painPointNote: "Synced with Measurement Docket",
        fabricMeters: fabEst.totalMeters,
        fabricRate: sw ? sw.costPerMeter : 8500,
        trimsCost: 4500,
        cutterCost: 6000,
        karigarCost: 9000,
        trialShippingCost: 1500,
        amount: 95000,
        advancePaid: 50000,
        notes: m.notes || "",
        workflow: buildDefaultWorkflow(orderDate, "Cutting", m.measuredBy || "Susheel Racherla", "Ramesh Master")
      };
      dbObj.orders[newOrderId] = linkedOrder;
    }
  });

  // 2. Ensure every Order has its workflow strictly aligned with its current status
  Object.values(dbObj.orders).forEach(o => {
    if (!o.workflow || !Array.isArray(o.workflow) || o.workflow.length !== WORKFLOW_TEMPLATE.length) {
      syncOrderStageToWorkflow(o, o.status || "New");
    } else {
      // Check if workflow done count matches o.status index; if out of sync, align it!
      const expectedDone = o.status === "Delivered" ? WORKFLOW_TEMPLATE.length : Math.max(0, ORDER_STAGES.indexOf(o.status));
      const currentDone = o.workflow.filter(s => s.done).length;
      if (expectedDone !== -1 && currentDone !== expectedDone) {
        syncOrderStageToWorkflow(o, o.status);
      }
    }
  });
}

let DB = load_();

function load_() {
  const seed = getSeedData();
  Object.values(seed.orders).forEach(o => {
    syncOrderStageToWorkflow(o, o.status);
  });

  try {
    const raw = localStorage.getItem(DB_KEY) || localStorage.getItem("modisto_bespoke_v5") || localStorage.getItem("modisto_bespoke_v4") || localStorage.getItem("modisto_bespoke_v3");
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object") {
        if (!parsed.clients || Object.keys(parsed.clients).length === 0) parsed.clients = seed.clients;
        if (!parsed.measurements || Object.keys(parsed.measurements).length === 0) parsed.measurements = seed.measurements;
        if (!parsed.orders || Object.keys(parsed.orders).length === 0) parsed.orders = seed.orders;
        if (!parsed.swatches || Object.keys(parsed.swatches).length === 0) parsed.swatches = seed.swatches;
        if (!parsed.employees || Object.keys(parsed.employees).length === 0) parsed.employees = seed.employees;
        parsed.settings = Object.assign({}, seed.settings, parsed.settings || {});

        Object.keys(parsed.clients).forEach(k => {
          if (seed.clients[k]) parsed.clients[k] = Object.assign({}, seed.clients[k], parsed.clients[k]);
        });
        Object.keys(parsed.swatches).forEach(k => {
          if (seed.swatches[k]) parsed.swatches[k] = Object.assign({}, seed.swatches[k], parsed.swatches[k]);
          if (parsed.swatches[k].minStockMeters === undefined) parsed.swatches[k].minStockMeters = 10;
          if (!parsed.swatches[k].vendorName) parsed.swatches[k].vendorName = parsed.swatches[k].mill || "Authorized Textile Distributor";
          if (!parsed.swatches[k].vendorContact) parsed.swatches[k].vendorContact = "+91 22 2600 4411 · orders@vendor.in";
        });
        Object.keys(parsed.orders).forEach(k => {
          if (seed.orders[k]) parsed.orders[k] = Object.assign({}, seed.orders[k], parsed.orders[k]);
          const ord = parsed.orders[k];
          if (!ord.trialDate) {
            const td = new Date((ord.date || "2026-10-20") + "T00:00:00");
            td.setDate(td.getDate() + 10);
            ord.trialDate = td.toISOString().slice(0, 10);
          }
        });

        reconcileAllData(parsed);
        try { localStorage.setItem(DB_KEY, JSON.stringify(parsed)); } catch (e) {}
        return parsed;
      }
    }
  } catch (e) {}
  reconcileAllData(seed);
  try { localStorage.setItem(DB_KEY, JSON.stringify(seed)); } catch (e) {}
  return seed;
}

function persist() {
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    updateNavCounts();
    renderSidebarBrandAndEmployees();
  } catch (e) {
    toast("Storage limit reached — export a JSON backup in Settings.");
  }
}

function ageFrom(bday) {
  if (!bday) return null;
  const b = new Date(bday + "T00:00:00"), n = new Date();
  let a = n.getFullYear() - b.getFullYear();
  if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
  return a;
}

/* ---------------- SMART MEASUREMENT-BASED FABRIC ESTIMATOR & STOCK CHECK ---------------- */
function estimateFabricFromMeasurements(mrec, garmentType, qtySets) {
  const m = (mrec && mrec.measures) || {};
  const t = (mrec && mrec.ticks) || {};
  const u = (mrec && mrec.unit) || "in";
  const toIn = val => {
    const n = parseFloat(val);
    if (isNaN(n) || n <= 0) return 0;
    return u === "cm" ? n / 2.54 : n;
  };

  // Extract key lengths & girths in inches (with sensible bespoke defaults if not yet typed)
  const outseam = toIn(m["Side Length (Outseam)"]) || 40.5;
  const suitLen = toIn(m["Suit Length Front"]) || 30.0;
  const suitSleeve = toIn(m["Full Sleeve Length"]) || toIn(m["Sleeve (Full)"]) || 24.75;
  const shirtLen = toIn(m["Shirt Length"]) || 29.5;
  const shirtSleeve = toIn(m["Sleeve (Full)"]) || 24.75;
  const chest = toIn(m["Chest (Suit)"]) || toIn(m["Chest"]) || 41.0;
  const waist = toIn(m["Waist"]) || 34.0;
  const wcLen = toIn(m["Waistcoat Front Length"]) || 25.5;
  const bandiLen = toIn(m["Bandi Front Length"]) || 27.5;
  const sherwaniLen = toIn(m["Sherwani Front Length"]) || 38.5;
  const kurtaLen = toIn(m["Kurta Length"]) || 41.5;

  // Calculate base meters per piece (assuming 58"-60" width suiting/shirting):
  // Trouser: (Outseam + 8" hem/turnup/allowance) / 39.37 -> plus extra if chest/waist > 42" or Gurkha/Pleats
  let trouserM = ((outseam + 9) / 39.37);
  if (waist > 38) trouserM += 0.25;
  if (t["Gurkha Trouser"] === "Y") trouserM += 0.15;
  if (t["Outfold at Bottom"] === "Y") trouserM += 0.10;
  trouserM = Math.max(1.25, Math.round(trouserM * 20) / 20);

  // Jacket / Suit Coat: ((Suit Length + Sleeve Length + 10" seam/facings/lapel) / 39.37)
  let jacketM = ((suitLen + suitSleeve + 11) / 39.37);
  if (chest >= 44) jacketM += 0.35;
  else if (chest >= 41) jacketM += 0.15;
  if (t["Suit Style"] === "Double Breasted") jacketM += 0.25;
  if (t["Patch Pockets"] === "Yes") jacketM += 0.10;
  jacketM = Math.max(1.85, Math.round(jacketM * 20) / 20);

  // Shirt: ((Shirt Length + Shirt Sleeve + 12" collar/cuffs/yoke) / 39.37)
  let shirtM = ((shirtLen + shirtSleeve + 13) / 39.37);
  if (chest >= 43) shirtM += 0.25;
  if (t["Cuff"] === "Double") shirtM += 0.10;
  shirtM = Math.max(1.75, Math.round(shirtM * 20) / 20);

  // Waistcoat / Bandi / Sherwani / Kurta
  const waistcoatM = Math.max(0.85, Math.round(((wcLen + 8) / 39.37) * 20) / 20);
  const bandiM = Math.max(1.25, Math.round(((bandiLen + 14) / 39.37) * 20) / 20);
  const sherwaniM = Math.max(2.90, Math.round(((sherwaniLen + suitSleeve + 16) / 39.37) * 20) / 20);
  const kurtaM = Math.max(2.40, Math.round(((kurtaLen + shirtSleeve + 12) / 39.37) * 20) / 20);

  const g = garmentType || "2-Piece Bespoke Suit";
  let singleSetMeters = 3.5;
  let breakdownText = "";

  if (g.includes("3-Piece")) {
    singleSetMeters = jacketM + trouserM + waistcoatM;
    breakdownText = `Jacket (${jacketM.toFixed(2)}m) + Trouser (${trouserM.toFixed(2)}m) + Waistcoat (${waistcoatM.toFixed(2)}m)`;
  } else if (g.includes("2-Piece") || g.includes("Tuxedo")) {
    singleSetMeters = jacketM + trouserM;
    breakdownText = `Jacket (${jacketM.toFixed(2)}m) + Trouser (${trouserM.toFixed(2)}m)`;
  } else if (g.includes("Shirt")) {
    singleSetMeters = shirtM;
    breakdownText = `Shirt Length ${shirtLen}" + Sleeve ${shirtSleeve}" + Collar/Cuff (${shirtM.toFixed(2)}m)`;
  } else if (g.includes("Trouser")) {
    singleSetMeters = trouserM;
    breakdownText = `Outseam ${outseam}" + Waist ${waist}" (${trouserM.toFixed(2)}m)`;
  } else if (g.includes("Sherwani")) {
    singleSetMeters = sherwaniM + trouserM;
    breakdownText = `Sherwani (${sherwaniM.toFixed(2)}m) + Bottom (${trouserM.toFixed(2)}m)`;
  } else if (g.includes("Bandi")) {
    singleSetMeters = bandiM;
    breakdownText = `Bandi Front ${bandiLen}" (${bandiM.toFixed(2)}m)`;
  } else if (g.includes("Waistcoat")) {
    singleSetMeters = waistcoatM;
    breakdownText = `Waistcoat Front ${wcLen}" (${waistcoatM.toFixed(2)}m)`;
  } else if (g.includes("Kurta")) {
    singleSetMeters = kurtaM + trouserM;
    breakdownText = `Kurta (${kurtaM.toFixed(2)}m) + Pyjama/Trouser (${trouserM.toFixed(2)}m)`;
  } else {
    singleSetMeters = jacketM;
    breakdownText = `Blazer / Jacket (${jacketM.toFixed(2)}m)`;
  }

  const sets = Math.max(1, parseFloat(qtySets) || 1);
  const totalMeters = Math.round(singleSetMeters * sets * 20) / 20;

  return {
    singleSetMeters: Math.round(singleSetMeters * 20) / 20,
    totalMeters,
    sets,
    breakdownText,
    perGarment: {
      suit2pc: Math.round((jacketM + trouserM) * 20) / 20,
      suit3pc: Math.round((jacketM + trouserM + waistcoatM) * 20) / 20,
      trouser: trouserM,
      shirt: shirtM,
      sherwani: sherwaniM,
      waistcoat: waistcoatM,
      bandi: bandiM
    }
  };
}

function getSwatchAllocationStatus(swatchCode, extraMeters = 0) {
  const sw = getSwatchByCode(swatchCode);
  if (!sw) return null;
  // Sum meters across all open (non-Delivered) orders using this swatch
  const openOrders = Object.values(DB.orders).filter(o =>
    o.status !== "Delivered" &&
    ((o.swatchCode || "").toUpperCase() === sw.code.toUpperCase() ||
     (o.fabric || "").toUpperCase().includes(sw.code.toUpperCase()))
  );
  const ordersMeters = openOrders.reduce((sum, o) => sum + (parseFloat(o.fabricMeters) || 0), 0);
  const requiredMeters = Math.max(ordersMeters, parseFloat(sw.allocatedMeters) || 0) + (parseFloat(extraMeters) || 0);
  const stockMeters = parseFloat(sw.stockMeters) || 0;
  const minStockMeters = parseFloat(sw.minStockMeters) || 0;
  const diff = Math.round((stockMeters - requiredMeters) * 100) / 100;
  const shortage = diff < 0 ? Math.abs(diff) : 0;
  const belowMin = stockMeters < minStockMeters;

  return {
    swatch: sw,
    stockMeters,
    minStockMeters,
    ordersMeters: Math.round(ordersMeters * 100) / 100,
    requiredMeters: Math.round(requiredMeters * 100) / 100,
    shortage,
    surplus: diff >= 0 ? diff : 0,
    isShort: shortage > 0,
    belowMin,
    needsReorder: shortage > 0 || belowMin,
    openOrderCount: openOrders.length,
    openOrderNos: openOrders.map(o => o.orderNo)
  };
}

function calcOrderEconomics(o) {
  const meters = parseFloat(o.fabricMeters) || 0;
  const rate = parseFloat(o.fabricRate) || 0;
  const fabricTotal = Math.round(meters * rate);
  const trims = parseFloat(o.trimsCost) || 0;
  const cutter = parseFloat(o.cutterCost) || 0;
  const karigar = parseFloat(o.karigarCost) || 0;
  const shipping = parseFloat(o.trialShippingCost) || 0;
  const totalCost = fabricTotal + trims + cutter + karigar + shipping;
  const quoted = parseFloat(o.amount) || 0;
  const advance = parseFloat(o.advancePaid) || 0;
  const balance = Math.max(0, quoted - advance);
  const profit = quoted - totalCost;
  const marginPct = quoted > 0 ? ((profit / quoted) * 100) : 0;
  const hours = parseFloat(o.hoursSpent) || 0;
  const estHours = parseFloat(o.estHours) || hours || 28;
  const estDays = parseFloat(o.estDays) || 14;
  const actualDays = parseFloat(o.actualDays) || estDays;
  const profitPerHr = hours > 0 ? Math.round(profit / hours) : 0;
  return {
    fabricTotal, trims, cutter, karigar, shipping,
    totalCost, quoted, advance, balance, profit, marginPct,
    hours, estHours, estDays, actualDays,
    daysVariance: actualDays - estDays,
    hoursVariance: hours - estHours,
    profitPerHr
  };
}

function getSwatchByCode(code) {
  if (!code) return null;
  const clean = code.trim().split(" ")[0].toUpperCase();
  return Object.values(DB.swatches).find(s => (s.code || "").toUpperCase() === clean) || null;
}

function renderSwatchBadge(code) {
  if (!code) return `<span style="color:var(--ink-soft)">—</span>`;
  const sw = getSwatchByCode(code);
  const hex = sw ? sw.colorHex : "#8b6f3e";
  const label = sw ? `${sw.code} · ${sw.colorName}` : code;
  const alloc = sw ? getSwatchAllocationStatus(sw.code) : null;
  const warnTag = (alloc && alloc.isShort)
    ? ` <span style="color:var(--danger);font-weight:800;" title="Short by ${alloc.shortage}m (Req: ${alloc.requiredMeters}m vs Stock: ${alloc.stockMeters}m)">⚠ -${alloc.shortage}m</span>`
    : "";
  return `<span class="swatch-pill"><span class="swatch-dot" style="background:${esc(hex)}"></span>${esc(label)}${warnTag}</span>`;
}

function stageBadgeClass(status) {
  if (!status) return "s-New";
  if (status.includes("Trial") || status.includes("Fitting")) return "s-Fitting";
  if (status.includes("Fabric")) return "s-Fabric";
  return "s-" + status.split(" ")[0];
}

/* ---------------- OPTIONAL SHEETS SYNC ---------------- */
async function pushToSheets(sheetName, row) {
  const url = DB.settings.appsScriptUrl;
  if (!url) return false;
  try {
    await fetch(url, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ _sheet: sheetName }, row))
    });
    return true;
  } catch (e) {
    return false;
  }
}

/* ============================================================================
   ROUTER & NAVIGATION
   ============================================================================ */
let VIEW = { name: "dashboard" };
let MREC = null;
let LAST_FOCUSED_INPUT = null;
let ACTIVE_MEASURE_TAB = "lower";
let ACTIVE_ORDER_STAGE_FILTER = "";
let SELECTED_TEAM_EMP_ID = "";

function go(name, params) {
  VIEW = Object.assign({ name }, params || {});
  if (name === "measure" && !MREC) {
    const latest = Object.values(DB.measurements).sort((a, b) => (b.savedAt || "").localeCompare(a.savedAt || ""))[0];
    if (latest) {
      MREC = JSON.parse(JSON.stringify(latest));
    } else {
      const firstClient = Object.values(DB.clients)[0];
      MREC = blankMeasure(firstClient ? firstClient.id : "");
    }
  }
  $$("#nav button").forEach(b => b.classList.toggle("on",
    b.dataset.v === name || (name === "client" && b.dataset.v === "clients")
  ));
  $("#actionbar").classList.toggle("on", name === "measure");
  updateNavCounts();
  renderSidebarBrandAndEmployees();
  render();
  window.scrollTo(0, 0);
}

$$("#nav button").forEach(b => b.onclick = () => go(b.dataset.v));

const sidebarLogoArea = $("#sidebarLogoArea");
if (sidebarLogoArea) {
  sidebarLogoArea.onclick = () => go("settings");
}

// Sync sidebar Tailor & Branch switcher
const tailorSel = $("#activeTailorSelect");
const branchSel = $("#activeBranchSelect");
if (tailorSel) {

}
if (branchSel) {

function render() {
  const m = $("#main");
  if (VIEW.name === "dashboard") m.innerHTML = vDashboard();
  else if (VIEW.name === "clients") m.innerHTML = vClients();
  else if (VIEW.name === "client") m.innerHTML = vClient(VIEW.id);
  else if (VIEW.name === "orders") m.innerHTML = vOrders();
  else if (VIEW.name === "team") m.innerHTML = vTeam();
  else if (VIEW.name === "swatches") m.innerHTML = vSwatches();
  else if (VIEW.name === "costing") m.innerHTML = vCosting();
  else if (VIEW.name === "settings") m.innerHTML = vSettings();
  else if (VIEW.name === "measure") {
    m.innerHTML = vMeasure();
    mountMeasure();
  }
  bindCommon();

function bindCommon() {
  $$("[data-go]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    if (el.dataset.act) return;
    const [name, id] = el.dataset.go.split("|");
    go(name, id ? { id } : null);
  });
  $$("[data-act]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const fn = ACTIONS[el.dataset.act];
    if (fn) fn(el.dataset.id);
  });
  $$("[data-stage]").forEach(sel => sel.onchange = e => {
    e.stopPropagation();
    const o = DB.orders[sel.dataset.stage];
    if (o) {
      syncOrderStageToWorkflow(o, sel.value);
      persist();
      pushToSheets("Orders", flatOrder(o));
      const doneCnt = (o.workflow || []).filter(s => s.done).length;
      toast(`${o.orderNo} moved to ${o.status} (${doneCnt}/9 sequence steps marked done)`);
      render();
    }
  });

  // Client Directory Filters & Sorting
  const refreshClientList = () => {
    const q = $("#clientSearch")?.value || "";
    const br = $("#clientBranchFilter")?.value || "";
    const country = $("#clientCountryFilter")?.value || "";
    const sortBy = $("#clientSortBy")?.value || "name";
    if ($("#clientRows")) {
      $("#clientRows").innerHTML = clientRows(q, br, country, sortBy);
      bindCommon();
    }
  };
  if ($("#clientSearch")) $("#clientSearch").oninput = refreshClientList;
  if ($("#clientBranchFilter")) $("#clientBranchFilter").onchange = refreshClientList;
  if ($("#clientCountryFilter")) $("#clientCountryFilter").onchange = refreshClientList;
  if ($("#clientSortBy")) $("#clientSortBy").onchange = refreshClientList;

  // Orders & Pipeline Filters + Clickable Top Stage Pills
  const os = $("#orderSearch");
  const osf = $("#orderStageFilter");
  if (os) {
    os.oninput = () => {
      $("#orderRows").innerHTML = orderRows(os.value, ACTIVE_ORDER_STAGE_FILTER);
      bindCommon();
    };
  }
  if (osf) {
    osf.onchange = () => {
      ACTIVE_ORDER_STAGE_FILTER = osf.value;
      render();
    };
  }
  $$("[data-stage-pill]").forEach(pill => {
    pill.onclick = () => {
      const clickedStage = pill.dataset.stagePill;
      ACTIVE_ORDER_STAGE_FILTER = (ACTIVE_ORDER_STAGE_FILTER === clickedStage) ? "" : clickedStage;
      if (VIEW.name === "dashboard") {
        go("orders");
      } else {
        render();
      }
    };
  });

  // Team Employee Click-to-View Jobs Drilldown
  $$("[data-select-emp]").forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const empId = el.dataset.selectEmp;
      SELECTED_TEAM_EMP_ID = (SELECTED_TEAM_EMP_ID === empId) ? "" : empId;
      render();
    };
  });

  // Inline Sequence Step Checkbox Toggle in Team/Order views
  $$("[data-QuickStepOrder]").forEach(chk => {
    chk.onchange = (e) => {
      e.stopPropagation();
      const ordId = chk.dataset.quicksteporder;
      const stepIdx = parseInt(chk.dataset.quickstepidx, 10);
      toggleOrderWorkflowStep(ordId, stepIdx, chk.checked);
    };
  });

  // Swatch Filters
  const sws = $("#swatchSearch");
  const swc = $("#swatchCatFilter");
  if (sws) {
    sws.oninput = () => { $("#swatchRows").innerHTML = swatchRows(sws.value, swc ? swc.value : ""); bindCommon(); };
  }
  if (swc) {
    swc.onchange = () => { $("#swatchRows").innerHTML = swatchRows(sws ? sws.value : "", swc.value); bindCommon(); };
  }

  // Logo Upload Input in Settings
  const logoInput = $("#logoUploadInput");
  if (logoInput) {
    logoInput.onchange = () => {
      const file = logoInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        DB.settings.logoDataUrl = reader.result;
        persist();
        toast("Modisto custom logo uploaded & applied to Print Sheets!");
        render();
      };
      reader.readAsDataURL(file);
    };
  }
}

   ============================================================================ */
function clientRows(q, branchFilter, countryFilter, sortBy) {
  q = (q || "").toLowerCase();
  const list = Object.values(DB.clients)
    .filter(c => {
      const matchQ = !q || (
        c.name + " " +
        (c.company || "") + " " +
        (c.designation || "") + " " +
        (c.phone || "") + " " +
        (c.email || "") + " " +
        (c.city || "") + " " +
        (c.country || "") + " " +
        (c.posture || "")
      ).toLowerCase().includes(q);
      const matchB = !branchFilter || (c.branch || "").includes(branchFilter);
      const matchCountry = !countryFilter || (c.country || "India").toLowerCase() === countryFilter.toLowerCase();
      return matchQ && matchB && matchCountry;
    });

  list.sort((a, b) => {
    if (sortBy === "city") return (a.city || "").localeCompare(b.city || "") || a.name.localeCompare(b.name);
    if (sortBy === "country") return (a.country || "").localeCompare(b.country || "") || (a.city || "").localeCompare(b.city || "");
    if (sortBy === "company") return (a.company || "zzz").localeCompare(b.company || "zzz") || a.name.localeCompare(b.name);
    if (sortBy === "spend") {
      const sa = Object.values(DB.orders).filter(o => o.clientId === a.id).reduce((s, o) => s + (parseFloat(o.amount) || 0), 0);
      const sb = Object.values(DB.orders).filter(o => o.clientId === b.id).reduce((s, o) => s + (parseFloat(o.amount) || 0), 0);
      return sb - sa;
    }
    return a.name.localeCompare(b.name);
  });

  if (!list.length) {
    return `<tr><td colspan="7"><div style="padding:18px;color:var(--ink-soft);font-style:italic;">No clients match your search criteria.</div></td></tr>`;
  }
  return list.map(c => {
    const nM = Object.values(DB.measurements).filter(m => m.clientId === c.id).length;
    const clientOrders = Object.values(DB.orders).filter(o => o.clientId === c.id);
    const totalSpend = clientOrders.reduce((s, o) => s + (parseFloat(o.amount) || 0), 0);
    const age = ageFrom(c.birthday);
    return `<tr class="rowlink" data-go="client|${c.id}">
      <td>
        <span class="cname">
          <span class="avatar">${esc(initials(c.name))}</span>
          <span>
            ${esc(c.name)}
            <div style="font-size:11.5px;color:var(--ink-soft);font-weight:400;">${esc(c.branch || "Mumbai · Andheri W")}${age != null ? ` · ${age} yrs` : ""}</div>
          </span>
        </span>
      </td>
      <td>
        <b>${esc(c.company || "—")}</b>
        <div style="font-size:11.5px;color:var(--gold-strong);font-weight:600;">${esc(c.designation || "")}</div>
      </td>
      <td>
        <b>${esc(c.city || "—")}</b>
        <div style="font-size:11.5px;color:var(--ink-soft);">${esc(c.country || "India")}</div>
      </td>
      <td>${esc(c.phone || "—")}<div style="font-size:11.5px;color:var(--ink-soft);">${esc(c.email || "")}</div></td>
      <td style="max-width:200px;font-size:12px;color:var(--ink-soft);">${esc(c.posture || "Standard posture")}</td>
      <td>
        <b>${nM}</b> docket${nM === 1 ? "" : "s"} · <b>${clientOrders.length}</b> order${clientOrders.length === 1 ? "" : "s"}
        <div style="color:var(--ink-soft);font-size:11.5px;">${fmtINR(totalSpend)}</div>
      </td>
      <td style="text-align:right;white-space:nowrap;">
        <button class="btn sm soft" data-act="newOrder" data-id="${c.id}">＋ Order</button>
        <button class="btn sm primary" data-act="measureFor" data-id="${c.id}">📏 Measure</button>
      </td>
    </tr>`;
  }).join("");
}

  }

  const projectedWithThis = swatchStatus ? Math.round((swatchStatus.stockMeters - fabEst.totalMeters) * 100) / 100 : null;

    <!-- ================= NOTES & QUICK ACTIONS ================= -->
    <div class="duo no-print" id="InteractiveNotesRow">
      <div class="card">

        <textarea class="field" style="width:100%;min-height:95px;border:1px solid var(--line-2);border-radius:7px;padding:10px 12px;font-size:13.5px;" id="mNotes" placeholder="Add special fitting notes, posture remarks, or Karigar instructions…">${esc(MREC.notes)}</textarea>
      </div>
      <div class="card">

          <button type="button" class="btn danger" id="qaClearAll" style="justify-content:center;">🗑 Clear All</button>
          <button type="button" class="btn primary full" id="qaPrintSheet" style="grid-column:1 / -1;justify-content:center;padding:11px;">
            🖨 Generate Condensed Measurement Sheet (${printMode === "2page" ? "2 Pages: Table + Visual Guide" : "1 Page Condensed"})
          </button>

    </div>

    <!-- ================= 6. CONDENSED PRINTABLE MEASUREMENT DOCKET (1 OR 2 PAGES) ================= -->
    <section class="panel ${ACTIVE_MEASURE_TAB === "summary" ? "on" : ""}" id="panel-summary">
      <div class="no-print" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:10px;background:#fff;padding:10px 14px;border-radius:8px;border:1px solid var(--line);">
        <div>
          <b style="color:var(--navy);">📄 Condensed Print Preview (A4 Portrait)</b>
          <span style="font-size:12px;color:var(--ink-soft);margin-left:8px;">
            Includes Modisto Logo, Atelier Contact Details, Customer Name &amp; Order ID on every page.
          </span>
        </div>
        <div style="display:flex;gap:8px;">
          <button type="button" class="btn sm ${printMode === "1page" ? "primary" : ""}" data-set-pmode="1page">1 Page (Condensed Table Only)</button>
          <button type="button" class="btn sm ${printMode === "2page" ? "primary" : ""}" data-set-pmode="2page">2 Pages (Table + Visual Guide Chart)</button>
          <button type="button" class="btn sm navy" onclick="window.print()">🖨 Print / Save PDF Now</button>
        </div>
      </div>
      <div id="printDocketContainer" class="docket-sheet-wrapper"></div>

  </div>`;
}

function updateLiveFabricEstimatorUI() {
  const fabEst = estimateFabricFromMeasurements(MREC, MREC.estGarmentType || "2-Piece Bespoke Suit", MREC.estSetCount || 1);
  const swatchStatus = getSwatchAllocationStatus(MREC.swatchCode, 0);
  const projectedWithThis = swatchStatus ? Math.round((swatchStatus.stockMeters - fabEst.totalMeters) * 100) / 100 : null;

  const sumEl = $("#fabricEstSummaryText");
  if (sumEl) {
    sumEl.innerHTML = `Est. Cloth Needed: <b style="font-size:14px;color:var(--navy);">${fabEst.totalMeters.toFixed(2)} m</b> <span style="color:var(--ink-soft);font-size:11.5px;">(${esc(fabEst.breakdownText)})</span>`;
  }
  const alertEl = $("#fabricStockCheckAlert");
  if (alertEl) {
    alertEl.innerHTML = `
      <span>
        Quick Reference for this Client:
        <b>2-Pc Suit:</b> ${fabEst.perGarment.suit2pc.toFixed(2)}m &nbsp;·&nbsp;
        <b>3-Pc Suit:</b> ${fabEst.perGarment.suit3pc.toFixed(2)}m &nbsp;·&nbsp;
        <b>Trouser:</b> ${fabEst.perGarment.trouser.toFixed(2)}m &nbsp;·&nbsp;
        <b>Shirt:</b> ${fabEst.perGarment.shirt.toFixed(2)}m &nbsp;·&nbsp;
        <b>Sherwani:</b> ${fabEst.perGarment.sherwani.toFixed(2)}m
      </span>
      <span>
        ${swatchStatus ? (
          (swatchStatus.isShort || fabEst.totalMeters > swatchStatus.stockMeters)
            ? `<span style="color:var(--danger);font-weight:700;">⚠ STOCK ALERT (${esc(swatchStatus.swatch.code)}): Need ${Math.max(fabEst.totalMeters, swatchStatus.requiredMeters)}m vs ${swatchStatus.stockMeters}m in stock — Short by ${Math.max(0, Math.round((Math.max(fabEst.totalMeters, swatchStatus.requiredMeters) - swatchStatus.stockMeters) * 100) / 100)}m!</span>`
            : `<span style="color:var(--green);font-weight:700;">✓ ${esc(swatchStatus.swatch.code)} In Stock: ${swatchStatus.stockMeters}m available (${projectedWithThis}m remaining after this ${fabEst.totalMeters}m order)</span>`
        ) : `<span style="color:var(--ink-soft);">Select a Swatch # to verify stock availability</span>`}
      </span>
    `;
  }
}

function mountMeasure() {
  const renderMList = (boxId, list) => {
    const box = $(boxId);
    if (!box) return;
    box.innerHTML = "";
    list.forEach(name => {
      const v = MREC.measures[name] != null ? MREC.measures[name] : "";
      const row = document.createElement("div");
      row.className = "mrow";
      row.innerHTML = `
        <span class="lbl">${esc(name)}</span>
        <input type="number" step="0.01" inputmode="decimal" placeholder="0.00" data-m="${esc(name)}" value="${esc(v)}" aria-label="${esc(name)}">
        <span class="unit unitlbl">${esc(MREC.unit)}</span>
      `;
      box.appendChild(row);
    });
  };

  const renderTList = (boxId, list) => {
    const box = $(boxId);
    if (!box) return;
    box.innerHTML = "";
    list.forEach(([name, options]) => {
      const row = document.createElement("div");
      row.className = "trow";
      row.innerHTML = `
        <span class="lbl">${esc(name)}</span>
        <span class="seg">
          ${options.map(o => `<button type="button" data-t="${esc(name)}" data-v="${esc(o)}" class="${MREC.ticks[name] === o ? "on" : ""}">${esc(o)}</button>`).join("")}
        </span>
      `;
      box.appendChild(row);
    });
  };

  renderMList("#m-lower", SCHEMA.lower.measures);
  renderTList("#t-lower", SCHEMA.lower.ticks);
  renderMList("#m-shirt", SCHEMA.shirt.measures);
  renderTList("#t-shirt", SCHEMA.shirt.ticks);
  renderMList("#m-upper", SCHEMA.upper.measures);
  renderTList("#t-upper", SCHEMA.upper.ticks);
  renderMList("#m-waistcoat", SCHEMA.waistcoat.measures);
  renderMList("#m-bandi", SCHEMA.bandi.measures);
  renderMList("#m-sherwani", SCHEMA.sherwani.measures);

  // Render Interactive Visual Guide (Tab 5)
  const renderInteractiveVGuide = () => {
    const vgBox = $("#interactiveVGuideGrid");
    if (!vgBox) return;
    vgBox.innerHTML = VISUAL_GUIDE_ITEMS.map(item => {
      let val = "";
      if (item.field === "__STANCE_INCHES__") {
        val = MREC.texts.bowLegInches || MREC.texts.knockKneesInches || "";
      } else {
        val = MREC.measures[item.field] || (item.altField ? MREC.measures[item.altField] : "") || "";
      }
      return `
        <div class="vg-card">
          <div class="vg-head"><span class="code">${esc(item.code)} -</span> ${esc(item.title)}</div>
          <div class="vg-svg">${item.svg}</div>
          <div class="vg-inp-row">
            <span class="ulbl unitlbl">${esc(MREC.unit)}</span>
            <input type="number" step="0.01" inputmode="decimal" placeholder="0.00" data-vg-field="${esc(item.field)}" data-vg-alt="${esc(item.altField || "")}" value="${esc(val)}">
          </div>
          <div class="vg-desc">${esc(item.desc)}</div>
        </div>
      `;
    }).join("");

    $$("input[data-vg-field]").forEach(inp => {
      inp.onfocus = () => {
        LAST_FOCUSED_INPUT = inp;
        const indicator = $("#focusedFieldLabel");
        if (indicator) indicator.innerHTML = `Active Visual Diagram: <b style="color:#fff;">${esc(inp.dataset.vgField === "__STANCE_INCHES__" ? "Bow/Knock Inches" : inp.dataset.vgField)}</b>`;
      };
      inp.oninput = () => {
        const f = inp.dataset.vgField;
        const v = inp.value.trim();
        if (f === "__STANCE_INCHES__") {
          if (MREC.ticks["Leg Stance"] === "Knock Knees") MREC.texts.knockKneesInches = v;
          else MREC.texts.bowLegInches = v;
          const bInp = $(`input[data-x="bowLegInches"]`);
          const kInp = $(`input[data-x="knockKneesInches"]`);
          if (bInp && MREC.ticks["Leg Stance"] !== "Knock Knees") bInp.value = v;
          if (kInp && MREC.ticks["Leg Stance"] === "Knock Knees") kInp.value = v;
        } else {
          if (v === "") delete MREC.measures[f];
          else MREC.measures[f] = v;
          const mainInp = $(`input[data-m="${CSS.escape(f)}"]`);
          if (mainInp) mainInp.value = v;
        }
        updateLiveFabricEstimatorUI();
        buildSummary();
      };
    });
  };
  renderInteractiveVGuide();

  // Sync segmented buttons & Suit Matrix buttons
  function syncTickUI(key) {
    const val = MREC.ticks[key];
    $$(`button[data-t="${CSS.escape(key)}"]`).forEach(b => b.classList.toggle("on", b.dataset.v === val));
    $$(`button[data-mat-t="${CSS.escape(key)}"]`).forEach(b => b.classList.toggle("on", b.dataset.matV === val));
    if (key === "Leg Stance") {
      const callout = $("#legStanceCallout");
      const badge = $("#stanceActiveBadge");
      if (badge) badge.textContent = val || "Regular";
      if (callout) callout.classList.toggle("active-highlight", val === "Bow Leg" || val === "Knock Knees");
    }
    updateLiveFabricEstimatorUI();
    buildSummary();
  }

  $$(".seg button[data-t]").forEach(b => b.onclick = () => {
    const key = b.dataset.t;
    const val = b.dataset.v;
    if (MREC.ticks[key] === val) delete MREC.ticks[key];
    else MREC.ticks[key] = val;
    syncTickUI(key);
  });

  $$("button[data-mat-t]").forEach(b => b.onclick = () => {
    const key = b.dataset.matT;
    const val = b.dataset.matV;
    MREC.ticks[key] = val;
    syncTickUI(key);
  });

  // Track focused measurement input for the Quarter-Inch Helper Bar
  $$("input[data-m], input[data-x='bowLegInches'], input[data-x='knockKneesInches']").forEach(inp => {
    inp.addEventListener("focus", () => {
      LAST_FOCUSED_INPUT = inp;
      const lbl = inp.dataset.m || inp.dataset.x;
      const indicator = $("#focusedFieldLabel");
      if (indicator) indicator.innerHTML = `Active field: <b style="color:#fff;">${esc(lbl)}</b>`;
    });
  });

  // Quarter-Inch Helper Bar buttons (.0, .25, .5, .75, -0.25, +0.25)
  $$(".fraction-bar .fbtn").forEach(btn => {
    btn.onclick = () => {
      if (!LAST_FOCUSED_INPUT) {
        toast("Tap any measurement box first, then click a quarter-inch button.");
        return;
      }
      let cur = parseFloat(LAST_FOCUSED_INPUT.value);
      if (isNaN(cur)) cur = 0;

      if (btn.dataset.frac !== undefined) {
        const whole = Math.floor(cur);
        const frac = parseFloat(btn.dataset.frac);
        const nextVal = whole + frac;
        LAST_FOCUSED_INPUT.value = nextVal.toString();
      } else if (btn.dataset.step !== undefined) {
        const delta = parseFloat(btn.dataset.step);
        const nextVal = Math.max(0, Math.round((cur + delta) * 100) / 100);
        LAST_FOCUSED_INPUT.value = nextVal.toString();
      }
      LAST_FOCUSED_INPUT.dispatchEvent(new Event("input"));
      LAST_FOCUSED_INPUT.focus();
    };
  });

  // Bind measurement inputs
  $$("input[data-m]").forEach(i => i.oninput = () => {
    if (i.value.trim() === "") delete MREC.measures[i.dataset.m];
    else MREC.measures[i.dataset.m] = i.value.trim();
    const vgInp = $(`input[data-vg-field="${CSS.escape(i.dataset.m)}"]`) || $(`input[data-vg-alt="${CSS.escape(i.dataset.m)}"]`);
    if (vgInp) vgInp.value = i.value.trim();
    updateLiveFabricEstimatorUI();
    buildSummary();
  });

  // Bind text/comment inputs
  $$("input[data-x], textarea[data-x]").forEach(i => i.oninput = () => {
    if (i.value.trim() === "") delete MREC.texts[i.dataset.x];
    else MREC.texts[i.dataset.x] = i.value.trim();
    if (i.dataset.x === "bowLegInches" || i.dataset.x === "knockKneesInches") {
      const vgStance = $(`input[data-vg-field="__STANCE_INCHES__"]`);
      if (vgStance) vgStance.value = i.value.trim();
    }
    buildSummary();
  });

  // Bind swatch sub-fields (both <select> and <input>)
  $$("[data-field]").forEach(i => {
    const handler = () => {
      MREC[i.dataset.field] = i.value.trim();
      buildSummary();
    };
    i.oninput = handler;
    i.onchange = handler;
  });

  // Multi-Garment Picker Cards inside Measurements
  $$("#measureGarmentPicker [data-gp-id]").forEach(btn => {
    btn.onclick = () => {
      const gid = btn.dataset.gpId;
      const gObj = GARMENT_CATALOG.find(x => x.id === gid);
      if (!gObj) return;
      if (!MREC.selectedGarments) MREC.selectedGarments = [];
      const idx = MREC.selectedGarments.findIndex(x => x.id === gid || x.name === gObj.name);
      if (idx >= 0) {
        MREC.selectedGarments.splice(idx, 1);
        btn.classList.remove("sel");
      } else {
        MREC.selectedGarments.push({ id: gObj.id, name: gObj.name, qty: 1, swatchCode: MREC.swatchCode || "SW-1042" });
        btn.classList.add("sel");
      }
      if (MREC.selectedGarments.length > 0) {
        MREC.estGarmentType = MREC.selectedGarments[0].name;
        const estGarSel = $("#estGarmentSelect");
        if (estGarSel) estGarSel.value = MREC.estGarmentType;
      }
      const badge = $("#selectedGarmentsSummaryBadge");
      if (badge) {
        badge.textContent = MREC.selectedGarments.length
          ? MREC.selectedGarments.map(g => `${g.qty || 1}× ${g.name}`).join(" + ")
          : "Click items below";
      }
      updateLiveFabricEstimatorUI();
      buildSummary();
    };
  });

  $("#mNotes").oninput = e => { MREC.notes = e.target.value; buildSummary(); };
  $("#mOrderNo").oninput = e => { MREC.orderNo = e.target.value; buildSummary(); };
  $("#mDate").onchange = e => { MREC.date = e.target.value; buildSummary(); };
  $("#mSwatchCode").onchange = e => {
    MREC.swatchCode = e.target.value.trim();
    updateLiveFabricEstimatorUI();
    buildSummary();
  };
  $("#mBy").onchange = e => {
    MREC.measuredBy = e.target.value;
    buildSummary();
  };
  $("#mUnit").onchange = e => {
    MREC.unit = e.target.value;
    $$(".unitlbl").forEach(u => u.textContent = MREC.unit);
    updateLiveFabricEstimatorUI();
    buildSummary();
  };

  // Start a New Measurement Docket directly from the Measurements page
  const startFreshDocketForCurrentClient = () => {
    const curClientId = MREC ? MREC.clientId : Object.keys(DB.clients)[0];
    MREC = blankMeasure(curClientId);
    render();
    mountMeasure();
    toast("Started new blank Measurement Docket (" + MREC.orderNo + ")");
  };
  if ($("#btnStartBlankMeasure")) $("#btnStartBlankMeasure").onclick = () => pickClientModal();
  if ($("#inlineNewDocketBtn")) $("#inlineNewDocketBtn").onclick = startFreshDocketForCurrentClient;
  if ($("#abNewMeasure")) $("#abNewMeasure").onclick = () => pickClientModal();

  // Fabric Estimator controls inside Measurements
  const estGarSel = $("#estGarmentSelect");
  const estSetInp = $("#estSetCountInput");
  if (estGarSel) {
    estGarSel.onchange = () => {
      MREC.estGarmentType = estGarSel.value;
      updateLiveFabricEstimatorUI();
      buildSummary();
    };
  }
  if (estSetInp) {
    estSetInp.oninput = () => {
      MREC.estSetCount = parseFloat(estSetInp.value) || 1;
      updateLiveFabricEstimatorUI();
      buildSummary();
    };
  }

  // Client Select + New Client direct creation from Measurements (Point 2)
  $("#mClientSelect").onchange = e => {
    if (e.target.value === "__NEW_CLIENT__") {
      e.target.value = MREC.clientId;
      clientModal(null, true);
      return;
    }
    MREC.clientId = e.target.value;
    render();
    mountMeasure();
  };
  if ($("#btnMeasureNewClient")) {
    $("#btnMeasureNewClient").onclick = () => clientModal(null, true);
  }
  if ($("#inlineNewClientBtn")) {
    $("#inlineNewClientBtn").onclick = () => clientModal(null, true);
  }

  // Toggle View Mode (All-in-One Scroll vs Tabs)
  const btnMode = $("#btnToggleViewMode");
  if (btnMode) {
    btnMode.onclick = () => {
      DB.settings.viewMode = DB.settings.viewMode === "all" ? "tabs" : "all";
      persist();
      render();
      mountMeasure();
    };
  }

  // Toggle 1-Page vs 2-Page Print Format WITHOUT jumping back to Tab 1 (Point 7 Fix!)
  const applyPrintModeInPlace = (newMode) => {
    DB.settings.printPagesMode = newMode;
    persist();
    const label = newMode === "2page" ? "2 Pages (Table + Visual Guide)" : "1 Page (Condensed Table Only)";
    if ($("#btnTogglePrintPages")) $("#btnTogglePrintPages").textContent = "🖨 Print Format: " + label;
    if ($("#tabBtnSummary")) $("#tabBtnSummary").textContent = `6. Condensed Print Sheet (${newMode === "2page" ? "2 Pages" : "1 Page"})`;
    if ($("#qaPrintSheet")) $("#qaPrintSheet").textContent = `🖨 Generate Condensed Measurement Sheet (${newMode === "2page" ? "2 Pages: Table + Visual Guide" : "1 Page Condensed"})`;
    $$("[data-set-pmode]").forEach(b => b.classList.toggle("primary", b.dataset.setPmode === newMode));
    buildSummary();
    toast(`Print Sheet set to ${label}`);
  };

  const btnPMode = $("#btnTogglePrintPages");
  if (btnPMode) {
    btnPMode.onclick = () => {
      const next = DB.settings.printPagesMode === "2page" ? "1page" : "2page";
      applyPrintModeInPlace(next);
    };
  }
  $$("[data-set-pmode]").forEach(b => b.onclick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    ACTIVE_MEASURE_TAB = "summary";
    applyPrintModeInPlace(b.dataset.setPmode);
  });

  // Section Tabs navigation (remembering ACTIVE_MEASURE_TAB)
  $$("#mtabs .tab").forEach(t => t.onclick = () => {
    ACTIVE_MEASURE_TAB = t.dataset.p;
    $$("#mtabs .tab").forEach(x => x.classList.toggle("on", x === t));
    if (DB.settings.viewMode === "all") {
      const target = $("#panel-" + t.dataset.p);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    } else {
      $$(".panel").forEach(p => p.classList.toggle("on", p.id === "panel-" + t.dataset.p));
    }
    buildSummary();
  });

  // Bind Save, Copy from Previous, Clear All, and Generate Condensed Print Sheet buttons
  const triggerPrintSheet = () => {
    buildSummary();
    window.print();
  };

  if ($("#abSave")) $("#abSave").onclick = saveMeasure;
  if ($("#topSaveMeasure")) $("#topSaveMeasure").onclick = saveMeasure;
  if ($("#abPrint")) $("#abPrint").onclick = triggerPrintSheet;
  if ($("#qaPrintSheet")) $("#qaPrintSheet").onclick = triggerPrintSheet;
  if ($("#abCopyPrev")) $("#abCopyPrev").onclick = () => ACTIONS.copyPrev();
  if ($("#topCopyPrev")) $("#topCopyPrev").onclick = () => ACTIONS.copyPrev();
  if ($("#qaCopyPrev")) $("#qaCopyPrev").onclick = () => ACTIONS.copyPrev();
  if ($("#abClearAll")) $("#abClearAll").onclick = () => ACTIONS.clearMeasure();
  if ($("#qaClearAll")) $("#qaClearAll").onclick = () => ACTIONS.clearMeasure();

  if ($("#status")) {
    $("#status").textContent = MREC.savedAt
      ? "Editing saved docket · " + MREC.orderNo
      : "New measurement docket — click Save Measurements when done";
  }

  buildSummary();
}

function buildSummary() {
  const container = $("#printDocketContainer");
  if (!container) return;

  const printMode = (DB.settings && DB.settings.printPagesMode) || "2page";
  const totalPages = printMode === "2page" ? 2 : 1;
  const u = MREC.unit;
  const fabEst = estimateFabricFromMeasurements(MREC, MREC.estGarmentType || "2-Piece Bespoke Suit", MREC.estSetCount || 1);

  const renderRows = (keys) => keys.map(k => {

function flatMeasure(m) {
  const c = DB.clients[m.clientId];
  const row = {
    "Order ID": m.orderNo,
    "Client": c ? c.name : "",
    "Phone": c ? c.phone || "" : "",
    "Date": m.date,
    "Unit": m.unit,
    "Primary Swatch": m.swatchCode || "",
    "Measured by": m.measuredBy,
    "Saved": m.savedAt
  };
  Object.assign(row, m.measures, m.ticks, m.texts);
  row["Notes"] = m.notes;
  return row;
}

function flatClient(c) {
  return {
    "Name": c.name,
    "Company": c.company || "",

}

function flatOrder(o) {
  const c = DB.clients[o.clientId];
  const ec = calcOrderEconomics(o);
  return {

    "Garments": o.garments,
    "Swatch Code": o.swatchCode || "",

    "Assigned Tailor": o.assignedTo || "",

    "Total Cost": ec.totalCost,
    "Amount": ec.quoted,
    "Net Profit": ec.profit,

  };
}

async function saveMeasure() {
  if (!Object.keys(MREC.measures).length && !Object.keys(MREC.ticks).length) {
    toast("Enter at least one measurement or option before saving.");
    return;
  }
  MREC.savedAt = new Date().toISOString();
  DB.measurements[MREC.id] = JSON.parse(JSON.stringify(MREC));

  // Sync Client Posture profile from this Measurement Docket
  const cl = DB.clients[MREC.clientId];
  if (cl && MREC.ticks) {
    const stance = MREC.ticks["Leg Stance"] || "Regular";
    const bowIn = MREC.texts?.bowLegInches ? ` (${MREC.texts.bowLegInches}")` : "";
    const knockIn = MREC.texts?.knockKneesInches ? ` (${MREC.texts.knockKneesInches}")` : "";
    const shDown = MREC.ticks["Shoulder Down"] && MREC.ticks["Shoulder Down"] !== "Regular"
      ? `, ${MREC.ticks["Shoulder Down"]}${MREC.texts?.shoulderDownInches ? ` (${MREC.texts.shoulderDownInches}")` : ""}`
      : "";
    cl.posture = `${stance}${bowIn}${knockIn}${shDown}`;
  }

  // Automatically create or update the corresponding Order in DB.orders so it always shows in Orders & Pipeline!
  const fabEst = estimateFabricFromMeasurements(MREC, MREC.estGarmentType || "2-Piece Bespoke Suit", MREC.estSetCount || 1);
  const gSummary = (MREC.selectedGarments && MREC.selectedGarments.length)
    ? MREC.selectedGarments.map(g => `${(g.qty || 1) > 1 ? g.qty + "× " : ""}${g.name}`).join(" + ")
    : (MREC.estGarmentType || "2-Piece Bespoke Suit");
  const sw = getSwatchByCode(MREC.swatchCode);

  let existingOrder = Object.values(DB.orders).find(o =>
    (o.orderNo || "").trim().toUpperCase() === (MREC.orderNo || "").trim().toUpperCase()
  );

  if (existingOrder) {
    existingOrder.clientId = MREC.clientId;
    existingOrder.swatchCode = MREC.swatchCode || existingOrder.swatchCode;
    if (sw) {
      existingOrder.fabric = `${sw.code} · ${sw.book} (${sw.colorName})`;
      existingOrder.fabricRate = sw.costPerMeter;
    }
    existingOrder.assignedTo = MREC.measuredBy || existingOrder.assignedTo;
    existingOrder.garments = gSummary || existingOrder.garments;
    existingOrder.fabricMeters = fabEst.totalMeters;
    syncOrderStageToWorkflow(existingOrder, existingOrder.status);
  } else {
    const ordDate = MREC.date || new Date().toISOString().slice(0, 10);
    const trialD = new Date(ordDate + "T00:00:00");
    trialD.setDate(trialD.getDate() + 10);
    const delivD = new Date(ordDate + "T00:00:00");
    delivD.setDate(delivD.getDate() + 18);
    const newOrdId = uid("o");
    const newOrd = {
      id: newOrdId,
      clientId: MREC.clientId,
      orderNo: MREC.orderNo,
      date: ordDate,
      trialDate: trialD.toISOString().slice(0, 10),
      delivery: delivD.toISOString().slice(0, 10),
      garments: gSummary,
      swatchCode: MREC.swatchCode || "SW-1042",
      fabric: sw ? `${sw.code} · ${sw.book} (${sw.colorName})` : (MREC.swatchCode || "Bespoke Cloth"),
      liningCode: "Bemberg Cupro",
      assignedTo: MREC.measuredBy || "Susheel Racherla",
      karigarAssigned: "Ramesh Master",
      status: "Cutting",
      estDays: 14,
      actualDays: 5,
      estHours: 28,
      hoursSpent: 6,
      painPointNote: "Measurement docket completed — pattern & cloth cutting in progress",
      fabricMeters: fabEst.totalMeters,
      fabricRate: sw ? sw.costPerMeter : 8500,
      trimsCost: 4500,
      cutterCost: 6000,
      karigarCost: 9000,
      trialShippingCost: 1500,
      amount: 95000,
      advancePaid: 50000,
      notes: MREC.notes || ""
    };
    syncOrderStageToWorkflow(newOrd, "Cutting");
    DB.orders[newOrdId] = newOrd;
  }

  persist();
  const pushed = await pushToSheets("Measurements", flatMeasure(MREC));
  toast(pushed ? "Saved & synced to Google Sheets" : "Measurement Docket, Client Posture & Order Pipeline synced (" + MREC.orderNo + ")");
  render();
  mountMeasure();
  if ($("#status")) $("#status").textContent = "Saved & Synced to Orders · " + MREC.orderNo + " at " + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function orderRows(q, stageFilter) {
  q = (q || "").toLowerCase();
  const list = Object.values(DB.orders)
    .map(o => Object.assign({ _c: DB.clients[o.clientId] }, o))
    .filter(o => {
      const matchQ = !q || ((o.orderNo || "") + " " + (o._c ? o._c.name : "") + " " + (o.garments || "") + " " + (o.swatchCode || "") + " " + (o.fabric || "") + " " + (o.assignedTo || "") + " " + (o.karigarAssigned || "")).toLowerCase().includes(q);
      const matchS = !stageFilter || o.status === stageFilter;
      return matchQ && matchS;
    })
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));

  if (!list.length) {
    return `<tr><td colspan="9"><div style="padding:18px;color:var(--ink-soft);font-style:italic;">No orders match your filter${stageFilter ? ` for stage "${esc(stageFilter)}"` : ""}.</div></td></tr>`;
  }
  return list.map(o => {
    const ec = calcOrderEconomics(o);
    const isOverDays = ec.daysVariance > 0;
    const wf = o.workflow || [];
    const doneSteps = wf.filter(s => s.done).length;
    const nextPending = wf.find(s => !s.done);
    return `<tr class="rowlink" data-act="openSequenceModal" data-id="${o.id}">
      <td>
        <b>${esc(o.orderNo)}</b>
        <div style="font-size:11.5px;color:var(--ink-soft);">Booked: ${fmtDate(o.date)}</div>
      </td>
      <td>
        <b>${esc(o._c ? o._c.name : "—")}</b>
        <div style="font-size:11.5px;color:var(--ink-soft);">✂ ${esc(o.assignedTo || "Susheel Racherla")}${o.karigarAssigned ? ` · 🧵 ${esc(o.karigarAssigned)}` : ""}</div>
      </td>
      <td>
        <div style="font-weight:600;">${esc(o.garments || "")}</div>
        <div style="font-size:11.5px;color:var(--ink-soft);">${esc(o.fabric || "")} (${esc(o.fabricMeters || 0)}m)</div>
      </td>
      <td>${renderSwatchBadge(o.swatchCode)}</td>
      <td style="white-space:nowrap;font-size:12px;">
        <div style="color:var(--gold-strong);font-weight:700;">📅 Trial: ${fmtDate(o.trialDate)}</div>
        <div style="font-weight:600;">🚚 Due: ${fmtDate(o.delivery)}</div>
        <div style="color:${isOverDays ? "var(--danger)" : "var(--green)"};font-weight:700;font-size:11px;">
          ${ec.actualDays}d / ${ec.estDays}d est ${isOverDays ? `(+${ec.daysVariance}d)` : `(On time)`}
        </div>
      </td>
      <td style="font-size:12px;">
        <div style="font-weight:700;color:var(--navy);">✓ ${doneSteps} of ${wf.length} steps done</div>
        <div style="font-size:11px;color:var(--ink-soft);">
          ${nextPending ? `Next: <b>${esc(nextPending.label.replace(/^\d+\.\s*/, ""))}</b> (${esc(nextPending.assignedTo)})` : `<span style="color:var(--green);font-weight:700;">All Steps Completed</span>`}
        </div>
      </td>
      <td onclick="event.stopPropagation()">
        <select data-stage="${o.id}" style="border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600;background:#faf7f0;" aria-label="Stage">
          ${ORDER_STAGES.map(s => `<option ${s === o.status ? "selected" : ""}>${s}</option>`).join("")}
        </select>
      </td>
      <td style="white-space:nowrap;font-size:12px;">
        <div>Quoted: <b>${fmtINR(ec.quoted)}</b></div>
        <div style="color:var(--ink-soft);">Cost: ${fmtINR(ec.totalCost)} · <span style="color:${ec.profit >= 0 ? "var(--green)" : "var(--danger)"};font-weight:700;">${fmtINR(ec.profit)}</span></div>
      </td>
      <td style="text-align:right;white-space:nowrap;" onclick="event.stopPropagation()">
        <button class="btn xs soft" data-act="openMeasureByOrder" data-id="${o.id}" title="Open Measurement Docket for this Order">📏 Docket</button>
        <button class="btn xs primary" data-act="openSequenceModal" data-id="${o.id}">📋 Sequence &amp; Done</button>
        <button class="btn xs" data-act="editOrder" data-id="${o.id}">✎ Edit</button>
      </td>
    </tr>`;
  }).join("");
}

function vTeam() {
  const employees = Object.values(DB.employees || {});
  const orders = Object.values(DB.orders);
  const activeOrders = orders.filter(o => o.status !== "Delivered");

  // Compute workload stats per employee
  const empStats = employees.map(emp => {
    const assignedOrders = activeOrders.filter(o =>
      (o.assignedTo || "").toLowerCase() === emp.name.toLowerCase() ||
      (o.karigarAssigned || "").toLowerCase() === emp.name.toLowerCase() ||
      (o.workflow || []).some(w => !w.done && (w.assignedTo || "").toLowerCase() === emp.name.toLowerCase())
    );
    const allHistoryOrders = orders.filter(o =>
      (o.assignedTo || "").toLowerCase() === emp.name.toLowerCase() ||

function swatchRows(q, catFilter) {
  q = (q || "").toLowerCase();
  const list = Object.values(DB.swatches)
    .filter(s => {
      const matchQ = !q || (s.code + " " + s.book + " " + s.colorName + " " + s.composition + " " + s.mill + " " + (s.vendorName || "") + " " + (s.notes || "")).toLowerCase().includes(q);
      const matchC = !catFilter || s.category === catFilter;
      return matchQ && matchC;
    })
    .sort((a, b) => a.code.localeCompare(b.code));

  if (!list.length) {
    return `<tr><td colspan="9"><div style="padding:18px;color:var(--ink-soft);font-style:italic;">No fabric swatches match your search.</div></td></tr>`;
  }
  return list.map(s => {
    const alloc = getSwatchAllocationStatus(s.code);
    const isShort = alloc && alloc.isShort;
    const belowMin = alloc && alloc.belowMin;
    return `
    <tr style="${(isShort || belowMin) ? "background:#fff5f5;" : ""}">
      <td>
        <span class="swatch-pill" style="font-size:12.5px;padding:4px 10px;">
          <span class="swatch-dot" style="width:14px;height:14px;background:${esc(s.colorHex || "#1b2838")}"></span>
          <b>${esc(s.code)}</b>
        </span>
      </td>
      <td>
        <b>${esc(s.book)}</b>
        <div style="font-size:11.5px;color:var(--ink-soft);">${esc(s.mill || "")} · ${esc(s.category || "Suiting")}</div>
      </td>
      <td>
        <div style="font-weight:700;color:var(--navy);">🏢 ${esc(s.vendorName || s.mill || "—")}</div>
        <div style="font-size:11px;color:var(--ink-soft);">${esc(s.vendorContact || "—")}</div>
      </td>
      <td>
        <div style="font-weight:600;">${esc(s.colorName)}</div>
        <div style="font-size:11.5px;color:var(--ink-soft);">${esc(s.composition)}</div>
      </td>
      <td style="font-weight:600;color:var(--navy);">${fmtINR(s.costPerMeter)} / m</td>
      <td style="white-space:nowrap;font-size:12px;">
        <div>In Stock: <b style="color:${belowMin ? "var(--danger)" : "var(--navy)"};">${esc(s.stockMeters)} m</b></div>
        <div style="font-size:11px;color:var(--gold-strong);">Min Alert: <b>${esc(s.minStockMeters ?? 10)} m</b></div>
        <div style="font-size:11px;color:var(--ink-soft);">Orders Req: <b>${alloc ? alloc.requiredMeters : 0} m</b>${alloc && alloc.openOrderNos.length ? ` (${alloc.openOrderNos.join(", ")})` : ""}</div>
      </td>
      <td>
        ${isShort
          ? `<span class="badge" style="background:var(--danger-bg);color:var(--danger);border-color:var(--danger);font-weight:700;">
               ⚠ SHORTAGE: Need ${alloc.requiredMeters}m vs ${alloc.stockMeters}m (-${alloc.shortage}m)
             </span>`
          : (belowMin
            ? `<span class="badge" style="background:var(--amber-bg);color:var(--amber);border-color:#e7cf9a;font-weight:700;">
                 🔔 BELOW MIN (${s.stockMeters}m &lt; ${s.minStockMeters}m) — Order from Vendor
               </span>`
            : `<span class="badge s-Ready">
                 ✓ Sufficient (${alloc ? alloc.surplus : s.stockMeters}m free)
               </span>`
          )
        }
      </td>
      <td style="max-width:190px;font-size:11.5px;color:var(--ink-soft);">${esc(s.notes || "—")}</td>

        <button class="btn sm" data-act="editSwatch" data-id="${s.id}">✎ Edit / Vendor</button>
      </td>
    </tr>
  `;
  }).join("");
}
