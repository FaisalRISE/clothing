<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modisto — Atelier Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#131b29;
  --navy-2:#1c2739;
  --gold:#8b6f3e;
  --gold-strong:#755c2f;
  --gold-soft:#c9b083;
  --cream:#f3ecdd;
  --bg:#f6f4ef;
  --card:#ffffff;
  --line:#e7e2d7;
  --line-2:#d8d2c4;
  --ink:#26221c;
  --ink-soft:#6d675c;
  --green:#2e6b46;
  --danger:#9b3b2e;
  --radius:10px;
  --radius-sm:7px;
  --shadow:0 1px 2px rgba(20,25,40,.05), 0 10px 28px -20px rgba(20,25,40,.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{display:flex;min-height:100vh;}
button{font-family:'Inter',sans-serif;}
h1,h2,h3{margin:0;}
.serif{font-family:'Cormorant Garamond',serif;}

/* ================= sidebar ================= */
.side{
  width:190px;background:var(--navy);color:#c6ccd8;flex-shrink:0;
  display:flex;flex-direction:column;padding:24px 14px;gap:4px;
  position:sticky;top:0;height:100vh;
}
.side .logo{text-align:center;margin-bottom:26px;}
.side .logo img{width:120px;max-width:100%;}
.side .logo .name{font-family:'Cormorant Garamond',serif;font-size:24px;letter-spacing:4px;color:#fff;font-weight:600;}
.side .logo .tag{font-size:8.5px;letter-spacing:2.6px;color:var(--gold-soft);text-transform:uppercase;margin-top:3px;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border:0;color:#c6ccd8;font-size:13.5px;font-weight:500;
  padding:11px 13px;border-radius:8px;cursor:pointer;transition:all .15s;
}
.nav button:hover{background:var(--navy-2);color:#fff;}
.nav button.on{background:var(--gold);color:#fff;}
.nav .ic{width:18px;text-align:center;}
.side .foot{margin-top:auto;font-size:10.5px;color:#6f7889;text-align:center;line-height:1.6;}

/* ================= main ================= */
.main{flex:1;min-width:0;padding:22px 28px 120px;max-width:1180px;}
.pagehead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.pagehead h1{font-size:22px;font-weight:700;margin-right:auto;}
.crumb{font-size:13px;color:var(--ink-soft);cursor:pointer;border:0;background:none;padding:0;}
.crumb:hover{color:var(--gold);}

.btn{
  font-size:13px;font-weight:600;cursor:pointer;border-radius:var(--radius-sm);
  padding:9px 15px;border:1px solid var(--line-2);background:#fff;color:var(--ink);
  transition:all .15s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
}
.btn:hover{border-color:var(--gold);}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff;}
.btn.primary:hover{background:var(--gold-strong);}
.btn.ghostnavy{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.danger{color:var(--danger);}
.btn.sm{padding:6px 11px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);}
.card-title{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin:0 0 14px;}
.card-title .spacer{margin-left:auto;letter-spacing:0;text-transform:none;}

/* ================= dashboard ================= */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);}
.stat .num{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:600;line-height:1;color:var(--navy);}
.stat .lbl{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);margin-top:6px;}
.stat.gold .num{color:var(--gold);}

/* ================= lists / tables ================= */
.searchrow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.searchrow input{
  flex:1;min-width:200px;border:1px solid var(--line-2);border-radius:var(--radius-sm);
  padding:10px 13px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;
}
.searchrow input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(139,111,62,.12);}
table{width:100%;border-collapse:collapse;}
th{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink-soft);
  text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--line-2);}
td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
tr.rowlink{cursor:pointer;transition:background .12s;}
tr.rowlink:hover{background:#faf7f0;}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--cream);color:var(--gold-strong);
  display:inline-flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16px;margin-right:10px;flex-shrink:0;
}
.cname{display:flex;align-items:center;font-weight:600;}
.badge{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.4px;
  padding:3px 10px;border-radius:100px;background:var(--cream);color:var(--gold-strong);
  border:1px solid var(--gold-soft);
}
.badge.s-New{background:#eef2f7;color:#3b556e;border-color:#c3d2e0;}
.badge.s-Cutting,.badge.s-Stitching{background:#fdf3e2;color:#8a6116;border-color:#e7cf9a;}
.badge.s-Fitting{background:#f2ecfa;color:#5e4a8a;border-color:#d4c6ec;}
.badge.s-Ready{background:#e9f4ec;color:var(--green);border-color:#bcdcc7;}
.badge.s-Delivered{background:#efefec;color:#6d675c;border-color:#d8d2c4;}
.empty{color:var(--ink-soft);font-style:italic;font-size:13.5px;padding:14px 4px;}

/* ================= forms ================= */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:5px;}
.field.full{grid-column:1 / -1;}
.field label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);font-weight:600;}
.field input,.field select,.field textarea{
  border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:9px 12px;
  font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:#fff;width:100%;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(139,111,62,.12);}
.field textarea{resize:vertical;min-height:70px;}
.req::after{content:" *";color:var(--danger);}

/* ================= client profile ================= */
.profilehead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;}
.profilehead .avatar{width:64px;height:64px;font-size:30px;margin:0;}
.profilehead .who{flex:1;min-width:220px;}
.profilehead .who h2{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;line-height:1.1;}
.profilehead .meta{font-size:13px;color:var(--ink-soft);margin-top:5px;line-height:1.7;}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 26px;margin-top:8px;}
.kv .sr{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line-2);
  padding:6px 0;font-size:13px;}
.kv .sr b{font-weight:600;text-align:right;}

/* ================= measurement module ================= */
.clientbar{display:flex;align-items:center;gap:0;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
.clientbar .cell{display:flex;align-items:center;gap:7px;padding:4px 14px;border-right:1px solid var(--line-2);}
.clientbar .cell:first-child{padding-left:0;}
.clientbar .cell:last-child{border-right:0;}
.clientbar b{color:var(--ink);}
.clientbar input,.clientbar select{
  border:0;border-bottom:1px dashed var(--line-2);background:transparent;font-family:'Inter',sans-serif;
  font-size:13.5px;font-weight:600;color:var(--ink);padding:2px;}
.clientbar input:focus,.clientbar select:focus{outline:none;border-bottom-color:var(--gold);}

.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  overflow-x:auto;margin-bottom:16px;box-shadow:var(--shadow);}
.tab{font-size:13.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;padding:13px 20px;
  border:0;background:transparent;white-space:nowrap;border-bottom:3px solid transparent;transition:all .15s;}
.tab:hover{color:var(--ink);}
.tab.on{color:var(--ink);border-bottom-color:var(--gold);background:linear-gradient(#fff,#faf7f0);}
.panel{display:none;}
.panel.on{display:block;}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
@media(max-width:920px){.duo,.trio{grid-template-columns:1fr;}}

.mrow{display:grid;grid-template-columns:1fr 104px 24px;align-items:center;gap:10px;padding:4px 0;}
.mrow .lbl{font-size:13.5px;}
.mrow input{font-size:14px;font-weight:600;text-align:center;border:1px solid var(--line-2);
  border-radius:var(--radius-sm);padding:7px;width:100%;}
.mrow input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(139,111,62,.12);}
.mrow .unit{font-size:12px;color:var(--ink-soft);}
.trow{display:grid;grid-template-columns:132px 1fr;align-items:center;gap:12px;padding:5px 0;}
.trow .lbl{font-size:13.5px;}
.trow input[type=text]{border:1px solid var(--line-2);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;width:100%;font-family:'Inter',sans-serif;}
.trow input[type=text]:focus{outline:none;border-color:var(--gold);}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--radius-sm);overflow:hidden;}
.seg button{flex:1;border:0;background:#fff;color:var(--ink-soft);font-size:12.5px;font-weight:600;
  padding:8px 5px;cursor:pointer;border-right:1px solid var(--line-2);transition:all .12s;white-space:nowrap;}
.seg button:last-child{border-right:0;}
.seg button:hover{color:var(--ink);}
.seg button.on{background:var(--cream);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold);}
textarea.notes{width:100%;min-height:88px;resize:vertical;border:1px solid var(--line-2);
  border-radius:var(--radius-sm);padding:11px 12px;font-family:'Inter',sans-serif;font-size:13.5px;}
textarea.notes:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(139,111,62,.12);}

.sum-block{margin-bottom:16px;}
.sum-block h3{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;
  border-bottom:1.5px solid var(--navy);padding-bottom:5px;margin-bottom:7px;}
.sum-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:3px 26px;}
.sum-rows .sr{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line-2);
  padding:5px 0;font-size:13px;}
.sum-rows .sr b{font-weight:600;}

/* ================= modal ================= */
.overlay{position:fixed;inset:0;background:rgba(19,27,41,.45);z-index:60;display:none;
  align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
.overlay.on{display:flex;}
.modal{background:var(--card);border-radius:var(--radius);max-width:640px;width:100%;
  padding:24px;box-shadow:0 24px 70px -20px rgba(19,27,41,.5);}
.modal h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;margin-bottom:16px;}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* ================= action bar / toast ================= */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(246,244,239,.94);
  backdrop-filter:blur(8px);border-top:1px solid var(--line-2);padding:11px 24px;display:none;}
.actionbar.on{display:block;}
.actionbar .inner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1180px;margin:0 auto;}
.status{font-size:12.5px;color:var(--ink-soft);margin-right:auto;}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--navy);color:#fff;font-size:13px;padding:10px 18px;border-radius:100px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:70;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ================= responsive & print ================= */
@media(max-width:760px){
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;
    padding:12px 14px;gap:8px;overflow-x:auto;}
  .side .logo{margin:0 10px 0 0;}
  .side .logo .name{font-size:17px;letter-spacing:2px;}
  .side .logo .tag{display:none;}
  .nav{flex-direction:row;}
  .nav button{padding:8px 10px;font-size:12.5px;}
  .nav .ic{display:none;}
  .side .foot{display:none;}
  .app{flex-direction:column;}
  .main{padding:14px 14px 130px;}
  .trow{grid-template-columns:1fr;gap:4px;}
}
@media print{
  body{background:#fff;}
  .side,.tabs,.actionbar,.pagehead .btn,.searchrow,.toast{display:none !important;}
  .main{padding:0;max-width:100%;}
  .card{box-shadow:none;border-color:#bbb;}
  #printArea .panel{display:block !important;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="logo">
      <div class="name">MODISTO</div>
      <div class="tag">Be spoke. Be you.</div>
    </div>
    <nav class="nav" id="nav">
      <button data-v="dashboard" class="on"><span class="ic">▦</span>Dashboard</button>
      <button data-v="clients"><span class="ic">👤</span>Clients</button>
      <button data-v="orders"><span class="ic">🧾</span>Orders</button>
      <button data-v="settings"><span class="ic">⚙</span>Settings</button>
    </nav>
    <div class="foot">Atelier Console<br>Since 1969 · Mumbai &amp; London</div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="actionbar" id="actionbar">
  <div class="inner">
    <span class="status" id="status">Draft auto-saves on this device</span>
    <button class="btn" id="abPrint">Generate Sheet</button>
    <button class="btn primary" id="abSave">Save Measurements</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   MODISTO ATELIER CONSOLE
   Client database · measurement module · order history
   Data lives in this browser (localStorage). Use Settings →
   Export for backups, and optionally connect Google Sheets.
   ============================================================ */

/* ---------------- schema ---------------- */
const SCHEMA = {
  lower: {
    title:"Lower Body Measurements",
    measures:["Front","Outseam","Back","Inseam","Waist","Hip","Bottom","Thigh","Abdomen"],
    ticks:[
      ["Leg Stance",["Bow Leg","Knock Knees","Regular"]],
      ["Forward Stance",["Y","N"]],
      ["Abdomen (option)",["Y","N"]],
      ["Back Pockets",["1","2"]],
      ["Watch Pockets",["Y","N"]],
      ["Pleets",["Single","Double","No Pleets"]],
      ["Gurkha Trouser",["Y","N"]],
      ["Outfold at Bottom",["Y","N"]]
    ]
  },
  upper: {
    title:"Upper Body Measurements",
    measures:["Kurta Length","Suit Length Front","Suit Length Back","Shirt Length","Chest","Belly",
      "Hip (Upper)","Shoulder","Full Sleeve Length","Half Sleeve Length","Shirt Cuff","Suit Cuff",
      "Neck","AC","CB","Arch","Natural Waist","Arm Hole","4th Measurement"],
    ticks:[
      ["Pocket",["Yes","No"]],
      ["Hunchback",["Yes","No"]],
      ["Biceps",["Yes","No"]],
      ["Cuff",["Single","Double","Cocktail"]],
      ["Darts",["Yes","No"]],
      ["Initials",["Yes","No"]],
      ["Collar Type",["Pointed","Cutway","Chinese"]]
    ]
  },
  waistcoat:{title:"Waistcoat",measures:["Waistcoat Front Length","Waistcoat Back Length","Waistcoat Belly"]},
  bandi:{title:"Bandi",measures:["Bandi Front Length","Bandi Back Length"]},
  sherwani:{title:"Sherwani",measures:["Sherwani Front Length","Sherwani Back Length"]},
  style:{
    ticks:[
      ["Suit Style",["1 Button","2 Button","3 Button"]],
      ["Vents",["Side Vents","Centre Vent","No Vents"]],
      ["Lapel",["Notch","Peak","Shawl","Peak Shawl"]],
      ["Patch Pockets",["Yes","No"]],
      ["Slant Pockets",["Yes","No"]],
      ["Ticket Pocket",["Yes","No"]]
    ],
    texts:[["Initials in Suit"]]
  }
};
const ORDER_STAGES = ["New","Cutting","Stitching","Fitting","Ready","Delivered"];
const GARMENT_OPTIONS = ["Suit","Sherwani","Bandhgalla","Bandi","Waistcoat","Shirt","Trousers","Kurta-Pyjama","Blazer","Other"];

/* ---------------- storage ---------------- */
const DB_KEY = "modisto_console_v1";
let DB = load_();
function load_(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { clients:{}, measurements:{}, orders:{}, settings:{ appsScriptUrl:"", measuredByDefault:"" } };
}
function persist(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){ toast("Storage full — export a backup."); } }
function uid(p){ return p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ---------------- helpers ---------------- */
const $  = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>Array.from(el.querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = d => d ? new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const initials = n => (n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), 2600);
}
function ageFrom(bday){
  if(!bday) return null;
  const b = new Date(bday+"T00:00:00"), n = new Date();
  let a = n.getFullYear()-b.getFullYear();
  if(n.getMonth()<b.getMonth() || (n.getMonth()===b.getMonth() && n.getDate()<b.getDate())) a--;
  return a;
}
function makeOrderNo(){
  const y = new Date().getFullYear();
  const count = Object.keys(DB.orders).length + Object.keys(DB.measurements).length + 1000;
  return "#ORD-"+y+"-"+(count+Math.floor(Math.random()*90));
}

/* ---------------- sheets sync (optional) ---------------- */
async function pushToSheets(sheetName, row){
  const url = DB.settings.appsScriptUrl;
  if(!url) return false;
  try{
    await fetch(url, { method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ _sheet: sheetName }, row)) });
    return true;
  }catch(e){ return false; }
}

/* ============================================================
   ROUTER
   ============================================================ */
let VIEW = { name:"dashboard" };
function go(name, params){
  VIEW = Object.assign({ name }, params||{});
  $$("#nav button").forEach(b => b.classList.toggle("on",
    b.dataset.v===name || (name==="client"&&b.dataset.v==="clients") || (name==="measure"&&b.dataset.v==="clients")));
  $("#actionbar").classList.toggle("on", name==="measure");
  render();
  window.scrollTo(0,0);
}
$$("#nav button").forEach(b => b.onclick = ()=>go(b.dataset.v));

function render(){
  const m = $("#main");
  if(VIEW.name==="dashboard") m.innerHTML = vDashboard();
  else if(VIEW.name==="clients") m.innerHTML = vClients();
  else if(VIEW.name==="client") m.innerHTML = vClient(VIEW.id);
  else if(VIEW.name==="orders") m.innerHTML = vOrders();
  else if(VIEW.name==="settings") m.innerHTML = vSettings();
  else if(VIEW.name==="measure"){ m.innerHTML = vMeasure(); mountMeasure(); }
  bindCommon();
}
function bindCommon(){
  $$("[data-go]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const [name, id] = el.dataset.go.split("|");
    if(el.dataset.act) return; // handled elsewhere
    go(name, id?{id}:null);
  });
  $$("[data-act]").forEach(el => el.onclick = e => { e.stopPropagation(); ACTIONS[el.dataset.act](el.dataset.id); });
  $$("[data-stage]").forEach(sel => sel.onchange = () => {
    const o = DB.orders[sel.dataset.stage];
    if(o){ o.status = sel.value; persist(); pushToSheets("Orders", flatOrder(o)); toast("Order marked "+sel.value); render(); }
  });
  const cs = $("#clientSearch");
  if(cs){ cs.oninput = () => { $("#clientRows").innerHTML = clientRows(cs.value); bindCommon(); }; cs.focus(); }
  const os = $("#orderSearch");
  if(os){ os.oninput = () => { $("#orderRows").innerHTML = orderRows(os.value); bindCommon(); }; }
}

/* ============================================================
   VIEWS
   ============================================================ */
function counts(){

function mountMeasure(){
  const slug = s => s.replace(/\W+/g,"_");
  const rm = (boxId, list) => {
    const box = $(boxId); box.innerHTML = "";
    list.forEach(name => {
      const v = MREC.measures[name] || "";
      const row = document.createElement("div"); row.className = "mrow";
      row.innerHTML = `<span class="lbl">${esc(name)}</span>
        <input type="number" step="0.05" inputmode="decimal" data-m="${esc(name)}" value="${esc(v)}">
        <span class="unit unitlbl">${esc(MREC.unit)}</span>`;
      box.appendChild(row);
    });
  };
  const rt = (boxId, list) => {
    const box = $(boxId);
    list.forEach(([name, options]) => {
      const row = document.createElement("div"); row.className = "trow";
      row.innerHTML = `<span class="lbl">${esc(name)}</span><span class="seg">`+
        options.map(o=>`<button type="button" data-t="${esc(name)}" data-v="${esc(o)}" class="${MREC.ticks[name]===o?"on":""}">${esc(o)}</button>`).join("")+
        `</span>`;
      box.appendChild(row);
    });
  };
  rm("#m-lower", SCHEMA.lower.measures); rt("#t-lower", SCHEMA.lower.ticks);
  rm("#m-upper", SCHEMA.upper.measures); rt("#t-upper", SCHEMA.upper.ticks);
  rm("#m-waistcoat", SCHEMA.waistcoat.measures);
  rm("#m-bandi", SCHEMA.bandi.measures);
  rm("#m-sherwani", SCHEMA.sherwani.measures);
  rt("#t-style", SCHEMA.style.ticks);
  SCHEMA.style.texts.forEach(([name]) => {
    const row = document.createElement("div"); row.className = "trow";
    row.innerHTML = `<span class="lbl">${esc(name)}</span>
      <input type="text" data-x="${esc(name)}" value="${esc(MREC.texts[name]||"")}" placeholder="Type text">`;
    $("#t-style").appendChild(row);
  });

  // interactions
  $$(".seg button").forEach(b => b.onclick = () => {
    const was = b.classList.contains("on");
    $$('.seg button[data-t="'+CSS.escape(b.dataset.t)+'"]').forEach(x=>x.classList.remove("on"));
    if(!was){ b.classList.add("on"); MREC.ticks[b.dataset.t] = b.dataset.v; }
    else delete MREC.ticks[b.dataset.t];
  });
  document.querySelectorAll("input[data-m]").forEach(i => i.oninput = () => {
    if(i.value.trim()==="") delete MREC.measures[i.dataset.m]; else MREC.measures[i.dataset.m] = i.value.trim();
  });
  document.querySelectorAll("input[data-x]").forEach(i => i.oninput = () => {
    if(i.value.trim()==="") delete MREC.texts[i.dataset.x]; else MREC.texts[i.dataset.x] = i.value.trim();
  });
  $("#mNotes").oninput = e => MREC.notes = e.target.value;
  $("#mOrderNo").oninput = e => MREC.orderNo = e.target.value;
  $("#mDate").onchange = e => MREC.date = e.target.value;
  $("#mBy").oninput = e => MREC.measuredBy = e.target.value;
  $("#mUnit").onchange = e => { MREC.unit = e.target.value; $$(".unitlbl").forEach(u=>u.textContent = MREC.unit); };

  $$("#mtabs .tab").forEach(t => t.onclick = () => {
    $$("#mtabs .tab").forEach(x=>x.classList.toggle("on", x===t));
    $$(".panel").forEach(p=>p.classList.toggle("on", p.id==="panel-"+t.dataset.p));
    if(t.dataset.p==="summary") buildSummary();
  });

  $("#abSave").onclick = saveMeasure;
  $("#abPrint").onclick = () => { buildSummary(); window.print(); };
  $("#status").textContent = MREC.savedAt ? "Editing saved record" : "New measurement — not saved yet";
}

function buildSummary(){
  const box = $("#summaryBody"); if(!box) return;
  const c = DB.clients[MREC.clientId];
  const groups = [
    ["Client",[["Client",c?c.name:""],["Order ID",MREC.orderNo],["Date",fmtDate(MREC.date)],["Measured by",MREC.measuredBy],["Unit",MREC.unit==="in"?"Inches":"Centimetres"]]],
    ["Measurements",Object.entries(MREC.measures).map(([k,v])=>[k, v+" "+MREC.unit])],
    ["Options",Object.entries(MREC.ticks)],
    ["Details",Object.entries(MREC.texts).concat(MREC.notes?[["Notes",MREC.notes]]:[])]
  ];
  box.innerHTML = "";
  let any=false;
  groups.forEach(([title,entries])=>{
    const filled = entries.filter(([,v])=>v && String(v).trim()!=="");
    if(!filled.length) return; any = true;
    box.insertAdjacentHTML("beforeend", `<div class="sum-block"><h3>${esc(title)}</h3>
      <div class="sum-rows">${filled.map(([k,v])=>`<div class="sr"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div></div>`);
  });
  if(!any) box.innerHTML = `<div class="empty">Nothing filled in yet.</div>`;
}

function flatMeasure(m){
  const c = DB.clients[m.clientId];
  const row = { "Order ID":m.orderNo, "Client":c?c.name:"", "Phone":c?c.phone||"":"",
    "Date":m.date, "Unit":m.unit, "Measured by":m.measuredBy, "Saved":m.savedAt };
  Object.assign(row, m.measures, m.ticks, m.texts);
  row["Notes"] = m.notes;
  return row;
}
function flatClient(c){
  return { "Name":c.name, "Birthday":c.birthday, "Phone":c.phone, "Email":c.email,
    "Address":c.address, "Likes":c.likes, "Remarks":c.remarks, "Added":c.createdAt };
}
function flatOrder(o){
  const c = DB.clients[o.clientId];
  return { "Order No":o.orderNo, "Client":c?c.name:"", "Date":o.date, "Garments":o.garments,
    "Fabric":o.fabric, "Delivery":o.delivery, "Status":o.status, "Amount":o.amount, "Notes":o.notes };
}

async function saveMeasure(){
  if(!Object.keys(MREC.measures).length && !Object.keys(MREC.ticks).length){
    toast("Nothing to save yet — enter at least one measurement."); return;
  }
  MREC.savedAt = new Date().toISOString();
  DB.measurements[MREC.id] = JSON.parse(JSON.stringify(MREC));
  persist();
  const pushed = await pushToSheets("Measurements", flatMeasure(MREC));
  toast(pushed ? "Saved & pushed to Google Sheets" : "Saved on this device");
  $("#status").textContent = "Saved · " + MREC.orderNo;
}

      phone: $("#cmPhone").value.trim(), email: $("#cmEmail").value.trim(),
      birthday: $("#cmBday").value, city: $("#cmCity").value.trim(),
      address: $("#cmAddr").value.trim(), likes: $("#cmLikes").value.trim(),
      remarks: $("#cmRemarks").value.trim(),
      createdAt: c.createdAt || new Date().toISOString()
    };
    DB.clients[rec.id] = rec; persist(); closeModal();
    pushToSheets("Clients", flatClient(rec));
    toast(c.id ? "Client updated" : "Client added");
    go("client",{id:rec.id});
  };
}

function orderModal(o, clientId){
  o = o || {};
  const cid = o.clientId || clientId;
  openModal(`
  <h2>${o.id?"Edit Order":"New Order"} <span style="font-size:14px;color:var(--ink-soft);font-family:Inter,sans-serif;">· ${esc(DB.clients[cid]?DB.clients[cid].name:"")}</span></h2>
  <div class="grid2">
    <div class="field"><label>Order No</label><input id="omNo" value="${esc(o.orderNo||makeOrderNo())}"></div>
    <div class="field"><label>Order date</label><input id="omDate" type="date" value="${esc(o.date||new Date().toISOString().slice(0,10))}"></div>
    <div class="field full"><label>Garments</label><input id="omGarments" value="${esc(o.garments||"")}" placeholder="${GARMENT_OPTIONS.join(", ")}"></div>
    <div class="field full"><label>Fabric</label><input id="omFabric" value="${esc(o.fabric||"")}" placeholder="Mill, quality, shade"></div>
    <div class="field"><label>Promised delivery</label><input id="omDeliver" type="date" value="${esc(o.delivery||"")}"></div>
    <div class="field"><label>Stage</label><select id="omStatus">${ORDER_STAGES.map(s=>`<option ${s===(o.status||"New")?"selected":""}>${s}</option>`).join("")}</select></div>
    <div class="field"><label>Amount (₹)</label><input id="omAmount" type="number" step="1" value="${esc(o.amount||"")}"></div>
    <div class="field full"><label>Notes</label><textarea id="omNotes">${esc(o.notes||"")}</textarea></div>
  </div>
  <div class="actions">
    ${o.id?`<button class="btn danger" id="omDelete" style="margin-right:auto;">Delete</button>`:""}
    <button class="btn" id="omCancel">Cancel</button>
    <button class="btn primary" id="omSave">${o.id?"Save Changes":"Add Order"}</button>
  </div>`);
  $("#omCancel").onclick = closeModal;
  const del = $("#omDelete");
  if(del) del.onclick = () => {
    if(confirm("Delete this order?")){ delete DB.orders[o.id]; persist(); closeModal(); toast("Order deleted"); render(); }
  };
  $("#omSave").onclick = () => {
    const rec = {
      id: o.id || uid("o"), clientId: cid,
      orderNo: $("#omNo").value.trim(), date: $("#omDate").value,
      garments: $("#omGarments").value.trim(), fabric: $("#omFabric").value.trim(),
      delivery: $("#omDeliver").value, status: $("#omStatus").value,
      amount: $("#omAmount").value.trim(), notes: $("#omNotes").value.trim()
    };
    DB.orders[rec.id] = rec; persist(); closeModal();
    pushToSheets("Orders", flatOrder(rec));
    toast(o.id ? "Order updated" : "Order added");
    render();
  };
}

function pickClientModal(){
  const list = Object.values(DB.clients).sort((a,b)=>a.name.localeCompare(b.name));
  if(!list.length){ clientModal(null); return; }
  openModal(`
  <h2>New Measurement — pick a client</h2>
  <div class="searchrow"><input id="pickSearch" type="text" placeholder="Search clients…"></div>
  <div id="pickList" style="max-height:320px;overflow:auto;"></div>
  <div class="actions"><button class="btn" id="pickCancel">Cancel</button>
    <button class="btn primary" id="pickNew">＋ New Client</button></div>`);
  const draw = q => {
    q = (q||"").toLowerCase();
    $("#pickList").innerHTML = "<table><tbody>"+list
      .filter(c=>!q||(c.name+" "+(c.phone||"")).toLowerCase().includes(q))
      .map(c=>`<tr class="rowlink" data-pick="${c.id}">
        <td><span class="cname"><span class="avatar">${esc(initials(c.name))}</span>${esc(c.name)}</span></td>
        <td style="color:var(--ink-soft);">${esc(c.phone||"")}</td></tr>`).join("")+"</tbody></table>";
    $$("#pickList [data-pick]").forEach(r => r.onclick = () => { closeModal(); ACTIONS.measureFor(r.dataset.pick); });
  };
  draw("");
  $("#pickSearch").oninput = e => draw(e.target.value);
  $("#pickSearch").focus();
  $("#pickCancel").onclick = closeModal;
  $("#pickNew").onclick = () => { closeModal(); clientModal(null); };
}

/* ============================================================
   ACTIONS
   ============================================================ */
const ACTIONS = {
  newClient(){ clientModal(null); },
  editClient(id){ clientModal(DB.clients[id]); },
  newOrder(id){ orderModal(null, id); },
  editOrder(id){ orderModal(DB.orders[id]); },
  newMeasurePick(){ pickClientModal(); },
  measureFor(id){ MREC = blankMeasure(id); go("measure"); },
  openMeasure(id){ MREC = JSON.parse(JSON.stringify(DB.measurements[id])); go("measure"); },
  dupMeasure(id){
    const src = DB.measurements[id];
    MREC = blankMeasure(src.clientId);
    MREC.measures = JSON.parse(JSON.stringify(src.measures));
    MREC.ticks = JSON.parse(JSON.stringify(src.ticks));
    MREC.texts = JSON.parse(JSON.stringify(src.texts));
    MREC.unit = src.unit;
    go("measure");
    toast("Started a new record from "+fmtDate(src.date));
  },
  copyPrev(){
    const prev = Object.values(DB.measurements).filter(m=>m.clientId===MREC.clientId)
      .sort((a,b)=>b.savedAt.localeCompare(a.savedAt))[0];
    if(!prev){ toast("No previous measurement for this client."); return; }
    MREC.measures = JSON.parse(JSON.stringify(prev.measures));
    MREC.ticks = JSON.parse(JSON.stringify(prev.ticks));
    MREC.texts = JSON.parse(JSON.stringify(prev.texts));
    MREC.unit = prev.unit;
    render(); mountMeasure();
    toast("Copied from "+fmtDate(prev.date));
  },
  saveSettings(){
    DB.settings.appsScriptUrl = $("#setUrl").value.trim();
    DB.settings.measuredByDefault = $("#setBy").value.trim();
    persist(); toast("Settings saved");
  },
  exportDb(){
    const blob = new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "modisto-backup-"+new Date().toISOString().slice(0,10)+".json";
    a.click(); URL.revokeObjectURL(a.href);
  },
  importDb(){
    const f = $("#importFile");
    f.onchange = () => {
      const file = f.files[0]; if(!file) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const data = JSON.parse(r.result);
          if(!data.clients) throw 0;
          DB = data; persist(); toast("Backup imported"); go("dashboard");
        }catch(e){ toast("That file doesn't look like a Modisto backup."); }
      };
      r.readAsText(file);
    };
    f.click();
  },
  wipeDb(){
    if(confirm("Erase ALL clients, measurements and orders from this device? Export a backup first if unsure.")){
      DB = { clients:{}, measurements:{}, orders:{}, settings:DB.settings };
      persist(); toast("All data erased"); go("dashboard");
    }
  }
};

/* ---------------- boot ---------------- */
go("dashboard");
</script>
</body>
</html>
